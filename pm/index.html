ace/v2 入库；.NET 与 TS 共用市场结构/跨字段向量，错误码、文件、指针、行号与级别逐字段一致；沿用组件校验器，错误组件不能进入解析结果。<\/li>\n<li>实际 CLI 登记第二市场后合并远程列表，展示来源与优先级；同名首选经无代码安装切片写入 lock，包含市场、source、digest、公钥指纹及可用 commit。confirm、ON_USE、restricted 和未验证 community/no-code 边界均显式处理。<\/li>\n<li>实际 Git 仓库/标签测试确认 @version 选择 refs/tags/v&lt;version&gt;，NuGet/npm 精确版本取自所选清单；分支缺 digest、归档损坏、验签失败、公钥撤销、链接、越界和凭据 URL 被拒绝。<\/li>\n<li>代码包安装/升级/移除、租户 scope 与进程中断后的完整恢复仍归 S1-RT-011；本任务只交付解析验证与真实无代码来源锁定，不宣称依赖包已安装。<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-11 cody：开始：KUN-004 已实现并记录真实身份服务联调阻塞；推进多市场 Schema、可信条目解析与 CLI 来源锁定。<\/li>\n<li>2026-10-11 cody：市场 Schema、双侧语义校验、Ed25519/digest、目录优先级与无代码来源锁定已实现，进入完整回归与 CI。<\/li>\n<li>2026-10-11 cody：完成：PR #30 已合并，全部 14 项适用 CI 检查通过（含双侧一致性、.NET、CLI、文档与前端门禁）；三项验收全部完成。<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-016.md"},{"id":"S1-RT-017","title":"官方市场仓库建立、CI smoke、目录网站生成与社区发现","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-016","S1-RT-011","S1-RT-012","S1-DEC-004","S1-DEC-006"],"blockedBy":["S1-RT-011","S1-RT-012"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.4","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#8.4","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/prd/specs/component-model.md#8.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>按 S1-DEC-004 建立同组织独立私有仓库，布局 <code>plugins/&lt;domain&gt;/&lt;id&gt;/<\/code>，S1 收录全部平台插件、参考应用与至少一个 skill-only 示例组件；CI：每个条目过校验器 + <code>qian add<\/code> 到 <code>minimal<\/code> profile 的 smoke；目录网站静态生成（分类、安装命令、README 渲染、校验状态徽章）；GitHub topic <code>qian-plugin<\/code> 社区发现只发现不信任，安装需 <code>--trust<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>CI：官方市场仓库每个条目指向的组件通过五种表面校验器与清单校验零错误；<code>qian add<\/code> 每个条目到 <code>minimal<\/code> profile 的 smoke 全部通过<\/li>\n<li class='chk'><span class='box'><\/span>E2E：目录网站由 marketplace.json 一条命令生成，条目数、分类与仓库一致，每个条目显示校验状态徽章<\/li>\n<li class='chk'><span class='box'><\/span>IT：经 GitHub topic 发现的社区组件标记「未验证」，<code>qian add<\/code> 该组件在无 <code>--trust<\/code> 时拒绝并说明原因<\/li>\n<li class='chk'><span class='box'><\/span>检查：仓库收录全部 <code>platform<\/code> base 组合包平台插件、参考应用与一个 skill-only 示例<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-017.md"},{"id":"S1-SCH-001","title":"qian.scheduler 核心：持久化作业、集群安全领取、Cancel","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-DATA-001","S1-RT-001","S1-TEN-001"],"blockedBy":["S1-TEN-001"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-012-workflow-engine.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-012-workflow-engine.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.scheduler<\/code>（<code>Qian.Scheduler.Abstractions<\/code> / <code>ctx.Scheduler<\/code> + <code>Qian.Scheduler<\/code>）：<code>job_definitions<\/code> / <code>job_triggers<\/code> / <code>job_runs<\/code>；cron 6/7 段、固定间隔、一次性延时；多租户命名空间；每副本每秒 <code>FOR UPDATE SKIP LOCKED<\/code> 领取到期触发器 + 租约；misfire、并发策略与超时；<code>Cancel(businessKey)<\/code>；<code>local<\/code> 任务类型 <code>[QianJob(&quot;code&quot;)]<\/code>；<code>IScheduler.ScheduleOnce / ScheduleCron / Cancel<\/code>。7.3 到期扫描、7.4 密码提醒、7.12 重试、7.11 链校验的公共前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：3 个副本运行、100 个每分钟触发器，每分钟恰 100 次执行无重复（<code>job_runs<\/code> 按 trigger × 分钟唯一）<\/li>\n<li class='chk'><span class='box'><\/span>IT：杀掉正在执行的副本，租约到期后触发器被另一副本接管并按 misfire 策略处理<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>ScheduleOnce(businessKey)<\/code> 后 <code>Cancel(businessKey)<\/code>，到点不执行；重复 <code>ScheduleOnce<\/code> 同一业务键只保留一条<\/li>\n<li class='chk'><span class='box'><\/span>UT：作业定义 Schema 机器可读；目标必须是能力目录中的 URI，任意 URL 被拒<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-001.md"},{"id":"S1-SCH-002","title":"callback 任务类型回调契约、执行日志与 run 事件","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-SCH-001","S1-IDP-002","S1-CFG-002","S1-EVT-001"],"blockedBy":["S1-SCH-001","S1-IDP-002","S1-EVT-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>callback<\/code> 类型：<code>POST {service}/qian-jobs/{code}<\/code> 按 K8s Service 名寻址，头 <code>X-Qian-Run-Id<\/code>、<code>X-Qian-Signature<\/code>（HMAC，密钥 secretRef），S2S <code>aud = service<\/code>（服务身份 <code>client_credentials<\/code>），幂等键 = run id，超时、重试、结果回写 <code>POST /api/scheduler/runs/{id}/result<\/code>；结构化执行日志（状态、耗时、错误分类、业务结果）；API 与最小管理面；事件 <code>scheduler.run.completed / failed.v1<\/code>；<code>qian.scheduler.job-type/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：回调签名错误被对端拒绝；回调超时后按策略重试并最终写 <code>error_class = timeout<\/code>；对端回写业务失败后 <code>job_runs.business_result = failed<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：回调携带的 S2S 令牌 <code>aud<\/code> 为目标服务且 <code>principal_kind = service<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>jobs.create<\/code> 标 <code>write<\/code> + <code>confirm<\/code>，<code>run-now<\/code> 标 <code>write<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-002.md"},{"id":"S1-SCH-003","title":"qian.realtime：WebSocket/SSE、一次性票据与背板","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-004","S1-GW-001","S1-EVT-001"],"blockedBy":["S1-IDP-004","S1-GW-001","S1-EVT-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.realtime<\/code>（<code>Qian.Realtime.Abstractions<\/code> / <code>ctx.Realtime<\/code> + <code>Qian.Realtime<\/code>，P1，经 <code>gateway<\/code> 透传）：<code>POST /api/realtime/tickets<\/code>（30s 一次性票据）握手鉴权、URL 不接受 <code>access_token<\/code>；Redis Pub/Sub 背板扇出（用户 / 租户 / 全部）；连接表只在 Redis <code>rt:conn:{tenant}:{membership}<\/code>；事件类型目录与 JSON Schema（<code>messagePush<\/code>、<code>unReadMsg<\/code>、<code>online<\/code>、<code>logout<\/code>、<code>identityRevisionChanged<\/code>）作为 <code>@yue/sdk<\/code> 的类型来源；<code>IRealtimePush.PushAsync<\/code>；<code>session_revoked<\/code> → <code>logout<\/code>；无通道时站内信 / 权限刷新降级轮询。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：用户在两个浏览器连接到不同副本，向该用户 <code>Push<\/code> 一次，两个连接各收到一次<\/li>\n<li class='chk'><span class='box'><\/span>IT：票据过期或复用握手失败 401；URL 中不接受 <code>access_token<\/code> 参数<\/li>\n<li class='chk'><span class='box'><\/span>E2E：管理员强制下线后该用户前端 ≤ 3s 收到 <code>logout<\/code> 并跳转登录页<\/li>\n<li class='chk'><span class='box'><\/span>UT：SSE 事件 JSON Schema 为唯一真相源并生成 TS 类型；实例重启后 Redis 连接表自动清理<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-003.md"},{"id":"S1-TEN-001","title":"租户主档、fail-closed 租户上下文与传播器、tenancy API","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-KUN-001","S1-RT-001","S1-DATA-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.tenancy<\/code>（<code>Qian.Tenancy.Abstractions<\/code> / <code>ctx.Tenancy<\/code> + <code>Qian.Tenancy<\/code>）：<code>Tenant<\/code> / <code>TenantAdmin<\/code> 实体（租户号小写字母数字、创建后不可改；隔离策略创建时一次性决定）、<code>ITenantContext<\/code> 唯一实现（AsyncLocal + 中间件，claim <code>tenant_id<\/code>，生产模式禁头兜底与 <code>default<\/code> 回退）、<code>ITenantContextPropagator<\/code>（事件信封、作业参数、gRPC 元数据）、<code>ITenantDirectory.Get(code)<\/code>、<code>GET/POST /api/tenancy/tenants<\/code>、<code>PUT /tenants/{id}<\/code>；独立模式可换宿主 <code>ITenantContext<\/code> 或 <code>SingleTenant<\/code>。第 1 波可信计算基。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：生产模式下无令牌、仅带 <code>X-Tenant-Id<\/code> 的请求与无 <code>tenant_id<\/code> 的消息都被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：运营后台创建租户 A、B（共享库 + RLS），各自管理员登录后只看到本租户数据；以 A 的令牌直接请求 B 的记录 id 返回 404<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>ITenantContextPropagator<\/code> 写入的 <code>tenant_id<\/code> 在消费端、作业执行器、gRPC 对端 <code>BeginScope<\/code> 后可读<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>inputSchema<\/code> 中不出现 <code>tenantId<\/code>；运营接口的目标租户是资源路径<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-001.md"},{"id":"S1-TEN-002","title":"租户状态机、tenant.*.v1 事件、到期扫描与会话吊销联动","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-EVT-001","S1-SCH-001","S1-IDP-004"],"blockedBy":["S1-TEN-001","S1-EVT-001","S1-SCH-001","S1-IDP-004"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>S1 实现 <strong>待激活 → 试用 | 正常 → 宽限 → 冻结 / 恢复<\/strong> 迁移，每次迁移发 <code>tenant.created/activated/suspended/resumed/expired.v1<\/code>；<code>POST /tenants/{id}:activate|suspend|resume<\/code>（幂等 + 审批钩子）；到期扫描作业由 7.13 调度器执行；会话中心订阅后吊销该租户会话；<code>GET /api/tenancy/meta/state-machine<\/code> 机器可读。只读 / 注销 / 数据销毁尾部为 S3。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：租户到期进入宽限后，该租户新登录被拒、已登录会话在 ≤ 60s 内失效（<code>tenant.expired.v1<\/code> → 会话吊销）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：7.3 租户到期扫描作业在 staging 准点触发并发出 <code>tenant.expired.v1<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：非法迁移（如从注销回正常）返回结构化错误；<code>Suspend<\/code> 任一状态可进、<code>Resume<\/code> 回原状态<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>suspend / purge<\/code> 能力标 <code>destructive<\/code> + <code>humanOnly<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-002.md"},{"id":"S1-TEN-003","title":"开通编排 Orchestrator 与幂等步骤表","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-RT-005"],"blockedBy":["S1-TEN-001","S1-RT-005"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>开通编排由 <code>qian.lifecycle<\/code> 承担（R13），<code>qian.tenancy<\/code> 只装配其租户级 <code>Provision<\/code> 入口：创建主档 → <code>ITenantProvisioner.ProvisionAsync<\/code>（Shared + RLS）→ 对每个平台插件与租户 scope 已挂载组件执行 <code>tenantProvision<\/code> 钩子 → 创建租户管理员 Membership → 写初始授权 → 发通知；失败按 <code>tenant_provision_steps<\/code> / <code>lifecycle_runs<\/code> 步骤表重试，不靠事务、不用 Saga。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：开通中途在第 3 步注入失败，重试后从第 3 步继续，前两步不重复执行（<code>tenant_provision_steps<\/code>）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用在租户 A、B 分别开通，<code>lifecycle_runs<\/code> 各有一条成功记录；重复开通幂等<\/li>\n<li class='chk'><span class='box'><\/span>IT：Shared + RLS 策略下开通后 GUC 与策略就绪，租户管理员可登录<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-003.md"},{"id":"S1-TEN-004","title":"租户配置服务 ITenantSettings 与用户配额","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-RT-004","S1-CFG-003","S1-AUD-001"],"blockedBy":["S1-TEN-001","S1-RT-004","S1-CFG-003","S1-AUD-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-007-config-center-apollo.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-007-config-center-apollo.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>ITenantSettings.Get&lt;T&gt;(pluginId, key)<\/code>：值按插件 <code>config.schema<\/code>（<code>scopes: [tenant]<\/code>）校验、变更审计、缓存键带租户前缀；平台默认值来自 Apollo，租户覆盖即租户 scope patch（存 PG <code>scope_patches<\/code>，与文件 patch 同格式同校验器）；<code>GET/PUT /tenants/{id}/settings/{plugin}<\/code>、<code>GET /tenants/{id}/quota<\/code>；单管理员 + 用户配额（不计平台超管、计租户管理员，Q12）。登录策略、密码策略、文件配额都是它的客户。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：用户配额为 5 时第 6 个成员创建返回结构化错误 <code>CARDINALITY_USER_LIMIT<\/code>，平台超管不计入计数<\/li>\n<li class='chk'><span class='box'><\/span>IT：租户级登录策略覆盖写入 <code>TenantSetting<\/code> 后 7.4 在下一次登录即生效，且变更出现在审计链<\/li>\n<li class='chk'><span class='box'><\/span>UT：不符合插件 <code>config.schema<\/code> 的租户覆盖值被拒绝并带 JSON Pointer<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>qian dump-config --scope tenant:&lt;id&gt;<\/code> 打印的合成结果与 <code>ITenantSettings<\/code> 读到的值一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-004.md"},{"id":"S1-TEN-005","title":"运营后台最小 CRUD 页面（yue）：租户列表、新建编辑、管理员、重置密码","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-TEN-001","S1-YUE-007","S1-YUE-008","S1-YUE-009"],"blockedBy":["S1-TEN-001","S1-YUE-007","S1-YUE-008","S1-YUE-009"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>运营后台页面：列表 / 筛选、新建 / 编辑抽屉、授权（调 7.14）、管理员维护（<code>GET/PUT /tenants/{id}/admins<\/code>）、重置密码；用 SchemaForm + DataTable 实现，不出现第二套表单或表格实现。自助申请 / 审核 / 邀请为 S3。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：运营后台创建租户 A、B 并各设管理员，管理员登录后只看到本租户数据<\/li>\n<li class='chk'><span class='box'><\/span>E2E：租户管理页用 OrganizeSelect / UserSelect / RoleSelect / 授权树完成角色授予<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：页面只用 <code>@yue/form<\/code> SchemaForm 与 <code>@yue/data<\/code> DataTable，无第二套实现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-005.md"},{"id":"S1-YUE-001","title":"qian.shell MF2 宿主、插槽注册表、桥接 API 与前端 SDK","status":"todo","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-003","S1-YUE-006","S1-YUE-009"],"blockedBy":["S1-YUE-006","S1-YUE-009"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-013-frontend-yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>外壳是 <code>@qian/runtime<\/code> 上的一棵 TS 插件树，打包为 <code>platform<\/code> 的 <code>shell<\/code> 组合包（静态制品，经 <code>gateway<\/code> 提供，R31）：<code>registerRemotes / loadRemote<\/code>、<code>mf-manifest.json<\/code> 类型提示与预加载；共享 singleton <code>react / react-dom / @yue/* / @qian/plugin-sdk<\/code>、<code>engines.yue<\/code> 校验；六个插槽 <code>qian.shell.nav/v1<\/code>、<code>settings/v1<\/code>、<code>user-menu/v1<\/code>、<code>command/v1<\/code>、<code>preview/v1<\/code>、<code>client-action/v1<\/code>（输入 Schema + 输出类型，租户 scope 贡献遮蔽全局）；桥接 API <code>window.__qian.bridge<\/code>（<code>getContext<\/code> 只读、<code>navigate<\/code>、<code>notify<\/code>、<code>invoke<\/code> 带幂等键、<code>registerClientAction<\/code>），校验调用方远程 ID 与插槽作用域；npm <code>@qian/plugin-sdk<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：<code>engines.yue<\/code> 不满足的远程模块被拒绝加载并在控制台与审计留痕；共享依赖只存在一份 React 实例<\/li>\n<li class='chk'><span class='box'><\/span>UT：桥接 API 拒绝来自未注册远程或超出声明作用域的调用；<code>getContext()<\/code> 返回对象不可写<\/li>\n<li class='chk'><span class='box'><\/span>UT：租户 scope 的插槽贡献遮蔽同名全局贡献；客户端动作注册表（名称、参数 JSON Schema、权限、人话描述）可导出 JSON<\/li>\n<li class='chk'><span class='box'><\/span>包 <code>@qian/plugin-sdk<\/code> 发布到私有 feed，含注册远程、导航与插槽贡献、<code>PlatformClient<\/code>、拦截器链<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-YUE-001.md"},{"id":"S1-YUE-002","title":"外壳认证流程、租户切换、菜单路由、运行时配置注入与兜底页","status":"todo","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-YUE-001","S1-IDP-003","S1-GW-001","S1-RT-004"],"blockedBy":["S1-YUE-001","S1-IDP-003","S1-GW-001","S1-RT-004"],"order":7,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>OIDC code + PKCE、<code>AuthProvider<\/code> 契约、刷新队列合并、多租户选择、过期弹窗；后端菜单 → 路由（<code>menuTypeRegistry<\/code>：页面、外链）；租户切换器（令牌重签）+ 平台代管常驻横幅；主题 / 语言切换、用户下拉；403 / 404 / 500 / 离线兜底与 ErrorBoundary；<code>window.__APP_CONF__<\/code>（K8s ConfigMap）；<code>Preferences<\/code> 注入；站内信顶栏弹窗；加载规则：租户 scope 已挂载 ∧ 路由需要的插槽 → <code>loadRemote<\/code>（权益接线在 S1-ENT-002）；令牌不进 localStorage / URL / iframe。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：登录 → 多租户选择 → 切换租户 → 令牌重签 → 菜单与权限随之刷新；令牌过期时刷新队列合并并发请求，失败弹过期对话框<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用的远程模块在租户 A scope 已挂载时按需加载并出现在导航；在租户 B scope 未挂载时 <code>mf-manifest.json<\/code> 不被请求<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：<code>localStorage<\/code> 中不存在 access/refresh token 明文；URL 与 iframe src 中不出现令牌<\/li>\n<li class='chk'><span class='box'><\/span>E2E：改 ConfigMap 中 <code>__APP_CONF__.apiBase<\/code> 后刷新即生效，不重编译<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-YUE-002.md"},{"id":"S1-YUE-003","title":"yue 工程化基线、CI 门禁矩阵与 Base UI 验证门","status":"done","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"infra","owner":"claude","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/yue.md"},{"path":"docs/adr/ADR-013-frontend-yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/migration/README.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-09","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>pnpm workspace + <code>catalog:<\/code> + Turborepo；eslint-plugin-boundaries / dependency-cruiser 六层边界进 CI；tsdown 或 Rslib 输出 ESM + d.ts、CSS 单独导出；Storybook 10（a11y、令牌可视化页）；Vitest 5 + Testing Library + <code>@vitest/browser<\/code>；orval / openapi-typescript 契约类型；axe + Playwright <code>critical = 0<\/code>；Lighthouse CI 首屏预算；CI 门禁矩阵（lint、typecheck、unit、a11y、Lighthouse、边界、publint、循环依赖）；Changesets + SemVer；私有 npm；<code>data-testid<\/code> 命名约定。首迭代验证 Menu / Select / Combobox / Tabs / Tooltip / Tree 的键盘与可访问性，不通过整体切 Radix、不混用。<\/p>\n<h4>验收<\/h4 t、OrganizeSelect、UserSelect、RoleSelect、菜单 / 按钮授权树、IconPicker，全部经注入的 <code>PlatformClient<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：参考应用用 <code>OrganizeSelect<\/code> 选部门、<code>UserSelect<\/code> 选人，数据来自本租户目录<\/li>\n<li class='chk'><span class='box'><\/span>UT：注册表可导出 JSON；拦截器链在令牌过期时合并并发刷新<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>@yue/biz<\/code> 组件不直接发请求，只经注入的 <code>PlatformClient<\/code>；i18n 全部走 key<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-YUE-009.md"},{"id":"S2-DOCS-001","title":"站内「问 AI」挂件：自有模型网关 + 文档检索 + 引用来源","status":"todo","stage":"S2","area":"DOCS","areaName":"文档站与组件文档","wave":1,"priority":"P1","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-DOCS-003","S1-MGW-001","S1-YUE-005"],"blockedBy":["S1-MGW-001","S1-YUE-005"],"order":2,"readyNow":false,"refs":[{"path":"docs/adr/ADR-013-frontend-yue.md#D13.18","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/adr/ADR-015-model-gateway.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-015-model-gateway.md"},{"path":"docs/adr/ADR-016-iclaw-boundary.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-016-iclaw-boundary.md"},{"path":"docs/prd/10-s4-agent.md","url":"https://github.com/idadawn/qian/blob/main/docs/prd/10-s4-agent.md"}],"updated":"2026-10-07","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>Rspress 自身不带站内 AI 聊天，这一块按 ADR-013 D13.18 用自己的栈实现：检索基于 S1-DOCS-003 产出的 <code>.md<\/code> 与 <code>kb-index.json<\/code>（由产品负责人规划的知识库承载），模型调用经模型网关（Higress + GPUStack，ADR-015），Agent 运行时侧按 ADR-016 复用 iClaw（经 MCP / HTTP），挂件本身是一个 yue 组件。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>yue 组件 <code>&lt;AskDocs&gt;<\/code> 可嵌入文档站右下角与搜索框，支持流式回答，回答末尾列出来源页链接（至少 1 条、最多 5 条）<\/li>\n<li class='chk'><span class='box'><\/span>检索走知识库接口，命中内容来自 S1-DOCS-003 的 <code>.md<\/code> 产物；知识库不可用时自动降级为站内搜索并明示<\/li>\n<li class='chk'><span class='box'><\/span>模型调用只经模型网关，不直连任何第三方模型服务；网关侧有租户与配额计量（ADR-015）<\/li>\n<li class='chk'><span class='box'><\/span>默认不保存对话内容；是否记录可在站点配置开关，并在界面明示<\/li>\n<li class='chk'><span class='box'><\/span>IT：对 20 条「组件如何使用」类问题的回答全部给出正确来源页（人工评审集，纳入发布前检查）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-07 claude：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S2-DOCS-001.md"}];
const STATUS = {todo:'待办',doing:'进行中',review:'待评审',done:'已完成',blocked:'阻塞'};
const ORDER = ['todo','doing','review','done','blocked'];
const $ = s => document.querySelector(s);
const by = {}; TASKS.forEach(t => by[t.id] = t);
let view = 'board', sortKey = 'order', sortAsc = true;

function fill(sel, vals, label){ const s=$(sel); [...new Set(vals)].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;s.appendChild(o);}); }
fill('#f-stage', TASKS.map(t=>t.stage));
fill('#f-area', TASKS.map(t=>t.area), v=>`${v} ${(TASKS.find(t=>t.area===v)||{}).areaName||''}`);
fill('#f-wave', TASKS.map(t=>String(t.wave)), v=>v==='0'?'决策':`第 ${v} 波`);
fill('#f-status', ORDER.filter(s=>TASKS.some(t=>t.status===s)), v=>STATUS[v]);
fill('#f-priority', TASKS.map(t=>t.priority));
fill('#f-owner', TASKS.map(t=>t.owner||'（未认领）'));

function filtered(){
  const g = id => $(id).value, q = $('#f-q').value.trim().toLowerCase();
  return TASKS.filter(t =>
    (!g('#f-stage')||t.stage===g('#f-stage')) && (!g('#f-area')||t.area===g('#f-area')) &&
    (!g('#f-wave')||String(t.wave)===g('#f-wave')) && (!g('#f-status')||t.status===g('#f-status')) &&
    (!g('#f-priority')||t.priority===g('#f-priority')) && (!g('#f-owner')||(t.owner||'（未认领）')===g('#f-owner')) &&
    (!q||t.id.toLowerCase().includes(q)||t.title.toLowerCase().includes(q)));
}
const w = t => $('#weighted').checked ? (t.days||1) : 1;
function pct(list){ const tot=list.reduce((a,t)=>a+w(t),0); const done=list.filter(t=>t.status==='done').reduce((a,t)=>a+w(t),0); const doing=list.filter(t=>t.status==='doing'||t.status==='review').reduce((a,t)=>a+w(t),0); return {tot,done,doing,p:tot?Math.round(done*100/tot):0,pd:tot?Math.round(doing*100/tot):0}; }
function orderChip(t){ if(t.status!=='todo'&&t.status!=='blocked') return ''; return t.readyNow?'<span class="chip ok">可开始</span>':`<span class="chip wait">第 ${t.order+1} 批 · 等 ${t.blockedBy.length} 个前置</span>`; }
function chip(t){ return `${orderChip(t)}<span class="chip ${t.priority.toLowerCase()}">${t.priority}</span><span class="chip">${t.area}</span><span class="chip">w${t.wave}</span>${t.owner?`<span class="chip">${esc(t.owner)}</span>`:''}${t.blockedBy.length&&t.status!=='done'?`<span class="chip blk">被阻塞 ${t.blockedBy.length}</span>`:''}`; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const list = filtered();
  const all = pct(TASKS), cur = pct(list);
  $('#pdone').style.width = all.p+'%';
  $('#meta').textContent = `总体 ${all.p}% · ${TASKS.length} 个任务 · 最近更新 ${TASKS.map(t=>t.updated).sort().pop()||'—'}`;
  const k = s => list.filter(t=>t.status===s).length;
  $('#kpis').innerHTML = `<div class="kpi"><b>${cur.p}%</b><span>当前筛选完成度${$('#weighted').checked?'（加权）':''}</span></div>` +
    ORDER.map(s=>`<div class="kpi"><b>${k(s)}</b><span>${STATUS[s]}</span></div>`).join('') +
    `<div class="kpi"><b>${list.filter(t=>t.blockedBy.length&&t.status!=='done').length}</b><span>被未完成依赖阻塞</span></div>`;
  ['board','table','progress','deps'].forEach(v=>$('#v-'+v).hidden = v!==view);
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  if(view==='board') renderBoard(list); else if(view==='table') renderTable(list); else if(view==='progress') renderProgress(list); else renderDeps(list);
}
function card(t){ return `<div class="card" data-id="${t.id}"><div class="id">${t.id} · ${esc(t.estimate)} · ${t.updated}</div><div class="t">${esc(t.title)}</div><div class="chips">${chip(t)}</div></div>`; }
function renderBoard(list){
  $('#v-board').innerHTML = ORDER.map(s=>{ const items=list.filter(t=>t.status===s).sort((a,b)=>(s==='todo'||s==='blocked')?(a.order-b.order||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id)):(a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id))); return `<div class="col"><h3>${STATUS[s]} · ${items.length}${s==='todo'?' <small>（按可做先后）</small>':''}</h3>${items.map(card).join('')||'<div class="empty">—</div>'}</div>`; }).join('');
}
function renderTable(list){
  const cols=[['order','顺序'],['id','ID'],['title','标题'],['status','状态'],['priority','优先级'],['wave','波次'],['area','领域'],['owner','负责人'],['estimate','估算'],['updated','更新']];
  const rows=[...list].sort((a,b)=>{ if(sortKey==='order'){ const d=(a.order-b.order)||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id); return d*(sortAsc?1:-1);} const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*(sortAsc?1:-1);});
  $('#v-table').innerHTML = `<table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortAsc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(t=>`<tr data-id="${t.id}"><td>${t.status==='done'?'—':(t.readyNow?'<span class="chip ok">可开始</span>':(t.status==='todo'||t.status==='blocked')?`第 ${t.order+1} 批`:STATUS[t.status])}</td><td><code>${t.id}</code></td><td>${esc(t.title)}${t.blockedBy.length&&t.status!=='done'?' <span class="chip blk">阻塞</span>':''}</td><td>${STATUS[t.status]}</td><td><span class="chip ${t.priority.toLowerCase()}">${t.priority}</span></td><td>${t.wave===0?'决策':t.wave}</td><td>${t.area}</td><td>${esc(t.owner||'—')}</td><td>${esc(t.estimate)}</td><td>${t.updated}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">没有匹配的任务</td></tr>'}</tbody></table>`;
  $('#v-table').querySelectorAll('th').forEach(th=>th.onclick=()=>{ if(sortKey===th.dataset.k) sortAsc=!sortAsc; else {sortKey=th.dataset.k; sortAsc=true;} render(); });
}
function group(list, key, label){
  const g={}; list.forEach(t=>{const k=key(t); (g[k]=g[k]||[]).push(t);});
  return Object.keys(g).sort().map(k=>{const p=pct(g[k]); return `<div class="pline"><span>${label?label(k,g[k]):k}</span><div class="bar"><i style="width:${p.p}%"></i><i class="doing" style="width:${p.pd}%;margin-top:-10px;margin-left:${p.p}%"></i></div><span class="n">${p.p}% · ${g[k].filter(t=>t.status==='done').length}/${g[k].length}</span></div>`;}).join('');
}
function renderProgress(list){
  $('#v-progress').innerHTML = [
    ['按阶段', group(list, t=>t.stage)],
    ['按波次', group(list, t=>String(t.wave), k=>k==='0'?'决策（wave 0）':`第 ${k} 波`)],
    ['按领域', group(list, t=>t.area, (k,g)=>`${k} ${g[0].areaName}`)],
    ['按负责人', group(list, t=>t.owner||'（未认领）')],
    ['按优先级', group(list, t=>t.priority)],
  ].map(([h,b])=>`<div class="pbox"><h3>${h}</h3>${b||'<div class="empty">—</div>'}</div>`).join('');
}
function renderDeps(list){
  const blocked = list.filter(t=>t.status!=='done'&&(t.status==='blocked'||t.blockedBy.length)).sort((a,b)=>a.order-b.order||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id));
  const ready = list.filter(t=>t.status==='todo'&&!t.blockedBy.length).sort((a,b)=>a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id));
  $('#v-deps').innerHTML = `<div class="prog"><div class="pbox"><h3>可以开始（无未完成依赖的待办）· ${ready.length}</h3>${ready.map(card).join('')||'<div class="empty">—</div>'}</div><div class="pbox"><h3>被阻塞 · ${blocked.length}</h3>${blocked.map(t=>`<div class="card" data-id="${t.id}"><div class="id">${t.id}</div><div class="t">${esc(t.title)}</div><div class="hint">${t.status==='blocked'?'状态为阻塞':''} ${t.blockedBy.length?'等待：'+t.blockedBy.map(d=>`<code>${d}</code>`).join(' '):''}</div></div>`).join('')||'<div class="empty">—</div>'}</div></div>`;
}
function openTask(id){
  const t = by[id]; if(!t) return;
  $('#dbody').innerHTML = `<h2>${t.id} ${esc(t.title)}</h2><div class="meta">${STATUS[t.status]} · ${t.priority} · ${t.stage} 第 ${t.wave} 波 · ${t.area} ${esc(t.areaName)} · ${esc(t.estimate)} · 负责人 ${esc(t.owner||'未认领')} · 更新 ${t.updated}</div><div class="chips">${chip(t)}</div>
    ${t.depends.length?`<h4>依赖</h4><div>${t.depends.map(d=>`<a href="#" data-id="${d}"><code>${d}</code></a> ${by[d]?esc(by[d].title)+'（'+STATUS[by[d].status]+'）':''}`).join('<br>')}</div>`:''}
    ${t.refs.length?`<h4>文档</h4><div>${t.refs.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.path)}</a>`).join('<br>')}</div>`:''}
    <h4>文件</h4><div><a href="https://github.com/idadawn/qian/blob/main/${t.file}" target="_blank" rel="noopener">${t.file}</a></div>
    ${t.bodyHtml}`;
  $('#drawer').classList.add('open');
  $('#dbody').querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openTask(a.dataset.id);});
}
document.addEventListener('click', e => { const c = e.target.closest('[data-id]'); if(c && !e.target.closest('a[href]') && !e.target.closest('#dbody')) openTask(c.dataset.id); });
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
document.querySelectorAll('select,#f-q,#weighted').forEach(el=>el.addEventListener('input',render));
$('#reset').onclick=()=>{document.querySelectorAll('select').forEach(s=>s.value='');$('#f-q').value='';render();};
$('#close').onclick=()=>$('#drawer').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open');});
render();
</script>
</body>
</html>
