<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qian 项目看板</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2ff;--p0:#dc2626;--p1:#d97706;--p2:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a21;--fg:#e5e7eb;--muted:#9aa3b2;--line:#262b36;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1e2433}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--fg:#e5e7eb;--muted:#9aa3b2;--line:#262b36;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1e2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
h1{font-size:18px;margin:0 0 8px}h1 small{color:var(--muted);font-weight:400;margin-left:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar i.doing{background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.kpi b{font-size:22px;display:block}.kpi span{color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:200px}
.col h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.card:hover{border-color:var(--accent)}.card .id{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.card .t{margin:2px 0 6px}.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--chip);color:var(--fg)}
.chip.p0{background:var(--p0);color:#fff}.chip.p1{background:var(--p1);color:#fff}.chip.p2{background:var(--p2);color:#fff}
.chip.blk{background:var(--bad);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.wait{background:var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;user-select:none}
tr:hover td{background:var(--bg)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.pbox h3{margin:0 0 8px;font-size:14px}
.pline{display:grid;grid-template-columns:140px 1fr 90px;gap:8px;align-items:center;margin:4px 0;font-size:13px}.pline .n{color:var(--muted);text-align:right}
.drawer{position:fixed;top:0;right:0;width:min(640px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;z-index:10;overflow:auto;padding:16px}
.drawer.open{transform:none}.drawer h2{font-size:16px;margin:0 0 6px}.drawer .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.drawer h4{margin:14px 0 4px;font-size:13px;color:var(--muted)}.drawer ul{padding-left:18px}.drawer li.chk{list-style:none;margin-left:-18px}.drawer li.chk .box{display:inline-block;width:14px;height:14px;border:1px solid var(--muted);border-radius:3px;margin-right:6px;font-size:10px;line-height:12px;text-align:center}
.drawer li.chk.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.drawer code,.card code{font:12px ui-monospace,Menlo,monospace;background:var(--chip);padding:0 4px;border-radius:3px}
.drawer a{color:var(--accent)}.x{position:absolute;top:10px;right:12px}
.empty{color:var(--muted);text-align:center;padding:30px}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
@media (max-width:720px){.board{grid-template-columns:repeat(5,80vw)}.pline{grid-template-columns:100px 1fr 70px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Qian 项目看板 <small id="meta"></small></h1>
  <div class="bar"><i id="pdone"></i></div>
  <div class="hint">任务真相源是 <code>pm/tasks/*.md</code>；本页由 <code>python3 scripts/pm.py build</code> 生成。改状态请改文件并提交，不要只改这里。</div>
  <div class="row">
    <button data-view="board" class="on">看板</button><button data-view="table">列表</button><button data-view="progress">进度</button><button data-view="deps">阻塞与依赖</button>
    <select id="f-stage"><option value="">全部阶段</option></select>
    <select id="f-area"><option value="">全部领域</option></select>
    <select id="f-wave"><option value="">全部波次</option></select>
    <select id="f-status"><option value="">全部状态</option></select>
    <select id="f-priority"><option value="">全部优先级</option></select>
    <select id="f-owner"><option value="">全部负责人</option></select>
    <input id="f-q" placeholder="搜索 id / 标题" size="18">
    <button id="reset">清除筛选</button>
    <label><input type="checkbox" id="weighted"> 按工作量加权</label>
  </div>
</div></header>
<main><div class="wrap">
  <div class="kpis" id="kpis"></div>
  <section id="v-board" class="board"></section>
  <section id="v-table" hidden></section>
  <section id="v-progress" class="prog" hidden></section>
  <section id="v-deps" hidden></section>
</div></main>
<aside class="drawer" id="drawer"><button class="x" id="close">关闭</button><div id="dbody"></div></aside>
<script>
const TASKS = [{"id":"S1-AGT-001","title":"contracts/v0 冻结文件与 ErrorDetail 结构化错误","status":"done","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":1,"priority":"P0","type":"doc","owner":"claude","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"contracts/v0/README.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/README.md"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"},{"path":"docs/adr/ADR-018-stages-s1-scope.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-018-stages-s1-scope.md"},{"path":"docs/adr/ADR-016-iclaw-boundary.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-016-iclaw-boundary.md"}],"updated":"2026-10-08","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 2 项与技术落点：<code>contracts/v0/<\/code> 下 S2S claim、事件 envelope、ErrorDetail、能力条目四份 JSON Schema（2020-12 + <code>additionalProperties: false<\/code>，<code>x-status: draft<\/code> 期允许破坏性修订），附与 iClaw 对齐的差异说明；<code>Kun.AspNetCore<\/code> ProblemDetails + Qian <code>ErrorDetail { code, message, trace_id, pointer?, allowed? }<\/code>，区分协议错误与业务错误；错误码与文案 JSON 导出。契约先行，供 7.4 / 7.5 / 7.10 / 7.11 消费。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>文档：<code>contracts/v0/<\/code> 下存在 S2S claim、事件 envelope、ErrorDetail、能力条目四份 JSON Schema，并有与 iClaw 对齐的差异说明<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：任一业务错误响应符合 <code>ErrorDetail<\/code> Schema，含稳定 <code>code<\/code> 与（字段错误时）JSON Pointer<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：协议错误与业务错误以不同 <code>type<\/code> / 状态码区分；错误码与多语言文案可导出 JSON<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：开始<\/li>\n<li>2026-10-07 claude：contracts/v0 落盘：error-detail / error-catalog / s2s-claims / event-envelope / capability-entry 五份 Schema（2020-12、封闭对象、x-status: draft）+ 正例 / 反例 / 语义反例 fixture + 内置错误码目录 error-codes.json；iclaw-alignment.md 逐项差异（已用 iClaw events-schema 实测）<\/li>\n<li>2026-10-07 claude：代码：packages/Qian.Runtime.Errors（ErrorCode / ErrorCatalog / QianError / ErrorDetail / PlatformErrors 26 个内置码 / JSON 导出）与 Qian.Runtime.Errors.AspNetCore（AddQianErrors / UseQianErrors / QianResults，ProblemDetails 规范化）；tests/Qian.Runtime.Errors.Tests 151 项全过<\/li>\n<li>2026-10-07 claude：默认裁决 8 条见 contracts/v0/README.md 第 8 节，新建 S1-DEC-010 待确认（R32 的 403 原因承载须在 S1-RT-004 前定，已给 RT-004 加依赖）；EVT-001 / GW-001 / KUN-004 / RT-008 补 contracts 引用<\/li>\n<li>2026-10-07 claude：四份契约 Schema + 差异说明 + ErrorDetail 结构化错误（.NET 两包）完成，验收三项满足，提交评审<\/li>\n<li>2026-10-08 claude：同步 main 时处理撞号：默认裁决任务改为 S1-DEC-010，contracts/v0/README.md、docs/README.md、S1-RT-004 的引用一并改<\/li>\n<li>2026-10-08 claude：已合并 PR #2<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-001.md"},{"id":"S1-AGT-002","title":"能力条目 Agent 字段、反向权限落库与禁租户字段 lint","status":"todo","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-006","S1-RT-014","S1-RT-004"],"blockedBy":["S1-RT-006","S1-RT-014","S1-RT-004"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 5、6、11 项：能力条目 Agent 字段（<code>sideEffect: read|write|external|destructive<\/code>、<code>policyHint<\/code>、<code>idempotent<\/code>、<code>async<\/code>、<code>requiredScopes<\/code>、<code>requiredSecrets<\/code>、<code>dataClassification<\/code>、<code>costTier<\/code>、<code>contractVersion<\/code>、<code>schemaSha256<\/code>、<code>agent.expose / requiresConfirmation<\/code>）S1 全部落库不派生；清单 <code>permissions.platform/data/egress/secrets/ui<\/code> 落库（租户管理员批准 S1 API、S2 UI）；<code>inputSchema<\/code> 禁 tenant 字段的清单校验与契约 lint；OpenAPI 3.1 + <code>operationId<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities<\/code> 对同一插件返回的条目含全部 Agent 字段，且 <code>schemaSha256<\/code> 与 <code>pack<\/code> 时计算值一致<\/li>\n<li class='chk'><span class='box'><\/span>TCK：<code>inputSchema<\/code> 含 <code>tenantId<\/code> 的能力安装失败并返回带 JSON Pointer 的错误<\/li>\n<li class='chk'><span class='box'><\/span>UT：清单 <code>permissions.*<\/code> 五类落库并可经 API 读取；安装时需租户管理员批准的 API 存在<\/li>\n<li class='chk'><span class='box'><\/span>contracts/v0 全部 Schema 去掉 <code>x-status: draft<\/code> 并转 additive-only（条件：S1-RT-004 / S1-IDP-001 / S1-AZ-001 / S1-EVT-001 / S1-GW-001 均已进入 review；R53，contracts/v0/README.md 第 8 节第 9 条）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-08 claude：验收补一条「去掉 contracts/v0 的 draft」（S1-DEC-010 R53）<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-002.md"},{"id":"S1-AGT-003","title":"主体模型与委托链落位验证：agent / act / actor_type","status":"todo","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":2,"priority":"P0","type":"test","owner":"","estimate":"2d","days":2.0,"depends":["S1-IDP-002","S1-AUD-001","S1-RT-006"],"blockedBy":["S1-IDP-002","S1-AUD-001","S1-RT-006"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 3、7、8、12 项的跨组件验证：<code>Client.type<\/code> 枚举含 <code>agent<\/code>、令牌预留 <code>act<\/code> / <code>profile<\/code>、<code>client_credentials<\/code> 可用；审计 <code>actor_type<\/code> 含 <code>agent<\/code> 与 <code>channel = mcp<\/code>；计量 <code>principal_kind = agent<\/code>；所有 API 无会话亲和；Operation 状态枚举 <code>working / input_required / completed / failed / cancelled<\/code> 在 SDK 契约包预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：以 <code>principal_kind = service<\/code> 的 <code>client_credentials<\/code> 令牌调用能力，审计记录 <code>actor_type = service<\/code>；Schema 中 <code>actor_type<\/code> 可取 <code>agent<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>Client.type<\/code> 可取 <code>agent<\/code>；令牌 Schema 含 <code>act<\/code> / <code>profile<\/code> 预留位且 S1 不启用<\/li>\n<li class='chk'><span class='box'><\/span>UT：Operation 状态枚举在 SDK 契约包中存在且为五值<\/li>\n<li class='chk'><span class='box'><\/span>IT：两个 platform 副本间无会话亲和，任一请求可由任一副本处理<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-003.md"},{"id":"S1-AUD-001","title":"qian.audit 命令级哈希链与 AuditBehavior 监听器","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-005","S1-RT-001","S1-DATA-001"],"blockedBy":["S1-KUN-005","S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-009-audit.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-009-audit.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.audit<\/code>（<code>Qian.Audit.Abstractions<\/code> / <code>ctx.Audit<\/code> + <code>Qian.Audit<\/code>，随 SDK 进每个 .NET profile）：<code>audit_entries<\/code>（tenant_id、seq、prev_hash、content_hash UNIQUE、actor_type ∈ user | service | agent、on_behalf_of、capability_id、contract_version、input_hash、channel ∈ ui | api | mcp | a2a | job | event、resource、result、trace_id、payload）与 <code>audit_chain_state<\/code>（按租户一条链 + 平台链，<code>SERIALIZABLE<\/code> 读 tip 更新、冲突重试）；<code>content_hash = SHA256(prev_hash || canonical_json(entry))<\/code>；Mediator <code>AuditBehavior<\/code> 读 <code>[Capability(Audit = true)]<\/code>，命令默认记录、查询 opt-in，记输入哈希并按 Schema <code>sensitive<\/code> 脱敏；作为 base 组合包的 <code>waterfall<\/code> 监听器，卸载即逆序撤销；<code>IAuditWriter<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用一次「创建客户」命令产生 1 条 <code>audit_entries<\/code>（<code>capability_id = crm.customer.create<\/code>）；事务回滚时不存在<\/li>\n<li class='chk'><span class='box'><\/span>IT：两个副本并发写同一租户链 1000 条，<code>seq<\/code> 连续、<code>prev_hash<\/code> 严格串联<\/li>\n<li class='chk'><span class='box'><\/span>IT：以 <code>actor_type = agent, on_behalf_of = &lt;user&gt;<\/code> 记录一条审计并可按 <code>on_behalf_of<\/code> 查询<\/li>\n<li class='chk'><span class='box'><\/span>UT：敏感字段按 Schema <code>sensitive<\/code> 脱敏后参与 <code>input_hash<\/code>；查询默认不记录、<code>Audit = true<\/code> 后记录<\/li>\n<li class='chk'><span class='box'><\/span>UT：卸载组件时 <code>waterfall<\/code> 监听器被逆序撤销<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-001.md"},{"id":"S1-AUD-002","title":"实体级同事务 AuditLog、IAuditReader 与链校验作业","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AUD-001","S1-EVT-001","S1-SCH-001"],"blockedBy":["S1-AUD-001","S1-EVT-001","S1-SCH-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>QianAuditSaveChangesInterceptor<\/code> 在 <code>SavingChangesAsync<\/code> 写 <code>audit_logs<\/code>（字段级 diff）并投递 <code>qian.audit.record.v1<\/code> 到 Outbox，与业务同事务提交；<code>IAuditReader<\/code>：<code>GET /api/audit/entries?tenant=&amp;actor=&amp;capability=&amp;from=&amp;to=<\/code>、<code>GET /api/audit/logs?entity=&amp;key=<\/code>，租户视角只见本租户、平台视角可跨租户但本身被审计；保留策略；链校验作业（P1，经 7.13 调度）重放全链比对；仓库内不再引用废弃的事后拦截器。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：「创建客户」命令产生的 <code>audit_entries<\/code> 与 <code>audit_logs<\/code>（字段级 diff）<code>trace_id<\/code> 相同；事务回滚时两者都不存在<\/li>\n<li class='chk'><span class='box'><\/span>IT：篡改任一历史 <code>audit_entries.payload<\/code> 后链校验作业报告断链位置<\/li>\n<li class='chk'><span class='box'><\/span>IT：租户视角 <code>IAuditReader<\/code> 查不到其他租户记录；平台视角跨租户查询本身产生审计条目<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：仓库内不存在对 <code>Kun.Audit.EntityFrameworkCore.AuditSaveChangesInterceptor<\/code> 的引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-002.md"},{"id":"S1-AUD-003","title":"qian.observability：baggage 贯通、日志与健康检查","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-001","S1-TEN-001","S1-EVT-002"],"blockedBy":["S1-TEN-001","S1-EVT-002"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.observability<\/code>（<code>Qian.Observability.Abstractions<\/code> + <code>Qian.Observability<\/code>，随 SDK）：<code>AddQianObservability()<\/code> 一行装配 + 网关宿主接入；baggage <code>tenant.id / user.id / membership.id / plugin.id / principal.kind<\/code> 在租户中间件、消息订阅器、作业执行器三处写入，<code>agent.id / run.id<\/code> 预留；<code>traceparent<\/code> 贯通 HTTP、gRPC、RabbitMQ 头与作业参数；日志结构化（<code>tenant_id<\/code>、<code>trace_id<\/code>）；指标前缀 <code>qian_<\/code>；<code>PgHealthCheck / RedisHealthCheck / RabbitMqHealthCheck / ApolloHealthCheck<\/code> 聚合到 <code>/readyz<\/code>；OTel 语义约定文档。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：外壳一次请求 → 网关 → platform → RabbitMQ 消费 → 作业回调，在 Tempo 中为一条 trace，每个 span 带 <code>tenant.id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>E2E：拔掉 RabbitMQ 后 <code>/readyz<\/code> 503、<code>/healthz<\/code> 200；恢复后 <code>/readyz<\/code> 200<\/li>\n<li class='chk'><span class='box'><\/span>UT：三处写入点（中间件、订阅器、作业执行器）均设置 baggage；日志行含 <code>tenant_id<\/code> 与 <code>trace_id<\/code> 字段<\/li>\n<li class='chk'><span class='box'><\/span>文档：OTel 语义约定（baggage 键、指标前缀、span 命名）入开发手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-003.md"},{"id":"S1-AUD-004","title":"计量事件 qian.meter.v1、IMeter 与 Grafana 仪表盘","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-AUD-003","S1-EVT-001"],"blockedBy":["S1-AUD-003","S1-EVT-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.16","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>IMeter.Record(...)<\/code> 产出 <code>qian.meter.v1<\/code>（tenant_id、project_id?、plugin_id、principal_kind、capability_id、unit、quantity）经 Outbox 落 append-only <code>meter_events<\/code>，从第一天带租户 / 项目双键；标准仪表盘与 SLO 指标（P1）：请求量 / 错误率 / 延迟 / Outbox 积压 / 消费重试；供 7.16 模型调用计量与 S3 计费复用。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用调用一次 <code>files.presign-upload<\/code> 产生一条 <code>meter_events<\/code>（<code>unit = request<\/code>），带 <code>tenant_id<\/code> 与 <code>plugin_id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>meter_events<\/code> 为 append-only，<code>principal_kind<\/code> 可取 <code>agent<\/code><\/li>\n<li class='chk'><span class='box'><\/span>代码审查：Grafana 仪表盘 JSON 入 git，含请求量 / 错误率 / 延迟 / Outbox 积压 / 消费重试五类面板（P1）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-004.md"},{"id":"S1-AZ-001","title":"Qian.Authz.Abstractions 契约先行：端口、命名与错误码","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-KUN-006","S1-RT-001","S1-AGT-001"],"blockedBy":["S1-KUN-006"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.4","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-006-authorization-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-006-authorization-model.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>与 7.4 互为前置、契约先行：Definition 暴露 <code>ctx.Authz<\/code> 并再导出 <code>Kun.Authorization<\/code> 端口（<code>IPermissionChecker<\/code> / <code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code>；端口归属见 ADR-019 §7 待确认）；<code>PermissionDefinition<\/code>（资源类型、动作、风险级别、step-up、终端）；权限点命名规范 <code>&lt;plugin-id&gt;:&lt;resource&gt;:&lt;action&gt;<\/code>（R9）；<code>Check / BatchCheck / ListAllowedActions / ListPermissions / Explain<\/code> 接口形状；结构化错误码目录（<code>AUTHZ_DENIED<\/code>、<code>CONSTRAINT_MUTEX<\/code>、<code>CARDINALITY_USER_LIMIT<\/code>、<code>PARTIAL_SUCCESS<\/code> …）与多语言文案 JSON 导出。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：<code>Qian.Authz.Abstractions<\/code> 只依赖 <code>Kun.Authorization<\/code> 端口、<code>Kun.*.Abstractions<\/code> 与 <code>Qian.Runtime<\/code>，通过 PublicAPI 分析器<\/li>\n<li class='chk'><span class='box'><\/span>UT：权限点全名拼接规则与 <code>qian.sample.crm:customer:read<\/code> 等样例通过单测；清单 <code>resource<\/code> 不带插件前缀<\/li>\n<li class='chk'><span class='box'><\/span>UT：错误码目录与多语言文案导出为 JSON 并符合 <code>ErrorDetail<\/code> 约定<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-001.md"},{"id":"S1-AZ-002","title":"权限点注册表、资源类型与默认角色模板","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-001","S1-RT-004"],"blockedBy":["S1-AZ-001","S1-RT-004"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>permission_definitions<\/code> / <code>resource_types<\/code> / <code>policy_packs<\/code>：平台模式由 <code>ctx.Registry<\/code> 读清单 <code>provides.permissions<\/code> 登记并拼接全名；独立模式由 <code>[Permission]<\/code> 特性登记（ADR-019 D19.4）；插件默认角色模板（策略包）安装即可用；资源类型由插件注册；<code>qian.authz.resource-type/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：参考应用清单声明资源 <code>customer<\/code> 的动作 <code>[read, write, export]<\/code>（登记为 <code>qian.sample.crm:customer:&lt;action&gt;<\/code>）与默认角色模板，安装后租户 Owner 自动拥有全部、使用者只有 read<\/li>\n<li class='chk'><span class='box'><\/span>UT：独立模式下 <code>[Permission]<\/code> 特性登记的权限点与平台模式清单登记结果形状一致<\/li>\n<li class='chk'><span class='box'><\/span>UT：权限点带风险级别与 step-up 字段并可被 <code>GET /api/authz/me/permissions<\/code> 读取<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-002.md"},{"id":"S1-AZ-003","title":"租户域 RBAC 存储与求值引擎（Check / Explain、缓存）","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-AZ-002","S1-IDP-001","S1-TEN-001","S1-DATA-001"],"blockedBy":["S1-AZ-002","S1-IDP-001","S1-TEN-001","S1-DATA-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-006-authorization-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-006-authorization-model.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>roles<\/code>（tenant_id 可空 = 平台角色、builtin、source_pack）、<code>role_assignments<\/code>（主体可为用户 / 组织 / 岗位 / 用户组、有效期）、<code>grants<\/code>；内置角色：平台超管、租户 Owner / Admin / 开发者 / 使用者 + 自定义；有效角色 = 直接授予 ∪ 经组织 / 岗位 / 组获得；<code>Check<\/code> 缺省拒绝；缓存键 <code>(tenant, membership, identity_revision)<\/code> Redis TTL 10 分钟；超管旁路显式声明并审计；<code>Explain<\/code> 返回 <code>{ decision, matchedRoles[], matchedGrants[], missing[], reason }<\/code>。S1 最大单项之一。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>Explain<\/code> 对被拒请求返回缺少的权限点与命中角色；对放行请求返回命中链路<\/li>\n<li class='chk'><span class='box'><\/span>IT：平台超管访问租户资源被放行且审计记录 <code>bypass = superadmin<\/code>；超管不出现在租户成员列表<\/li>\n<li class='chk'><span class='box'><\/span>IT：把角色授予组织 X，X 下成员在 ≤ 3 秒内获得权限<\/li>\n<li class='chk'><span class='box'><\/span>UT：未注册权限点或无匹配授权时 <code>Check<\/code> 返回拒绝（fail-closed）；<code>BatchCheck<\/code> 与逐条 <code>Check<\/code> 结果一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-003.md"},{"id":"S1-AZ-004","title":"PEP 三处强制执行点、决策审计与授权变更失效传播","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-003","S1-AUD-001","S1-EVT-001"],"blockedBy":["S1-AZ-003","S1-AUD-001","S1-EVT-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>ASP.NET Core <code>[RequirePermission]<\/code>、Mediator <code>AuthorizationBehavior<\/code>（读 <code>[Capability(RequiredPermission=...)]<\/code>，作为 base 组合包的 <code>waterfall<\/code> 监听器）、gRPC 拦截器同一入口；端点 → 权限点写进 OpenAPI 扩展 <code>x-qian-permission<\/code>；<code>decision_logs<\/code>（可配采样，拒绝必记）入哈希链；授权变更 → <code>authz.grant.changed.v1<\/code> / <code>authz.role.changed.v1<\/code> → 7.4 递增受影响主体的 <code>identity_revision<\/code> → 7.13 推送刷新。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：未声明权限点的端点在 <code>Production<\/code> 模式返回 403（默认拒绝）；声明后无权限主体 403、有权限主体 200，且每次拒绝有 <code>decision_logs<\/code> 记录<\/li>\n<li class='chk'><span class='box'><\/span>IT：移除角色后 <code>identity_revision<\/code> 递增、缓存失效，旧令牌请求被服务端拒绝<\/li>\n<li class='chk'><span class='box'><\/span>UT：卸载 <code>qian.authz<\/code> 组件时 <code>waterfall<\/code> 监听器被逆序撤销；OpenAPI 中每个受保护端点带 <code>x-qian-permission<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：gRPC 调用与 HTTP 调用对同一权限点判定一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-004.md"},{"id":"S1-AZ-005","title":"Authz API、目录主体解析（组织 / 岗位 / 组）与最小角色授权页","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-003","S1-IDP-009","S1-YUE-009"],"blockedBy":["S1-AZ-003","S1-IDP-009","S1-YUE-009"],"order":8,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>POST /api/authz/check<\/code>、<code>/batch-check<\/code>、<code>GET /api/authz/me/permissions<\/code>、<code>/me/allowed-actions?resource=<\/code>、<code>POST /api/authz/explain<\/code>、角色与授权 CRUD；主体解析接 7.4.3 目录（组织 / 岗位 / 用户组归属）；最小角色授权页（菜单 / 按钮级，P1）用 yue 授权树；授权变更操作标 <code>write<\/code> + <code>confirm<\/code>，授予平台超管标 <code>humanOnly<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：把角色授予组织 X 后 X 下成员 ≤ 3 秒内获得权限；主归属变化后有效角色随之变化<\/li>\n<li class='chk'><span class='box'><\/span>E2E：租户管理页用 RoleSelect / 授权树完成角色授予并在 <code>Explain<\/code> 中可见命中链路<\/li>\n<li class='chk'><span class='box'><\/span>UT：授予平台超管的能力标 <code>humanOnly<\/code>；授权变更标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-005.md"},{"id":"S1-AZ-006","title":"数据权限契约：DataScopeRule、系统变量与 authz/meta","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-AZ-001","S1-DATA-004"],"blockedBy":["S1-AZ-001","S1-DATA-004"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>第 3 波 S2 契约冻结：<code>DataScopeRule { resource, filter: FilterAST, allData }<\/code>；系统变量枚举（<code>currentUser / currentUserAndSubordinates / … / launchUserId<\/code>，每个带自然语言描述）；合并语义「同角色 AND / 跨角色 OR / 任一全部数据则放开」（Q19）；<code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code> 端口占位；<code>GET /api/authz/meta<\/code> 发布 Schema。编译器在 S2。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：Filter AST JSON Schema 与系统变量枚举可被 <code>GET /api/authz/meta<\/code> 读取并通过 2020-12 校验<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>DataScopeRule<\/code> 样例通过 Schema 校验；合并语义以单测固定<\/li>\n<li class='chk'><span class='box'><\/span>文档：契约写入 specs 并被 §08 数据权限章引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-006.md"},{"id":"S1-CFG-001","title":"Apollo 配置 provider（自研）与配置源顺序","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-006","S1-RT-001"],"blockedBy":["S1-KUN-006"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-007-config-center-apollo.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-007-config-center-apollo.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.config<\/code>（<code>Qian.Config.Abstractions<\/code> / <code>ctx.Config<\/code> + <code>Qian.Config.Apollo<\/code>）：公开 HTTP 协议 <code>/configs<\/code>、<code>/notifications/v2<\/code> 长轮询（hold 60s）、AccessKey HMAC-SHA1、本地缓存文件、集群内直连 ConfigService；配置源顺序 appsettings → Apollo（<code>qian.common.*<\/code> → <code>qian.plugin.&lt;id&gt;<\/code> → <code>application<\/code>）→ K8s Secret 文件 → 环境变量 → 命令行；启动时无网络且无缓存 → 关键配置缺失则启动失败；失败降级矩阵 L0–L4 入运维手册；独立模式可只用标准 <code>IConfiguration<\/code>。官方 .NET 客户端只作 PoC 对照。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：在 Apollo 修改 <code>qian.plugin.sample.pageSize<\/code> 后，宿主 ≤ 60s 内 <code>IOptionsMonitor<\/code> 值更新且不重启<\/li>\n<li class='chk'><span class='box'><\/span>IT：Apollo 不可达且本地缓存存在时宿主用缓存启动；缓存也不存在时关键配置缺失导致启动失败并打印明确原因<\/li>\n<li class='chk'><span class='box'><\/span>UT：配置源叠加顺序以单测固定；<code>Apollo__AppId/Env/Cluster/ConfigServer__0/Label/CacheDir/AccessKey<\/code> 引导项即可启动<\/li>\n<li class='chk'><span class='box'><\/span>文档：失败降级矩阵 L0–L4 写入运维手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-001.md"},{"id":"S1-CFG-002","title":"ISecretResolver（secretRef）与疑似密钥扫描","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-CFG-001"],"blockedBy":["S1-CFG-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>secretRef://k8s/&lt;ns&gt;/&lt;name&gt;#&lt;key&gt;<\/code> 解析（Infisical 后端 P2 抽象位）；疑似密钥键名 / 值扫描拦截；分工表写进开发手册（部署级引导项 → Kustomize；平台 / 服务级非敏感 → Apollo；密钥 → K8s Secret；租户级在线设置 → <code>ITenantSettings<\/code>；前端 → <code>window.__APP_CONF__<\/code>）。全部需要凭据的组件（连接器、渠道、文件 Provider、信任根）依赖它。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：<code>secretRef://k8s/...<\/code> 解析到 K8s Secret 文件；无法解析时返回结构化错误而非空值<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>config.schema<\/code> 中标 <code>sensitive<\/code> 的键若在 Apollo 填了非 <code>secretRef://<\/code> 值，CI 门禁失败<\/li>\n<li class='chk'><span class='box'><\/span>UT：疑似密钥键名 / 值（如 <code>password<\/code>、<code>secret<\/code>、长随机串）进入 Apollo 非 secretRef 值时被扫描拦截<\/li>\n<li class='chk'><span class='box'><\/span>文档：分工表入开发手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-002.md"},{"id":"S1-CFG-003","title":"热更新校验保留旧值、config.schema 门禁与发布审计","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-CFG-001","S1-AUD-001"],"blockedBy":["S1-CFG-001","S1-AUD-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>ValidatedOptionsMonitor&lt;T&gt;<\/code> 变更先跑校验器，失败保留上一份并计数 <code>qian_config_reload_failed_total<\/code>、发 <code>config.reload.failed.v1<\/code>；插件 <code>config.schema<\/code>（JSON Schema 2020-12）→ CI 生成 Apollo namespace 骨架并比对线上键、options JSON Schema 导出、<code>GET /api/config/schemas/{plugin}<\/code>；<code>dump-config<\/code> 条目 <code>config<\/code> 按此 schema 校验（7.2.1）；Apollo 发布事件进审计。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：发布一个不满足 <code>[Range]<\/code> 的值，宿主保留旧值、指标 +1、告警事件发出；修正后恢复<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>config.schema<\/code> 变更后 CI 生成的 namespace 骨架与线上键比对，缺键 / 多键即失败<\/li>\n<li class='chk'><span class='box'><\/span>E2E：Apollo Portal 经 Authentik OIDC 登录，不公网；配置发布出现在 7.11 审计<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/config/schemas/{plugin}<\/code> 对外可读，值不可读除非有权限且非敏感<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-003.md"},{"id":"S1-CFG-004","title":"特性开关 IFeatureFlags（按租户灰度）","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-CFG-001","S1-TEN-001"],"blockedBy":["S1-CFG-001","S1-TEN-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-014-marketplace.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-014-marketplace.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>OpenFeature 式 <code>IFeatureFlags.IsEnabled(name, tenantId)<\/code>，namespace <code>qian.common.flags<\/code>，键 <code>flag.&lt;name&gt;<\/code> 值为规则 JSON（默认、租户白名单 / 百分比）；只管灰度放量，与 7.14 授权（买没买）、租户 scope 挂载（开没开）分开存（ADR-014 / ADR-020 D20.5）；<code>flags.set<\/code> 标 <code>write<\/code> + <code>confirm<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>IFeatureFlags<\/code> 对白名单租户返回 true、其他租户 false；与 7.14 授权结果、租户 scope 挂载状态互不影响<\/li>\n<li class='chk'><span class='box'><\/span>UT：百分比规则对同一租户稳定（同 key 多次求值结果一致）<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>flags.set<\/code> 能力元数据标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-004.md"},{"id":"S1-DATA-001","title":"AddQianData 默认安全装配与 RLS 迁移模板","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-001","S1-KUN-005","S1-RT-001"],"blockedBy":["S1-KUN-005"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"docs/adr/ADR-011-metadata-dynamic-data.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-011-metadata-dynamic-data.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.data<\/code>（<code>Qian.Data.Abstractions<\/code> / <code>ctx.Data<\/code> + <code>Qian.Data<\/code>，随 SDK 进每个 .NET profile）：<code>AddQianData&lt;TContext&gt;()<\/code> 强制 RLS 连接版 + 事务版拦截器、<code>KunMultiTenantModelCacheKeyFactory<\/code>、租户与软删过滤、审计字段填充、<code>xmin<\/code>、snake_case、Guid v7、Outbox 同 DbContext；<code>QianDbContext : KunDbContext<\/code> 构造期校验否则 <code>QianDataMisconfiguredException<\/code>；<code>UseKunSchema(&quot;plugin_&lt;id&gt;&quot;)<\/code>；系统列约定；迁移生成器为每个 <code>IMultiTenant<\/code> 表输出 <code>FORCE ROW LEVEL SECURITY<\/code> 策略；CI 检查「在线 DbContext 必须继承 <code>QianDbContext<\/code>」。全部组件表的前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：缺少 RLS 拦截器或模型缓存键的 DbContext 在启动时被 <code>AddQianData<\/code> 拒绝；代码中 <code>IgnoreQueryFilters()<\/code> 触发分析器错误<\/li>\n<li class='chk'><span class='box'><\/span>IT：以数据库超级用户直连绕过 EF，在设置 <code>app.tenant_id = A<\/code> 后 <code>SELECT<\/code> 不到租户 B 的行，向 B 插入被 <code>WITH CHECK<\/code> 拒绝（RLS 兜底）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用的客户表在租户 A、B 各插入 1000 行，A 的列表查询只返回 A 的数据且 <code>EXPLAIN<\/code> 显示走租户索引<\/li>\n<li class='chk'><span class='box'><\/span>CI：在线 DbContext 不继承 <code>QianDbContext<\/code> 时门禁失败<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>\n<ul>\n<li>2026-10-08 cody：S1-KUN-001 先行交付 Qian.Data.Abstractions / Qian.Data 最小 RLS 安全装配及启动拒绝测试，详见 packages/Qian.Data/README.md；本任务仍负责完整组件、迁移模板、数据约定与分析器，未认领或提前勾选本任务验收。<\/li>\n<li>2026-10-08 cody：先行安全基础已合并 Qian PR #7（https://github.com/idadawn/qian/pull/7），后续实现复用 QianDbContext 与 AddQianData；完整验收与本任务状态保持待办。<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-001.md"},{"id":"S1-DATA-002","title":"多副本迁移协调、分布式 ID（Guid v7 / 雪花租约）与序号服务","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-DATA-001"],"blockedBy":["S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>MigrateAsync<\/code> 前取 <code>pg_advisory_lock(hash(schema))<\/code>，K8s 迁移 Job 先行（<code>--migrate-only<\/code>），多副本启动时只校验不迁移；默认 Guid v7，数值 id 用雪花、WorkerId 经 Redis 租约 <code>qian:snowflake:worker:{n}<\/code> 分配；<code>ISequenceService.NextAsync(ruleCode, scopeKey)<\/code> 规则 DSL <code>prefix + yyyyMMdd + seq(6)<\/code>，PG <code>UPDATE ... RETURNING<\/code> 原子取号。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：两个副本同时启动并执行迁移，只有一个执行 DDL、另一个等待后校验通过<\/li>\n<li class='chk'><span class='box'><\/span>IT：100 并发取号同一序号规则无重复无跳号；规则修改后从 1 重新开始<\/li>\n<li class='chk'><span class='box'><\/span>IT：雪花 WorkerId 在 3 个副本间互不相同，副本重启后租约回收复用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-002.md"},{"id":"S1-DATA-003","title":"基准类型与 PG 方言组件、数据连接档案","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-DATA-001","S1-CFG-002"],"blockedBy":["S1-DATA-001","S1-CFG-002"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>BaseDataType<\/code>（int / bigint / decimal / float / datetime / varchar / text / bool / json / uuid，系统类不可删）、<code>DbDialect<\/code>（postgres）、<code>DialectTypeMapping<\/code>（长度 / 精度 / 区间校验）作为种子数据与 <code>GET /api/data/meta/types<\/code>；方言为独立组件 <code>Qian.Data.Dialect.Pg<\/code>（数据包，<code>qian.data.dialect/v1<\/code> SPI）；<code>DataConnection<\/code>（凭证只存 secretRef、<code>POST /connections/{id}:test<\/code>、详情不回传密钥）；<code>StandardField<\/code> 由基类固化。MySQL 方言本期不做。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/data/meta/types<\/code> 返回基准类型、方言与映射，系统类不可删除<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>POST /connections/{id}:test<\/code> 对可达 / 不可达库分别返回成功 / 结构化错误；详情接口不回传密钥<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>DialectTypeMapping<\/code> 对超出长度 / 精度 / 区间的字段定义拒绝<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-003.md"},{"id":"S1-DATA-004","title":"Filter AST、运算符矩阵与 IRecordHook 契约","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-DATA-001"],"blockedBy":["S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"},{"path":"docs/adr/ADR-011-metadata-dynamic-data.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-011-metadata-dynamic-data.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>第 3 波 S2 契约冻结：Filter AST <code>{ logic, groups: [{ logic, conditions: [{ field, op, value | sysVar }] }] }<\/code>，运算符 <code>eq ne like notLike isNull notNull in notIn ge gt le lt between<\/code>，矩阵 <code>{ fieldType: [op] }<\/code> 发布为 JSON Schema，五处共用；数据规则策略契约（主键策略、乐观锁、逻辑删、业务主键）；<code>IRecordHook<\/code> before / after 契约与 <code>qian.record.changed.v1<\/code> 信封；S2 SQL 生成只接受参数化 + 标识符白名单。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：Filter AST 示例通过 JSON Schema 校验；<code>between<\/code> 用于布尔字段被矩阵拒绝<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>qian.record.changed.v1<\/code> 信封与 <code>IRecordHook<\/code> 接口随 <code>Qian.Data.Abstractions<\/code> 发布并通过 PublicAPI 分析器<\/li>\n<li class='chk'><span class='box'><\/span>文档：契约写入 specs 并被 7.5 数据权限、§08 高级查询 / 流程条件引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-004.md"},{"id":"S1-DEC-001","title":"拍板：TS 侧运行时采用现成 MIT 库还是自研 @qian/runtime","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave":0,"priority":"P0","type":"decision","owner":"claude","estimate":"0.5d","days":0.5,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/adr/ADR-020-component-model-v2.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#5.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"}],"updated":"2026-10-07","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 §7 第 1 条：TypeScript 侧（yue 外壳、qian CLI）直接采用现成 MIT 运行时库还是自研同语义的 <code>@qian/runtime<\/code>；.NET 侧已定自研。影响 7.2.1 与 7.15.1，S1 文档按自研写，须在 S1- code>，两个所有者意味着消费者要配两段源加 <code>packageSourceMapping<\/code>，与「装一个包就能用」（ADR-019）相悖；<code>qian-plugins<\/code> 规定为「与 Qian 同组织」但组织名仍是占位。<\/p>\n<p><strong>推荐：Qian 迁入 CavaiLAB<\/strong>。理由：Kun 的 CI 与 feed 零改动，产品负责人是该组织管理员，Kun 的其它下游不受影响；迁移成本只在 Qian 侧的四处地址。<strong>备选：新建专用组织<\/strong>（公开形象更干净，但要同时迁 Kun 的 feed 与 CI；留到 S3 公开前再评估，届时包已在 nuget.org / npm）。<strong>备选：维持现状<\/strong>（两个 feed，S1 内部可忍，S2 末公开前必须解决）。<\/p>\n<p>若迁移，GitHub 会自动重定向 git 地址，但要改：① <code>deploy/pm-board/deployment.yaml<\/code> 的 <code>GITSYNC_REPO<\/code>；② <code>deploy/pm-board/bootstrap.sh<\/code> 的 <code>REPO<\/code>；③ 部署仓库 <code>env-ds/argocd/qian-pm-board-application.yaml<\/code> 的 <code>repoURL<\/code> 与 ArgoCD 仓库凭据 <code>argocd/qian-repo-ssh<\/code> 的 <code>url<\/code>；④ 在新仓库重新登记只读 deploy key；⑤ CI secrets / variables 随仓库迁移；开放的 PR 与 issue 随仓库保留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人决定：产品族所有者 = <code>idadawn<\/code>，<strong>Kun 从 CavaiLAB 迁入<\/strong>（而非 Qian 迁出），理由是 iClaw 源码与其余仓库都在 <code>idadawn<\/code>；结论已写入 ADR-021 §2 D21.2 / §7，specs/component-model.md §8 示例中的组织占位已换成 <code>idadawn<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>迁移方向反转后，上述五处 Qian 侧地址全部不动；Kun 侧的 transfer、runner、协作者、包源与回链拆为独立任务 S1-PM-003 执行<\/li>\n<li class='chk done'><span class='box'>✓<\/span>包源口径写定：Kun 正式版走 nuget.org（已公开发布 <code>Kun.*<\/code>），<code>Qian.*<\/code> S1 私有包与 Kun 预发布包走 <code>nuget.pkg.github.com/idadawn<\/code>；<code>NuGet.config<\/code> 的源与 <code>packageSourceMapping<\/code> 在首个引用 <code>Kun.*<\/code> 的任务中落地（S1-RT-001）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-07 claude：创建任务；推荐 CavaiLAB，由产品负责人拍板并执行迁移<\/li>\n<li>2026-10-07 产品负责人：拍板 Kun 迁入 idadawn（iClaw 源码都在 idadawn）<\/li>\n<li>2026-10-07 claude：结论写入 ADR-021 D21.2 / §7 与决策清单 D21，占位替换为 idadawn，执行拆为 S1-PM-003；任务关闭<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-009.md"},{"id":"S1-DEC-010","title":"拍板：contracts/v0 定稿前的默认裁决（错误码写法、业务状态码、R32 原因承载、平台级 tenant_id）","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave" /github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-013-frontend-yue.md#D13.18","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>「介绍组件如何使用」是文档站的主体。按 ADR-020 D20.9，每个组件的文档源在它自己的文件夹里（<code>README.md<\/code> 含「模型体验」「已知限制」两节，<code>docs/*.mdx<\/code> 为使用指南），文档站在构建前汇总；yue 组件要能在 MDX 里活演示并自动出 API 表；.NET 包与 TypeScript 包的 API 参考由工具生成，不手写。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>收集脚本把各组件 <code>README.md<\/code> 与 <code>docs/*.mdx<\/code> 按 docs-site.md §3 的九节模板汇总进 <code>website/docs/components/<\/code>，保留组件 id、版本、所属 profile 等元数据到 frontmatter；缺「模型体验」或「已知限制」节的组件使构建失败（与 S1-QA-006 的 README 契约门禁同一规则）<\/li>\n<li class='chk'><span class='box'><\/span><code>@rspress/plugin-preview<\/code> 与 <code>@rspress/plugin-playground<\/code> 接入：yue 组件在 MDX 代码块内活渲染并可编辑；<code>@rspress/plugin-api-docgen<\/code> 为 <code>@yue/core<\/code> 全部组件生成 props 表<\/li>\n<li class='chk'><span class='box'><\/span><code>@rspress/plugin-typedoc<\/code> 生成 <code>@qian/runtime<\/code>、<code>@qian/plugin-sdk<\/code>、<code>@yue/sdk<\/code> 的 API 文档并挂在站点 <code>/sdk/api/frontend/<\/code>；DocFX 从 XML 注释生成 <code>Qian.*<\/code> .NET 包 API 参考并挂在 <code>/sdk/api/dotnet/<\/code>（复用 <code>website/scripts/build-kun-api.ts<\/code> 的流水线）；平台 OpenAPI 用 Scalar 渲染在 <code>/sdk/api/http/<\/code>；API 页不进侧栏、不渲染侧栏（R54、R56），并在 <code>/sdk/api/<\/code> 落地页更新状态<\/li>\n<li class='chk'><span class='box'><\/span><code>qian docs generate<\/code>（S1-RT-010）输出的配置目录、模块图、事件生产 / 消费图进入站点并随 CI 更新<\/li>\n<li class='chk'><span class='box'><\/span>UT：收集脚本对缺节、重复 id、断链三类错误各有一个失败用例<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-07 claude：创建任务<\/li>\n<li>2026-10-07 claude：信息架构（七个部分）经产品负责人确认，写入 specs/docs-site.md 并对齐验收<\/li>\n<li>2026-10-08 claude：S1 meters }<\/code> S3 字段可空）；Redis <code>ent:{tenant}:{plugin}<\/code> TTL 5 分钟 + <code>entitlement.changed.v1<\/code> 失效；授予 → <code>qian.lifecycle<\/code> 的 <code>Entitled<\/code>；平台插件（<code>policy.required: true<\/code>）恒授权。「开没开」由 scope patch 表达，本组件只答「买没买」。权益 API 形状是 S3 市场几乎改不了的三件事之一。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>IsEntitled<\/code> 对平台插件恒 true；对过期授权（<code>valid_to<\/code> 已过）返回 false 并发事件<\/li>\n<li class='chk'><span class='box'><\/span>UT：权益响应 Schema 含 S3 预留字段（可空），契约快照测试锁定形状<\/li>\n<li class='chk'><span class='box'><\/span>IT：授予 / 撤销写审计并发 <code>entitlement.changed.v1<\/code>，缓存 ≤ 5s 失效<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>entitlements.me<\/code> 标 <code>read<\/code>；授予 / 撤销标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-ENT-001.md"},{"id":"S1-ENT-002","title":"权益 ∧ scope 挂载 ∧ 灰度：三处拦截接线与正交验证","status":"todo","stage":"S1","area":"ENT","areaName":"权益","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-ENT-001","S1-GW-003","S1-RT-014","S1-YUE-002","S1-CFG-004"],"blockedBy":["S1-ENT-001","S1-GW-003","S1-RT-014","S1-YUE-002","S1-CFG-004"],"order":10,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>把 <code>ctx.Entitlement<\/code> 接进网关 <code>PluginEnabledTransform<\/code>、SDK <code>PluginEnabledMiddleware<\/code>、外壳远程模块加载三处：未授权、未挂载、被 restrict 一律 404 / 不加载，与不存在无法区分（R32）；与 7.8 特性开关正交。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：对租户 B 撤销参考应用授权后 ≤ 5s：网关 404、SDK 404、外壳菜单消失（与不存在无法区分，R32）；重新授予后恢复<\/li>\n<li class='chk'><span class='box'><\/span>IT：已授权 + scope 未挂载 = 404；授权撤销 + scope 已挂载 = 404；两者都满足 + 灰度开关关 = 该灰度特性不可见但组件可用<\/li>\n<li class='chk'><span class='box'><\/span>E2E：未挂载组件的远程模块 <code>mf-manifest.json<\/code> 不被请求<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-ENT-002.md"},{"id":"S1-EVT-001","title":"Qian.Events：信封、稳定事件 ID、Outbox 发布与 MQ 拓扑","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-002","S1-RT-001","S1-DATA-001"],"blockedBy":["S1-KUN-002","S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-008-events-messaging.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-008-events-messaging.md"},{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"contracts/v0/event-envelope.schema.json","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/event-envelope.schema.json"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"}],"updated":"2026-10-07","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.events<\/code>（<code>Qian.Events.Abstractions<\/code> / <code>ctx.Events<\/code> + <code>Qian.Events<\/code>，随 SDK 进每个 .NET profile）：<code>QianEventEnvelope { version, event_id (uuid v7), subject, type, occurred_at, tenant_id, producer, correlation_id?, causation_id?, actor { kind, id, on_behalf_of? }, trace_parent, payload }<\/code> 对齐 iClaw 契约；<code>[IntegrationEventId]<\/code> 稳定 ID 与 payload Schema 导出；<code>Publish<\/code> 只允许命令 handler 同 scope；Outbox 发布器批 100、<code>FOR UPDATE SKIP LOCKED<\/code>、publisher confirm、指数退避；exchange <code>qian.events<\/code>（topic）、quorum 队列 <code>q.&lt;service&gt;.&lt;subscription&gt;<\/code>、广播队列；独立模式 Outbox 用宿主 DbContext。与 <code>Qian.Runtime<\/code> 进程内事件不混用。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用创建客户后 <code>outbox_messages<\/code> +1，RabbitMQ 收到 1 条<\/li>\n<li class='chk'><span class='box'><\/span>IT：杀掉发布器副本后另一副本接管，无重复发布（confirm 计数 = Outbox 行数）<\/li>\n<li class='chk'><span class='box'><\/span>UT：信封通过 iClaw <code>events-schema.json<\/code> 校验；每个 <code>[IntegrationEventId]<\/code> 都能导出 JSON Schema<\/li>\n<li class='chk'><span class='box'><\/span>UT：在非命令 handler 处 <code>Publish<\/code> 触发分析器错误；<code>actor.kind<\/code> 支持 <code>agent<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：refs 加 contracts/v0/event-envelope.schema.json；iClaw 信封兼容性的验收口径见 contracts/v0/iclaw-alignment.md 第 3 节<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-001.md"},{"id":"S1-EVT-002","title":"消费端至少一次：手动 ack、指数退避、DLX、Redis 幂等装饰器与租户回灌","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-EVT-001","S1-TEN-001"],"blockedBy":["S1-EVT-001","S1-TEN-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>Subscribe&lt;TEvent, THandler&gt;()<\/code>；处理成功后 ack；重试 5 次后进 <code>qian.dlx<\/code> 并告警；幂等装饰器先查 Redis <code>processed:{consumer}:{event_id}<\/code>（TTL 7 天）再执行、成功后写入，PG <code>processed_messages<\/code> 兜底；信封 <code>tenant_id<\/code> → <code>BeginScope<\/code> 与 baggage 注入在订阅器统一完成；竞争消费与广播两种订阅。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：消费端前两次抛异常、第三次成功，<code>processed_messages<\/code> 恰一行；第 6 次仍失败进 DLX 并发告警<\/li>\n<li class='chk'><span class='box'><\/span>IT：同一事件重投两次，幂等装饰器拦截第二次，handler 只执行一次<\/li>\n<li class='chk'><span class='box'><\/span>IT：消费端 handler 内租户上下文为该事件的租户，EF 查询自动带 <code>tenant_id<\/code> 过滤<\/li>\n<li class='chk'><span class='box'><\/span>IT：广播订阅下每个实例各收到一次，竞争订阅下只有一个实例收到<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-002.md"},{"id":"S1-EVT-003","title":"事件目录、AsyncAPI 导出、主题 ACL 与 IOutboxWriter","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-EVT-001","S1-RT-006"],"blockedBy":["S1-EVT-001","S1-RT-006"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>GET /api/capabilities/events<\/code> 返回每事件 ID、版本、Schema、发布插件、订阅者（按权限过滤）；AsyncAPI 描述随 <code>qian pack<\/code> 导出；清单 <code>provides.events.publish/subscribe<\/code> 生成 RabbitMQ 主题 ACL（P1）；<code>IOutboxWriter<\/code> 面向 <code>NpgsqlTransaction<\/code> 的契约（S2 动态表同事务）。事件契约化为 S4 Agent 触发器预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities/events<\/code> 按权限过滤返回事件 ID、版本、Schema、发布插件与订阅者<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>qian pack<\/code> 导出的 AsyncAPI 与事件目录一致<\/li>\n<li class='chk'><span class='box'><\/span>TCK：清单未声明 <code>publish<\/code> 的事件被运行时拒绝发布（P1，主题 ACL）<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>IOutboxWriter<\/code> 契约随 <code>Qian.Events.Abstractions<\/code> 发布并通过 PublicAPI 分析器<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-003.md"},{"id":"S1-FILE-001","title":"Qian.Files 核心：租户前缀键、配额、上传策略与预签名 API","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-001","S1-TEN-004","S1-AZ-004","S1-AUD-001","S1-EVT-001","S1-KUN-006"],"blockedBy":["S1-TEN-004","S1-AZ-004","S1-AUD-001","S1-EVT-001","S1-KUN-006"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.files<\/code>（<code>Qian.Files.Abstractions<\/code> / <code>ctx.Files<\/code>）基于 Kun 新线 <code>IFileStorage<\/code>：<code>IQianFileService<\/code>、<code>file_objects<\/code> 表、存储键 <code>tenants/{tenant_id}/{plugin_id}/{yyyy}/{MM}/{uuid}{ext}<\/code> 服务端生成、配额读 7.3（<code>QUOTA_EXCEEDED<\/code>）、<code>UploadPolicy<\/code> 由清单 <code>contributes: qian.files.upload-policy/v1<\/code> 声明、MIME 服务端嗅探、<code>ContentDispositionPolicy = attachment<\/code> 不可关闭；<code>POST /api/files/uploads:presign<\/code>（TTL ≤ 15 分钟）、<code>POST /files/{id}:complete<\/code>、<code>GET /files/{id}/download-url<\/code>（TTL ≤ 5 分钟、经 7.5）、<code>DELETE<\/code>（软删）；事件 <code>files.object.created/deleted.v1<\/code>；下载审计；旧线以 Banned API 禁用。退出标准点名能力。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：租户 A 的下载 URL 对 B 的文件 id 返回 404；任何文件的 <code>storage_key<\/code> 都以 <code>tenants/{tenant_id}/<\/code> 开头<\/li>\n<li class='chk'><span class='box'><\/span>IT：上传 <code>text/html<\/code> 文件后下载响应头为 <code>Content-Disposition: attachment<\/code>，且无配置项可改变<\/li>\n<li class='chk'><span class='box'><\/span>IT：配额 10 MB 时第 11 MB 上传返回 <code>QUOTA_EXCEEDED<\/code>；软删后配额释放<\/li>\n<li class='chk'><span class='box'><\/span>IT：预签名 URL 过期后 PUT 失败；<code>complete<\/code> 时 sha256 不符返回错误并标记 <code>quarantined<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>files.presign-upload<\/code> 调用产生审计与 <code>files.object.created.v1<\/code> 事件；<code>files.delete<\/code> 标 <code>destructive<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-001.md"},{"id":"S1-FILE-002","title":"文件 Provider：oss / s3 / local 与 patch 切换","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-FILE-001","S1-CFG-002","S1-RT-002"],"blockedBy":["S1-FILE-001","S1-CFG-002","S1-RT-002"],"order":7,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.4 的样例 seam：<code>Qian.Files.Oss<\/code>（现网对象存储）/ <code>Qian.Files.S3<\/code>（MinIO / S3 兼容）/ <code>Qian.Files.Local<\/code>（仅开发与单节点）三个 Provider 只依赖 <code>Qian.Files.Abstractions<\/code>，装载其一；Provider 选择 = profile patch 替换 <code>qian.files<\/code> 条目的 <code>provider<\/code> 配置，切换不影响已有键；凭据经 secretRef；<code>qian.files.provider/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：三个 Provider 对同一组文件操作 fixture（上传、预签名、下载、删除）结果一致<\/li>\n<li class='chk'><span class='box'><\/span>E2E：用 <code>--patch<\/code> 把 <code>provider<\/code> 从 <code>local<\/code> 换成 <code>oss<\/code> 后所有消费者不变，已有存储键仍可读<\/li>\n<li class='chk'><span class='box'><\/span>CI：Provider 包的传递依赖中不出现其他 Provider 与 <code>Qian.Files<\/code> 以外的实现包；凭据只以 secretRef 出现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-002.md"},{"id":"S1-FILE-003","title":"分片上传、MD5 秒传与软删保留期清理作业","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-FILE-001","S1-SCH-001"],"blockedBy":["S1-FILE-001","S1-SCH-001"],"order":7,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>file_uploads<\/code> 分片会话：<code>POST /uploads:init<\/code>、<code>PUT /uploads/{id}/parts/{n}<\/code>、<code>POST /uploads/{id}:complete<\/code>、<code>GET /uploads:lookup?sha256=<\/code>（秒传）；yue <code>Upload<\/code> 组件消费其契约；软删后保留期满经 7.13 调度物理删除。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：yue <code>Upload<\/code> 以分片 + MD5 上传 200 MB 文件至 OSS provider，秒传命中返回已有 id<\/li>\n<li class='chk'><span class='box'><\/span>IT：分片会话中断后可续传；<code>complete<\/code> 校验全部分片与总 sha256<\/li>\n<li class='chk'><span class='box'><\/span>IT：软删文件在保留期满后由调度作业物理删除并发出 <code>files.object.deleted.v1<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-003.md"},{"id":"S1-GW-001","title":"qian.gateway 宿主：强制认证、Cookie 换 S2S、密钥热轮换","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-003","S1-KUN-004","S1-IDP-005","S1-RT-002"],"blockedBy":["S1-KUN-003","S1-KUN-004","S1-IDP-005","S1-RT-002"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-010-gateway-layers.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-010-gateway-layers.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"contracts/v0/s2s-claims.schema.json","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/s2s-claims.schema.json"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"}],"updated":"2026-10-07","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.gateway<\/code>（<code>Qian.Gateway.Abstractions<\/code> + <code>Qian.Gateway<\/code>，<code>gateway<\/code> profile 独立 Pod、可 AOT）在 Kun.Gateway 之上写死安全默认值：回退策略 = 已认证、匿名白名单显式枚举；只信任 <code>qian-identity<\/code> 一个 issuer；外部 Bearer 或 Cookie <code>qian.sid<\/code> 统一解析主体后由 <code>S2sTokenIssuer<\/code> 签 60s S2S（RS256、<code>kid<\/code> 轮换），<code>aud<\/code> = 目标 cluster，禁透传；<code>ForwardedClaimTypes<\/code> 白名单；<code>KnownNetworks<\/code> 只含 Traefik 网段；机器身份同样换签（<code>principal_kind = service<\/code>）。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：未带凭据访问 <code>/api/tenancy/tenants<\/code> 返回 401；带外壳 Cookie 访问同一路由，下游收到 60s S2S 且 <code>aud = qian-platform<\/code>、<code>tenant_id<\/code> 正确<\/li>\n<li class='chk'><span class='box'><\/span>IT：S2S 令牌通过 iClaw <code>s2s-jwt-claims<\/code> Schema 校验；<code>exp − iat ≤ 300s<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：轮换私钥期间（双钥重叠 10 分钟）在途请求零失败；重叠期后旧 <code>kid<\/code> 被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：伪造 <code>X-Forwarded-For<\/code> 的请求（非可信网段发出）不改变限流分区与客户端 IP<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：refs 加 contracts/v0/s2s-claims.schema.json：iClaw 无 S2S JSON Schema，验收以该文件为准（iclaw-alignment.md 第 2 节）<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-001.md"},{"id":"S1-GW-002","title":"路由级限流三策略绑定与 Redis 共享计数","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-GW-001"],"blockedBy":["S1-GW-001"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>kun-default<\/code>（匿名 IP）、<code>tenant<\/code>、<code>user<\/code> 三策略真正绑定到路由；429 带 <code>Retry-After<\/code>；多 Pod 共享计数 Redis <code>PartitionedRateLimiter<\/code>（P1）。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：对限流路由以同一租户 200 rps 压测，超阈值返回 429 且响应头含 <code>Retry-After<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：两个网关副本共享计数（P1）<\/li>\n<li class='chk'><span class='box'><\/span>UT：每条生成的路由都带 <code>rateLimiterPolicy<\/code>，缺失时构建期失败<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-002.md"},{"id":"S1-GW-003","title":"路由片段生成、PluginEnabledTransform 与聚合端点","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-GW-001","S1-RT-004","S1-RT-006","S1-RT-013","S1-AUD-003"],"blockedBy":["S1-GW-001","S1-RT-004","S1-RT-006","S1-RT-013","S1-AUD-003"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>qian pack<\/code> 从 <code>plugin.json<\/code> 生成 YARP <code>routes/clusters<\/code> 片段（<code>authorizationPolicy<\/code>、<code>rateLimiterPolicy<\/code>、<code>requiredScopes<\/code>、<code>pluginId<\/code>），构建期合并；<code>PluginEnabledTransform<\/code> 读租户 scope 视图（权益接线在 S1-ENT-002），未挂载 / 被 restrict 一律 404 与不存在路由无法区分（R32）；<code>GET /api/openapi.json<\/code>、<code>GET /api/capabilities<\/code> 代理与 <code>/api/kernel/capabilities<\/code> 别名；<code>/healthz<\/code> / <code>/readyz<\/code>（JWKS 可取、Redis 可达、上游至少一个健康）；OTel；gRPC-Web；<code>qian.gateway.route-provider/v1<\/code> 扩展点预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：租户 B 的 scope 未挂载参考应用时访问其路由 404，响应与访问不存在的路由完全相同（R32）；对 B 写一条租户 scope patch 挂载后 ≤ 5s 放行，网关不重启<\/li>\n<li class='chk'><span class='box'><\/span>E2E：<code>/readyz<\/code> 在 Redis 不可达时返回 503，K8s 停止向其导流<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/openapi.json<\/code> 需认证并汇总各宿主；<code>/api/kernel/capabilities<\/code> 返回同一结果并带 <code>Deprecation<\/code> 头<\/li>\n<li class='chk'><span class='box'><\/span>UT：由参考应用 <code>plugin.json<\/code> 生成的路由片段含四个必填字段，缺失即构建失败<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-003.md"},{"id":"S1-IDP-001","title":"身份契约先行：ctx.Identity、claim 规范、SPI 与事件","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-RT-001","S1-AGT-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>身份与鉴权互为前置须并行、契约先行：Definition 包定义 <code>ctx.Identity<\/code>、<code>ICurrentUser<\/code> / <code>IAuthenticatedUser<\/code>、令牌 claim 规范集（<code>sub<\/code>、<code>tenant_id<\/code>、<code>membership_id<\/code>、<code>scope<\/code>、<code>identity_revision<\/code>、<code>sid<\/code>、<code>amr<\/code> / <code>acr<\/code>，预留 <code>profile<\/code>、<code>act<\/code>）、<code>IIdentityConnector<\/code> / <code>IAuthenticatorFactor<\/code> SPI、<code>ExternalAssertion<\/code>、事件 <code>identity.login/logout/password_changed/locked/session_revoked.v1<\/code>、<code>Client.type<\/code> 枚举含 <code>agent<\/code>。S1-AZ-003 只依赖本包。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：<code>Qian.Identity.Abstractions<\/code> 只依赖 <code>Kun.*.Abstractions<\/code> 与 <code>Qian.Runtime<\/code>，通过 PublicAPI 分析器<\/li>\n<li class='chk'><span class='box'><\/span>UT：claim 规范集与 <code>contracts/v0<\/code> S2S claim Schema 一致；<code>Client.type<\/code> 枚举含 <code>agent<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：事件 <code>identity.*.v1<\/code> 带稳定 <code>[IntegrationEventId]<\/code> 与 JSON Schema<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-001.md"},{"id":"S1-IDP-002","title":"Identity.Server：OpenIddict 唯一 issuer 与端点","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-001","S1-KUN-004","S1-DATA-001","S1-TEN-001","S1-AZ-001"],"blockedBy":["S1-IDP-001","S1-KUN-004","S1-DATA-001","S1-TEN-001","S1-AZ-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>可嵌入任意 ASP.NET Core 宿主的 OpenIddict 7.x IdP，默认进 <code>identity<\/code> profile（独立 PG schema <code>identity<\/code>、独立 Redis db）：discovery / authorize / token / userinfo / revocation / introspection / end_session / back-channel logout；授权码 + PKCE、refresh 轮换 + 复用检测、<code>client_credentials<\/code>、RFC 8707 <code>resource<\/code>；非对称签名 + JWKS 轮换；每环境一个规范 issuer；access token 15 分钟；内置客户端注册表（平台、官方插件、外壳、CLI）；CSRF 与安全头。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：OpenIddict 一致性测试（授权码 + PKCE、refresh 轮换、client_credentials、revocation、back-channel logout）全部通过；refresh 令牌复用被检测并吊销整族<\/li>\n<li class='chk'><span class='box'><\/span>代码审查 + IT：令牌中不含任何权限码；日志中无明文 sid、无密码<\/li>\n<li class='chk'><span class='box'><\/span>IT：以 <code>principal_kind = service<\/code> 的 <code>client_credentials<\/code> 令牌调用能力成功，<code>sub = client_id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：嵌入 <code>Qian.Identity.Server<\/code> 的独立宿主能通过 OpenIddict 一致性测试（ADR-019 D19.8）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-002.md"},{"id":"S1-IDP-003","title":"Person / Membership 账号模型与统一登录流水线","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-002"],"blockedBy":["S1-IDP-002"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>Person<\/code>（标识集合、Argon2id 凭据与历史哈希、MFA 因子、状态）+ <code>Membership<\/code>（person × tenant、显示名、是否租户管理员、<code>profile<\/code> 预留）+ <code>ExternalIdentity<\/code> + <code>Client<\/code> + <code>Session<\/code> + <code>LoginAudit<\/code>；<code>ISignInPipeline<\/code> 所有方式同一 <code>LoginInput<\/code> 同一签发路径；错误阈值 → 锁定或延时；初始密码强制修改不可取消；多 Membership → <code>selection_token<\/code>（5 分钟）→ 正式令牌；切换租户 = 以选择令牌重签；图形验证码按策略开关。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：同一手机号在租户 A、B 各有 Membership，密码登录后出现租户选择，选 A 后令牌 <code>tenant_id = A<\/code>；在外壳切换到 B 时令牌重签且 <code>membership_id<\/code> 变化<\/li>\n<li class='chk'><span class='box'><\/span>IT：密码错误达到阈值触发锁定；初始密码账号登录后被强制跳转改密且不可跳过<\/li>\n<li class='chk'><span class='box'><\/span>UT：密码以 Argon2id 存储且历史哈希不可复用；<code>LoginAudit<\/code> 每次登录一条<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-003.md"},{"id":"S1-IDP-004","title":"会话中心：Redis 索引、强制下线、后通道登出、revision","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-003"],"blockedBy":["S1-IDP-003"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>sessions:{person}<\/code> Redis 索引；失效触发：改密、停用、锁定、租户冻结 / 到期、强制下线、权限变更；并发上限默认 5、单端按端类型；后通道登出双向；<code>identity_revision<\/code> 递增并经网关 <code>ForwardedClaimTypes<\/code> 转发供 7.5 比对；管理面 <code>GET /api/identity/sessions?person=<\/code>、<code>POST /sessions/{sid}:revoke<\/code>、<code>POST /persons/{id}:revoke-all<\/code>、在线用户列表；日志只记 sid 哈希。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：改密后该 Person 全部会话 ≤ 5s 内失效；管理员强制下线某会话后其 refresh 被拒<\/li>\n<li class='chk'><span class='box'><\/span>IT：并发上限 5 时第 6 次登录踢掉最早会话并发出 <code>session_revoked<\/code> 事件；单端模式下 PC 后登录踢 PC 先登录、不影响移动端<\/li>\n<li class='chk'><span class='box'><\/span>IT：授权变更后 <code>identity_revision<\/code> 递增，旧令牌请求被服务端拒绝<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：日志中不出现明文 sid（grep 门禁）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-004.md"},{"id":"S1-IDP-005","title":"Identity.Client：RP 接入、Cookie 会话与 S2S 校验","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-002","S1-KUN-004"],"blockedBy":["S1-IDP-002","S1-KUN-004"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>进 <code>platform<\/code> / <code>gateway<\/code> / <code>standalone<\/code> 的 RP 包：授权码 + PKCE 换取、<code>nonce<\/code> 校验、refresh、discovery 定期刷新、Cookie 会话 <code>qian.sid<\/code>、S2S 令牌验签（<code>aud<\/code> 绑定、禁透传）；独立宿主可只装 Client 对接任意 OIDC 发行方。网关与 <code>qian add identity<\/code> 的依赖。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：对强制 PKCE 的 <code>qian-identity<\/code> 完成授权码换取；篡改 <code>nonce<\/code> 的 id_token 被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>IT：S2S 令牌 <code>aud<\/code> 不匹配或透传上一跳令牌时下游拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：独立宿主只装 <code>Qian.Identity.Client<\/code> 对接外部 OIDC 发行方完成登录<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-005.md"},{"id":"S1-IDP-006","title":"认证因子（短信 OTP、TOTP）、登录策略与个人
