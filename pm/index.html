<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qian 项目看板</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2ff;--p0:#dc2626;--p1:#d97706;--p2:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a21;--fg:#e5e7eb;--muted:#9aa3b2;--line:#262b36;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1e2433}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--fg:#e5e7eb;--muted:#9aa3b2;--line:#262b36;--accent:#60a5fa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:#1e2433}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
h1{font-size:18px;margin:0 0 8px}h1 small{color:var(--muted);font-weight:400;margin-left:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar i.doing{background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.kpi b{font-size:22px;display:block}.kpi span{color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:200px}
.col h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.card:hover{border-color:var(--accent)}.card .id{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.card .t{margin:2px 0 6px}.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--chip);color:var(--fg)}
.chip.p0{background:var(--p0);color:#fff}.chip.p1{background:var(--p1);color:#fff}.chip.p2{background:var(--p2);color:#fff}
.chip.blk{background:var(--bad);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.wait{background:var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;user-select:none}
tr:hover td{background:var(--bg)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.pbox h3{margin:0 0 8px;font-size:14px}
.pline{display:grid;grid-template-columns:140px 1fr 90px;gap:8px;align-items:center;margin:4px 0;font-size:13px}.pline .n{color:var(--muted);text-align:right}
.drawer{position:fixed;top:0;right:0;width:min(640px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;z-index:10;overflow:auto;padding:16px}
.drawer.open{transform:none}.drawer h2{font-size:16px;margin:0 0 6px}.drawer .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.drawer h4{margin:14px 0 4px;font-size:13px;color:var(--muted)}.drawer ul{padding-left:18px}.drawer li.chk{list-style:none;margin-left:-18px}.drawer li.chk .box{display:inline-block;width:14px;height:14px;border:1px solid var(--muted);border-radius:3px;margin-right:6px;font-size:10px;line-height:12px;text-align:center}
.drawer li.chk.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.drawer code,.card code{font:12px ui-monospace,Menlo,monospace;background:var(--chip);padding:0 4px;border-radius:3px}
.drawer a{color:var(--accent)}.x{position:absolute;top:10px;right:12px}
.empty{color:var(--muted);text-align:center;padding:30px}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
@media (max-width:720px){.board{grid-template-columns:repeat(5,80vw)}.pline{grid-template-columns:100px 1fr 70px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Qian 项目看板 <small id="meta"></small></h1>
  <div class="bar"><i id="pdone"></i></div>
  <div class="hint">任务真相源是 <code>pm/tasks/*.md</code>；本页由 <code>python3 scripts/pm.py build</code> 生成。改状态请改文件并提交，不要只改这里。</div>
  <div class="row">
    <button data-view="board" class="on">看板</button><button data-view="table">列表</button><button data-view="progress">进度</button><button data-view="deps">阻塞与依赖</button>
    <select id="f-stage"><option value="">全部阶段</option></select>
    <select id="f-area"><option value="">全部领域</option></select>
    <select id="f-wave"><option value="">全部波次</option></select>
    <select id="f-status"><option value="">全部状态</option></select>
    <select id="f-priority"><option value="">全部优先级</option></select>
    <select id="f-owner"><option value="">全部负责人</option></select>
    <input id="f-q" placeholder="搜索 id / 标题" size="18">
    <button id="reset">清除筛选</button>
    <label><input type="checkbox" id="weighted"> 按工作量加权</label>
  </div>
</div></header>
<main><div class="wrap">
  <div class="kpis" id="kpis"></div>
  <section id="v-board" class="board"></section>
  <section id="v-table" hidden></section>
  <section id="v-progress" class="prog" hidden></section>
  <section id="v-deps" hidden></section>
</div></main>
<aside class="drawer" id="drawer"><button class="x" id="close">关闭</button><div id="dbody"></div></aside>
<script>
const TASKS = [{"id":"S1-AGT-001","title":"contracts/v0 冻结文件与 ErrorDetail 结构化错误","status":"done","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":1,"priority":"P0","type":"doc","owner":"claude","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"contracts/v0/README.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/README.md"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"},{"path":"docs/adr/ADR-018-stages-s1-scope.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-018-stages-s1-scope.md"},{"path":"docs/adr/ADR-016-iclaw-boundary.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-016-iclaw-boundary.md"}],"updated":"2026-10-08","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 2 项与技术落点：<code>contracts/v0/<\/code> 下 S2S claim、事件 envelope、ErrorDetail、能力条目四份 JSON Schema（2020-12 + <code>additionalProperties: false<\/code>，<code>x-status: draft<\/code> 期允许破坏性修订），附与 iClaw 对齐的差异说明；<code>Kun.AspNetCore<\/code> ProblemDetails + Qian <code>ErrorDetail { code, message, trace_id, pointer?, allowed? }<\/code>，区分协议错误与业务错误；错误码与文案 JSON 导出。契约先行，供 7.4 / 7.5 / 7.10 / 7.11 消费。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>文档：<code>contracts/v0/<\/code> 下存在 S2S claim、事件 envelope、ErrorDetail、能力条目四份 JSON Schema，并有与 iClaw 对齐的差异说明<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：任一业务错误响应符合 <code>ErrorDetail<\/code> Schema，含稳定 <code>code<\/code> 与（字段错误时）JSON Pointer<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：协议错误与业务错误以不同 <code>type<\/code> / 状态码区分；错误码与多语言文案可导出 JSON<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：开始<\/li>\n<li>2026-10-07 claude：contracts/v0 落盘：error-detail / error-catalog / s2s-claims / event-envelope / capability-entry 五份 Schema（2020-12、封闭对象、x-status: draft）+ 正例 / 反例 / 语义反例 fixture + 内置错误码目录 error-codes.json；iclaw-alignment.md 逐项差异（已用 iClaw events-schema 实测）<\/li>\n<li>2026-10-07 claude：代码：packages/Qian.Runtime.Errors（ErrorCode / ErrorCatalog / QianError / ErrorDetail / PlatformErrors 26 个内置码 / JSON 导出）与 Qian.Runtime.Errors.AspNetCore（AddQianErrors / UseQianErrors / QianResults，ProblemDetails 规范化）；tests/Qian.Runtime.Errors.Tests 151 项全过<\/li>\n<li>2026-10-07 claude：默认裁决 8 条见 contracts/v0/README.md 第 8 节，新建 S1-DEC-010 待确认（R32 的 403 原因承载须在 S1-RT-004 前定，已给 RT-004 加依赖）；EVT-001 / GW-001 / KUN-004 / RT-008 补 contracts 引用<\/li>\n<li>2026-10-07 claude：四份契约 Schema + 差异说明 + ErrorDetail 结构化错误（.NET 两包）完成，验收三项满足，提交评审<\/li>\n<li>2026-10-08 claude：同步 main 时处理撞号：默认裁决任务改为 S1-DEC-010，contracts/v0/README.md、docs/README.md、S1-RT-004 的引用一并改<\/li>\n<li>2026-10-08 claude：已合并 PR #2<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-001.md"},{"id":"S1-AGT-002","title":"能力条目 Agent 字段、反向权限落库与禁租户字段 lint","status":"todo","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-006","S1-RT-014","S1-RT-004"],"blockedBy":["S1-RT-006","S1-RT-014","S1-RT-004"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 5、6、11 项：能力条目 Agent 字段（<code>sideEffect: read|write|external|destructive<\/code>、<code>policyHint<\/code>、<code>idempotent<\/code>、<code>async<\/code>、<code>requiredScopes<\/code>、<code>requiredSecrets<\/code>、<code>dataClassification<\/code>、<code>costTier<\/code>、<code>contractVersion<\/code>、<code>schemaSha256<\/code>、<code>agent.expose / requiresConfirmation<\/code>）S1 全部落库不派生；清单 <code>permissions.platform/data/egress/secrets/ui<\/code> 落库（租户管理员批准 S1 API、S2 UI）；<code>inputSchema<\/code> 禁 tenant 字段的清单校验与契约 lint；OpenAPI 3.1 + <code>operationId<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities<\/code> 对同一插件返回的条目含全部 Agent 字段，且 <code>schemaSha256<\/code> 与 <code>pack<\/code> 时计算值一致<\/li>\n<li class='chk'><span class='box'><\/span>TCK：<code>inputSchema<\/code> 含 <code>tenantId<\/code> 的能力安装失败并返回带 JSON Pointer 的错误<\/li>\n<li class='chk'><span class='box'><\/span>UT：清单 <code>permissions.*<\/code> 五类落库并可经 API 读取；安装时需租户管理员批准的 API 存在<\/li>\n<li class='chk'><span class='box'><\/span>contracts/v0 全部 Schema 去掉 <code>x-status: draft<\/code> 并转 additive-only（条件：S1-RT-004 / S1-IDP-001 / S1-AZ-001 / S1-EVT-001 / S1-GW-001 均已进入 review；R53，contracts/v0/README.md 第 8 节第 9 条）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-08 claude：验收补一条「去掉 contracts/v0 的 draft」（S1-DEC-010 R53）<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-002.md"},{"id":"S1-AGT-003","title":"主体模型与委托链落位验证：agent / act / actor_type","status":"todo","stage":"S1","area":"AGT","areaName":"Agent 就绪","wave":2,"priority":"P0","type":"test","owner":"","estimate":"2d","days":2.0,"depends":["S1-IDP-002","S1-AUD-001","S1-RT-006"],"blockedBy":["S1-IDP-002","S1-AUD-001","S1-RT-006"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>7.18 第 3、7、8、12 项的跨组件验证：<code>Client.type<\/code> 枚举含 <code>agent<\/code>、令牌预留 <code>act<\/code> / <code>profile<\/code>、<code>client_credentials<\/code> 可用；审计 <code>actor_type<\/code> 含 <code>agent<\/code> 与 <code>channel = mcp<\/code>；计量 <code>principal_kind = agent<\/code>；所有 API 无会话亲和；Operation 状态枚举 <code>working / input_required / completed / failed / cancelled<\/code> 在 SDK 契约包预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：以 <code>principal_kind = service<\/code> 的 <code>client_credentials<\/code> 令牌调用能力，审计记录 <code>actor_type = service<\/code>；Schema 中 <code>actor_type<\/code> 可取 <code>agent<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>Client.type<\/code> 可取 <code>agent<\/code>；令牌 Schema 含 <code>act<\/code> / <code>profile<\/code> 预留位且 S1 不启用<\/li>\n<li class='chk'><span class='box'><\/span>UT：Operation 状态枚举在 SDK 契约包中存在且为五值<\/li>\n<li class='chk'><span class='box'><\/span>IT：两个 platform 副本间无会话亲和，任一请求可由任一副本处理<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AGT-003.md"},{"id":"S1-AUD-001","title":"qian.audit 命令级哈希链与 AuditBehavior 监听器","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-005","S1-RT-001","S1-DATA-001","S1-KUN-009"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-009-audit.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-009-audit.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-10","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.audit<\/code>（<code>Qian.Audit.Abstractions<\/code> / <code>ctx.Audit<\/code> + <code>Qian.Audit<\/code>，随 SDK 进每个 .NET profile）：<code>audit_entries<\/code>（tenant_id、seq、prev_hash、content_hash UNIQUE、actor_type ∈ user | service | agent、on_behalf_of、capability_id、contract_version、input_hash、channel ∈ ui | api | mcp | a2a | job | event、resource、result、trace_id、payload）与 <code>audit_chain_state<\/code>（按租户一条链 + 平台链，<code>SERIALIZABLE<\/code> 读 tip 更新、冲突重试）；<code>content_hash = SHA256(prev_hash || canonical_json(entry))<\/code>；Mediator <code>AuditBehavior<\/code> 读 <code>[Capability(Audit = true)]<\/code>，命令默认记录、查询 opt-in，记输入哈希并按 Schema <code>sensitive<\/code> 脱敏；作为 base 组合包的 <code>waterfall<\/code> 监听器，卸载即逆序撤销；<code>IAuditWriter<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用一次「创建客户」命令产生 1 条 <code>audit_entries<\/code>（<code>capability_id = crm.customer.create<\/code>）；事务回滚时不存在<\/li>\n<li class='chk'><span class='box'><\/span>IT：两个副本并发写同一租户链 1000 条，<code>seq<\/code> 连续、<code>prev_hash<\/code> 严格串联<\/li>\n<li class='chk'><span class='box'><\/span>IT：以 <code>actor_type = agent, on_behalf_of = &lt;user&gt;<\/code> 记录一条审计并可按 <code>on_behalf_of<\/code> 查询<\/li>\n<li class='chk'><span class='box'><\/span>UT：敏感字段按 Schema <code>sensitive<\/code> 脱敏后参与 <code>input_hash<\/code>；查询默认不记录、<code>Audit = true<\/code> 后记录<\/li>\n<li class='chk'><span class='box'><\/span>UT：卸载组件时 <code>waterfall<\/code> 监听器被逆序撤销<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-001.md"},{"id":"S1-AUD-002","title":"实体级同事务 AuditLog、IAuditReader 与链校验作业","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AUD-001","S1-EVT-001","S1-SCH-001"],"blockedBy":["S1-AUD-001","S1-EVT-001","S1-SCH-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>QianAuditSaveChangesInterceptor<\/code> 在 <code>SavingChangesAsync<\/code> 写 <code>audit_logs<\/code>（字段级 diff）并投递 <code>qian.audit.record.v1<\/code> 到 Outbox，与业务同事务提交；<code>IAuditReader<\/code>：<code>GET /api/audit/entries?tenant=&amp;actor=&amp;capability=&amp;from=&amp;to=<\/code>、<code>GET /api/audit/logs?entity=&amp;key=<\/code>，租户视角只见本租户、平台视角可跨租户但本身被审计；保留策略；链校验作业（P1，经 7.13 调度）重放全链比对；仓库内不再引用废弃的事后拦截器。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：「创建客户」命令产生的 <code>audit_entries<\/code> 与 <code>audit_logs<\/code>（字段级 diff）<code>trace_id<\/code> 相同；事务回滚时两者都不存在<\/li>\n<li class='chk'><span class='box'><\/span>IT：篡改任一历史 <code>audit_entries.payload<\/code> 后链校验作业报告断链位置<\/li>\n<li class='chk'><span class='box'><\/span>IT：租户视角 <code>IAuditReader<\/code> 查不到其他租户记录；平台视角跨租户查询本身产生审计条目<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：仓库内不存在对 <code>Kun.Audit.EntityFrameworkCore.AuditSaveChangesInterceptor<\/code> 的引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-002.md"},{"id":"S1-AUD-003","title":"qian.observability：baggage 贯通、日志与健康检查","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-001","S1-TEN-001","S1-EVT-002"],"blockedBy":["S1-TEN-001","S1-EVT-002"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.observability<\/code>（<code>Qian.Observability.Abstractions<\/code> + <code>Qian.Observability<\/code>，随 SDK）：<code>AddQianObservability()<\/code> 一行装配 + 网关宿主接入；baggage <code>tenant.id / user.id / membership.id / plugin.id / principal.kind<\/code> 在租户中间件、消息订阅器、作业执行器三处写入，<code>agent.id / run.id<\/code> 预留；<code>traceparent<\/code> 贯通 HTTP、gRPC、RabbitMQ 头与作业参数；日志结构化（<code>tenant_id<\/code>、<code>trace_id<\/code>）；指标前缀 <code>qian_<\/code>；<code>PgHealthCheck / RedisHealthCheck / RabbitMqHealthCheck / ApolloHealthCheck<\/code> 聚合到 <code>/readyz<\/code>；OTel 语义约定文档。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：外壳一次请求 → 网关 → platform → RabbitMQ 消费 → 作业回调，在 Tempo 中为一条 trace，每个 span 带 <code>tenant.id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>E2E：拔掉 RabbitMQ 后 <code>/readyz<\/code> 503、<code>/healthz<\/code> 200；恢复后 <code>/readyz<\/code> 200<\/li>\n<li class='chk'><span class='box'><\/span>UT：三处写入点（中间件、订阅器、作业执行器）均设置 baggage；日志行含 <code>tenant_id<\/code> 与 <code>trace_id<\/code> 字段<\/li>\n<li class='chk'><span class='box'><\/span>文档：OTel 语义约定（baggage 键、指标前缀、span 命名）入开发手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-003.md"},{"id":"S1-AUD-004","title":"计量事件 qian.meter.v1、IMeter 与 Grafana 仪表盘","status":"todo","stage":"S1","area":"AUD","areaName":"审计与可观测","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-AUD-003","S1-EVT-001"],"blockedBy":["S1-AUD-003","S1-EVT-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.11.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.16","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>IMeter.Record(...)<\/code> 产出 <code>qian.meter.v1<\/code>（tenant_id、project_id?、plugin_id、principal_kind、capability_id、unit、quantity）经 Outbox 落 append-only <code>meter_events<\/code>，从第一天带租户 / 项目双键；标准仪表盘与 SLO 指标（P1）：请求量 / 错误率 / 延迟 / Outbox 积压 / 消费重试；供 7.16 模型调用计量与 S3 计费复用。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用调用一次 <code>files.presign-upload<\/code> 产生一条 <code>meter_events<\/code>（<code>unit = request<\/code>），带 <code>tenant_id<\/code> 与 <code>plugin_id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>meter_events<\/code> 为 append-only，<code>principal_kind<\/code> 可取 <code>agent<\/code><\/li>\n<li class='chk'><span class='box'><\/span>代码审查：Grafana 仪表盘 JSON 入 git，含请求量 / 错误率 / 延迟 / Outbox 积压 / 消费重试五类面板（P1）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AUD-004.md"},{"id":"S1-AZ-001","title":"Qian.Authz.Abstractions 契约先行：端口、命名与错误码","status":"done","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"cody","estimate":"2d","days":2.0,"depends":["S1-KUN-006","S1-RT-001","S1-AGT-001","S1-KUN-009"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.4","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-006-authorization-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-006-authorization-model.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"packages/Qian.Authz.Abstractions/README.md","url":"https://github.com/idadawn/qian/blob/main/packages/Qian.Authz.Abstractions/README.md"}],"updated":"2026-10-12","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>与 7.4 互为前置、契约先行：Definition 暴露 <code>ctx.Authz<\/code> 并再导出 <code>Kun.Authorization<\/code> 端口（<code>IPermissionChecker<\/code> / <code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code>；端口归属见 ADR-019 §7 待确认）；<code>PermissionDefinition<\/code>（资源类型、动作、风险级别、step-up、终端）；权限点命名规范 <code>&lt;plugin-id&gt;:&lt;resource&gt;:&lt;action&gt;<\/code>（R9）；<code>Check / BatchCheck / ListAllowedActions / ListPermissions / Explain<\/code> 接口形状；结构化错误码目录（<code>AUTHZ_DENIED<\/code>、<code>CONSTRAINT_MUTEX<\/code>、<code>CARDINALITY_USER_LIMIT<\/code>、<code>PARTIAL_SUCCESS<\/code> …）与多语言文案 JSON 导出。<\/p>\n<p>Kun 2026.10.9 行为变更（S1-KUN-009，2026-10-10）：<code>Kun.Authorization<\/code> 已作为独立包发布，只放端口（<code>IPermissionChecker<\/code> / <code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code>、<code>AuthorizationSubject<\/code>、可解释判定），不内置 RBAC/ABAC，三个入口缺少引擎时一律拒绝且在 handler 前判定——HTTP 用 <code>services.AddKunAuthorization()<\/code> + 端点 <code>.RequireKunPermission(&quot;&lt;权限点&gt;&quot;)<\/code>，gRPC 用 <code>[RequiresPermission]<\/code>（<code>AddKunGrpc()<\/code> 自动装配拦截器），Mediator 的 <code>PermissionBehavior<\/code> 只有逐命令的泛型注册 <code>AddPermissionBehavior&lt;TRequest, TResponse&gt;(denied)<\/code>（命令须实现 <code>IPermissionProtectedRequest<\/code> 静态声明 <code>RequiredPermissions<\/code>），Kun 没有开放泛型的全局注册；本任务要决定由 <code>qian.authz<\/code> 逐命令注册还是自建全局行为，并用门禁保证受保护命令不漏注册。权限集合不从令牌直接推导。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>Qian.Authz.Abstractions<\/code> 只依赖 <code>Kun.Authorization<\/code> 端口、<code>Kun.*.Abstractions<\/code> 与 <code>Qian.Runtime<\/code>，通过 PublicAPI 分析器<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：权限点全名拼接规则与 <code>qian.sample.crm:customer:read<\/code> 等样例通过单测；清单 <code>resource<\/code> 不带插件前缀<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：错误码目录与多语言文案导出为 JSON 并符合 <code>ErrorDetail<\/code> 约定<\/li>\n<\/ul>\n<h4>实现与验证证据<\/h4>\n<ul>\n<li><code>Qian.Authz.Abstractions<\/code> 复用 Kun 的五方法判定端口与数据/字段端口，提供 Authz 服务键、规范权限元数据、错误目录及多语言 ErrorDetail 导出。<\/li>\n<li>Mediator 采用 <code>AddAuthorizedHandler<\/code> 逐命令登记同一 builder 的权限行为与处理器；QIAN0005 编译门禁覆盖两个底层重载、方法组引用、泛型包装及伪造桥接类，普通未受保护命令保持可注册。<\/li>\n<li>真实启动校验发现的框架重复登记问题已在 [Kun PR #52](https://github.com/idadawn/kun/pull/52) 修复，全 24 项 CI 通过；[2026.10.11 发布](https://github.com/idadawn/kun/actions/runs/38153820866) 成功，Qian 从 nuget.org 实际还原并将 KunVersion 升至该正式版。<\/li>\n<li>本地全仓 Release 构建零警告，13 包依赖图通过，36 项门禁覆盖通过（一次本地还原进程退出后，对应 10 项依赖门禁独立重跑通过）；强制要求 Docker 的全量 282 项测试通过、零跳过。新增 Authz 契约 24 项，包含真实 Kun 管道的缺引擎、拒绝、放行及匿名场景。<\/li>\n<li>本任务只完成 Definition 与注册边界；权限注册表/角色模板、RBAC 引擎与完整入口 PEP/审计分别由 AZ-002、003、004 交付。<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-10 claude：背景记入 Kun 2026.10.9 的鉴权端口落地（<code>Kun.Authorization<\/code> 发包、<code>PermissionBehavior<\/code> 只能逐命令注册、缺引擎即拒绝），随 S1-KUN-009 升级可用<\/li>\n<li>2026-10-11 someone：用户已批准QA-002必要前置。DATA-001草稿等待DEC-017，串行转入不依赖该裁决的权限Definition：复用Kun.Authorization端口，补命名/判定契约与错误码验收。<\/li>\n<li>2026-10-11 cody：真实Kun管道验收发现2026.10.9在ValidateOnBuild下因权限行为重复DI注册启动失败；保持检查不降级，串行修复Kun并发布正式包后完成本任务。<\/li>\n<li>2026-10-11 cody：实现及编译门禁已准备；等待Kun PR #52全绿合并与正式NuGet发布，保留ValidateOnBuild回归。上游CI串行排队期间切回已批准的DEC-017/DATA-001，不将当前本地实现标为完成。<\/li>\n<li>2026-10-12 cody：Kun PR #52已全绿合并并发布2026.10.11；正式NuGet包已从nuget.org实际还原。恢复权限契约的ValidateOnBuild真管道验收及完整门禁。<\/li>\n<li>2026-10-12 cody：契约及三项验收通过：正式Kun2026.10.11、24项新增Authz测试、282项全仓测试无跳过、13包依赖与编译门禁通过。准备远程CI验收，完整RBAC/PEP仍由后续任务交付。<\/li>\n<li>2026-10-12 cody：PR #45实现头1e479009的全部远程检查通过，含真实容器测试、TS共用TCK、声明式表面与文档预览；.NET证据 https://github.com/idadawn/qian/actions/runs/38155241583 。三项验收完成，回写看板后由最终头CI复核并合并。<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-001.md"},{"id":"S1-AZ-002","title":"权限点注册表、资源类型与默认角色模板","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-001","S1-RT-004"],"blockedBy":["S1-RT-004"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>permission_definitions<\/code> / <code>resource_types<\/code> / <code>policy_packs<\/code>：平台模式由 <code>ctx.Registry<\/code> 读清单 <code>provides.permissions<\/code> 登记并拼接全名；独立模式由 <code>[Permission]<\/code> 特性登记（ADR-019 D19.4）；插件默认角色模板（策略包）安装即可用；资源类型由插件注册；<code>qian.authz.resource-type/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：参考应用清单声明资源 <code>customer<\/code> 的动作 <code>[read, write, export]<\/code>（登记为 <code>qian.sample.crm:customer:&lt;action&gt;<\/code>）与默认角色模板，安装后租户 Owner 自动拥有全部、使用者只有 read<\/li>\n<li class='chk'><span class='box'><\/span>UT：独立模式下 <code>[Permission]<\/code> 特性登记的权限点与平台模式清单登记结果形状一致<\/li>\n<li class='chk'><span class='box'><\/span>UT：权限点带风险级别与 step-up 字段并可被 <code>GET /api/authz/me/permissions<\/code> 读取<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-002.md"},{"id":"S1-AZ-003","title":"租户域 RBAC 存储与求值引擎（Check / Explain、缓存）","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-AZ-002","S1-IDP-001","S1-TEN-001","S1-DATA-001"],"blockedBy":["S1-AZ-002","S1-TEN-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-006-authorization-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-006-authorization-model.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>roles<\/code>（tenant_id 可空 = 平台角色、builtin、source_pack）、<code>role_assignments<\/code>（主体可为用户 / 组织 / 岗位 / 用户组、有效期）、<code>grants<\/code>；内置角色：平台超管、租户 Owner / Admin / 开发者 / 使用者 + 自定义；有效角色 = 直接授予 ∪ 经组织 / 岗位 / 组获得；<code>Check<\/code> 缺省拒绝；缓存键 <code>(tenant, membership, identity_revision)<\/code> Redis TTL 10 分钟；超管旁路显式声明并审计；<code>Explain<\/code> 返回 <code>{ decision, matchedRoles[], matchedGrants[], missing[], reason }<\/code>。S1 最大单项之一。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>Explain<\/code> 对被拒请求返回缺少的权限点与命中角色；对放行请求返回命中链路<\/li>\n<li class='chk'><span class='box'><\/span>IT：平台超管访问租户资源被放行且审计记录 <code>bypass = superadmin<\/code>；超管不出现在租户成员列表<\/li>\n<li class='chk'><span class='box'><\/span>IT：把角色授予组织 X，X 下成员在 ≤ 3 秒内获得权限<\/li>\n<li class='chk'><span class='box'><\/span>UT：未注册权限点或无匹配授权时 <code>Check<\/code> 返回拒绝（fail-closed）；<code>BatchCheck<\/code> 与逐条 <code>Check<\/code> 结果一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-003.md"},{"id":"S1-AZ-004","title":"PEP 三处强制执行点、决策审计与授权变更失效传播","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-003","S1-AUD-001","S1-EVT-001"],"blockedBy":["S1-AZ-003","S1-AUD-001","S1-EVT-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>ASP.NET Core <code>[RequirePermission]<\/code>、Mediator <code>AuthorizationBehavior<\/code>（读 <code>[Capability(RequiredPermission=...)]<\/code>，作为 base 组合包的 <code>waterfall<\/code> 监听器）、gRPC 拦截器同一入口；端点 → 权限点写进 OpenAPI 扩展 <code>x-qian-permission<\/code>；<code>decision_logs<\/code>（可配采样，拒绝必记）入哈希链；授权变更 → <code>authz.grant.changed.v1<\/code> / <code>authz.role.changed.v1<\/code> → 7.4 递增受影响主体的 <code>identity_revision<\/code> → 7.13 推送刷新。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：未声明权限点的端点在 <code>Production<\/code> 模式返回 403（默认拒绝）；声明后无权限主体 403、有权限主体 200，且每次拒绝有 <code>decision_logs<\/code> 记录<\/li>\n<li class='chk'><span class='box'><\/span>IT：移除角色后 <code>identity_revision<\/code> 递增、缓存失效，旧令牌请求被服务端拒绝<\/li>\n<li class='chk'><span class='box'><\/span>UT：卸载 <code>qian.authz<\/code> 组件时 <code>waterfall<\/code> 监听器被逆序撤销；OpenAPI 中每个受保护端点带 <code>x-qian-permission<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：gRPC 调用与 HTTP 调用对同一权限点判定一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-004.md"},{"id":"S1-AZ-005","title":"Authz API、目录主体解析（组织 / 岗位 / 组）与最小角色授权页","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-AZ-003","S1-IDP-009","S1-YUE-009"],"blockedBy":["S1-AZ-003","S1-IDP-009","S1-YUE-009"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>POST /api/authz/check<\/code>、<code>/batch-check<\/code>、<code>GET /api/authz/me/permissions<\/code>、<code>/me/allowed-actions?resource=<\/code>、<code>POST /api/authz/explain<\/code>、角色与授权 CRUD；主体解析接 7.4.3 目录（组织 / 岗位 / 用户组归属）；最小角色授权页（菜单 / 按钮级，P1）用 yue 授权树；授权变更操作标 <code>write<\/code> + <code>confirm<\/code>，授予平台超管标 <code>humanOnly<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：把角色授予组织 X 后 X 下成员 ≤ 3 秒内获得权限；主归属变化后有效角色随之变化<\/li>\n<li class='chk'><span class='box'><\/span>E2E：租户管理页用 RoleSelect / 授权树完成角色授予并在 <code>Explain<\/code> 中可见命中链路<\/li>\n<li class='chk'><span class='box'><\/span>UT：授予平台超管的能力标 <code>humanOnly<\/code>；授权变更标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-005.md"},{"id":"S1-AZ-006","title":"数据权限契约：DataScopeRule、系统变量与 authz/meta","status":"todo","stage":"S1","area":"AZ","areaName":"鉴权","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-AZ-001","S1-DATA-004"],"blockedBy":["S1-DATA-004"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>第 3 波 S2 契约冻结：<code>DataScopeRule { resource, filter: FilterAST, allData }<\/code>；系统变量枚举（<code>currentUser / currentUserAndSubordinates / … / launchUserId<\/code>，每个带自然语言描述）；合并语义「同角色 AND / 跨角色 OR / 任一全部数据则放开」（Q19）；<code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code> 端口占位；<code>GET /api/authz/meta<\/code> 发布 Schema。编译器在 S2。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：Filter AST JSON Schema 与系统变量枚举可被 <code>GET /api/authz/meta<\/code> 读取并通过 2020-12 校验<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>DataScopeRule<\/code> 样例通过 Schema 校验；合并语义以单测固定<\/li>\n<li class='chk'><span class='box'><\/span>文档：契约写入 specs 并被 §08 数据权限章引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-AZ-006.md"},{"id":"S1-CFG-001","title":"Apollo 配置 provider（自研）与配置源顺序","status":"done","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"cody","estimate":"5d","days":5.0,"depends":["S1-KUN-006","S1-RT-001","S1-KUN-009"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-007-config-center-apollo.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-007-config-center-apollo.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"packages/Qian.Config.Apollo/README.md","url":"https://github.com/idadawn/qian/blob/main/packages/Qian.Config.Apollo/README.md"},{"path":"docs/ops/configuration-runbook.md","url":"https://github.com/idadawn/qian/blob/main/docs/ops/configuration-runbook.md"}],"updated":"2026-10-12","acceptance":{"done":4,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.config<\/code>（<code>Qian.Config.Abstractions<\/code> / <code>ctx.Config<\/code> + <code>Qian.Config.Apollo<\/code>）：公开 HTTP 协议 <code>/configs<\/code>、<code>/notifications/v2<\/code> 长轮询（hold 60s）、AccessKey HMAC-SHA1、本地缓存文件、集群内直连 ConfigService；配置源顺序 appsettings → Apollo（<code>qian.common.*<\/code> → <code>qian.plugin.&lt;id&gt;<\/code> → <code>application<\/code>）→ K8s Secret 文件 → 环境变量 → 命令行；启动时无网络且无缓存 → 关键配置缺失则启动失败；失败降级矩阵 L0–L4 入运维手册；独立模式可只用标准 <code>IConfiguration<\/code>。官方 .NET 客户端只作 PoC 对照。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：在 Apollo 修改 <code>qian.plugin.sample.pageSize<\/code> 后，宿主 ≤ 60s 内 <code>IOptionsMonitor<\/code> 值更新且不重启<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：Apollo 不可达且本地缓存存在时宿主用缓存启动；缓存也不存在时关键配置缺失导致启动失败并打印明确原因<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：配置源叠加顺序以单测固定；<code>Apollo__AppId/Env/Cluster/ConfigServer__0/Label/CacheDir/AccessKey<\/code> 引导项即可启动<\/li>\n<li class='chk done'><span class='box'>✓<\/span>文档：失败降级矩阵 L0–L4 写入运维手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-12 cody：QA-002完整platform必需的qian.config.apollo已确认仍为骨架，且KUN-006/RT-001/KUN-009均完成。DATA草稿#44等待DEC-018时串行推进此独立Provider；复用已发布Kun Apollo协议实现，补配置源顺序和真实Apollo验收，不代替为协议替身。<\/li>\n<li>2026-10-12 cody：已复用正式Kun.Configuration.Apollo完成Config Definition、标准/Apollo适配器、固定五层覆盖顺序、UAT/PRO引导与缓存隔离、AccessKey引用和鉴权拒绝。真实Apollo2.5.2+MySQL8.0.43通过AdminService发版，同一IOptionsMonitor从10变25约465ms；停服缓存可启动，无缓存失败。全仓290测试零跳过、36门禁、15包依赖通过；L0-L4运维手册已落地。生产部署、Portal OIDC、完整秘密治理及SDK/CLI集成保留对应后续任务。<\/li>\n<li>2026-10-12 cody：PR #46 实现头的全部远程CI通过，真实Apollo使用官方镜像名在Linux重验；.NET证据 https://github.com/idadawn/qian/actions/runs/38168766029 。四项本体验收完成，回写状态后复核最终头再合并；生产部署、治理与SDK/CLI安装仍按对应任务执行，不代表这些集成已交付。<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-001.md"},{"id":"S1-CFG-002","title":"ISecretResolver（secretRef）与疑似密钥扫描","status":"done","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"cody","estimate":"2d","days":2.0,"depends":["S1-CFG-001"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"},{"path":"packages/Qian.Config.Secrets/README.md","url":"https://github.com/idadawn/qian/blob/main/packages/Qian.Config.Secrets/README.md"},{"path":"tools/Qian.Secrets.Tool/README.md","url":"https://github.com/idadawn/qian/blob/main/tools/Qian.Secrets.Tool/README.md"},{"path":"docs/ops/configuration-runbook.md","url":"https://github.com/idadawn/qian/blob/main/docs/ops/configuration-runbook.md"}],"updated":"2026-10-12","acceptance":{"done":4,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>secretRef://k8s/&lt;ns&gt;/&lt;name&gt;#&lt;key&gt;<\/code> 解析（Infisical 后端 P2 抽象位）；疑似密钥键名 / 值扫描拦截；分工表写进开发手册（部署级引导项 → Kustomize；平台 / 服务级非敏感 → Apollo；密钥 → K8s Secret；租户级在线设置 → <code>ITenantSettings<\/code>；前端 → <code>window.__APP_CONF__<\/code>）。全部需要凭据的组件（连接器、渠道、文件 Provider、信任根）依赖它。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>secretRef://k8s/...<\/code> 解析到 K8s Secret 文件；无法解析时返回结构化错误而非空值<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>config.schema<\/code> 中标 <code>sensitive<\/code> 的键若在 Apollo 填了非 <code>secretRef://<\/code> 值，CI 门禁失败<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：疑似密钥键名 / 值（如 <code>password<\/code>、<code>secret<\/code>、长随机串）进入 Apollo 非 secretRef 值时被扫描拦截<\/li>\n<li class='chk done'><span class='box'>✓<\/span>文档：分工表入开发手册<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-12 cody：密钥解析与扫描的 38 项定向测试通过，37 项门禁通过，密钥权限对象修正后的 .NET/TS 40 个共享场景一致。审查发现 Kun Apollo 只校验合并值却缓存原始 namespace，会漏掉被覆盖的明文；已单独准备上游修复并补 8 项回归，完成正式发布后再做 Qian 完整真实 Apollo 验收。<\/li>\n<li>2026-10-12 cody：QA-002完整platform中的身份、数据、事件与存储配置均使用secretRef，CFG-001已完成。DATA等DEC-018期间串行推进凭据解析必要前置：按组件模型v2的公开引用和权限边界解析到K8s挂载文件，保留旧k8s定位形式的底层适配并补扫描门禁，不把原始值暴露给模型或日志。<\/li>\n<li>2026-10-12 cody：Kun PR #53 已在 24 项 CI 全绿后合并，修复原始 namespace 在合并与离线缓存前的校验，并覆盖拒绝后恢复；正式版 v2026.10.12 已触发发布，待正式包可还原后运行 Qian 全部真实验收。<\/li>\n<li>2026-10-12 cody：已从 nuget.org 真还原 Kun 2026.10.12（上游 PR #53，发布运行 38174649796），全仓构建零警告；332 项测试零失败零跳过、37 项门禁和 16 包依赖检查通过。真实 Apollo 2.5.2 约 903ms 热更新，明文候选被拒且未入缓存，随后有效引用恢复；secretRef 文件轮换、声明与审批交集、租户/生命周期边界、必须审计及 CI 扫描均有回归。SDK/CLI 代码安装与完整平台集成仍按各自任务执行。<\/li>\n<li>2026-10-12 cody：PR #47 实现头全部 CI 通过；运行 38175836476 的 Linux 制品验证 332/332、零跳过，真实 Apollo 热更新约 580ms，敏感候选拒绝、缓存无被拒值、恢复更新均为 true/false 预期值。四项本体验收完成；回写状态后复核最终头再合并。正式包发布证据见 Kun 38174649796，完整 SDK/CLI 与 platform 联调保留各自任务。<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-002.md"},{"id":"S1-CFG-003","title":"热更新校验保留旧值、config.schema 门禁与发布审计","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-CFG-001","S1-AUD-001"],"blockedBy":["S1-AUD-001"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>ValidatedOptionsMonitor&lt;T&gt;<\/code> 变更先跑校验器，失败保留上一份并计数 <code>qian_config_reload_failed_total<\/code>、发 <code>config.reload.failed.v1<\/code>；插件 <code>config.schema<\/code>（JSON Schema 2020-12）→ CI 生成 Apollo namespace 骨架并比对线上键、options JSON Schema 导出、<code>GET /api/config/schemas/{plugin}<\/code>；<code>dump-config<\/code> 条目 <code>config<\/code> 按此 schema 校验（7.2.1）；Apollo 发布事件进审计。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：发布一个不满足 <code>[Range]<\/code> 的值，宿主保留旧值、指标 +1、告警事件发出；修正后恢复<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>config.schema<\/code> 变更后 CI 生成的 namespace 骨架与线上键比对，缺键 / 多键即失败<\/li>\n<li class='chk'><span class='box'><\/span>E2E：Apollo Portal 经 Authentik OIDC 登录，不公网；配置发布出现在 7.11 审计<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/config/schemas/{plugin}<\/code> 对外可读，值不可读除非有权限且非敏感<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-003.md"},{"id":"S1-CFG-004","title":"特性开关 IFeatureFlags（按租户灰度）","status":"todo","stage":"S1","area":"CFG","areaName":"配置","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-CFG-001","S1-TEN-001"],"blockedBy":["S1-TEN-001"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-014-marketplace.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-014-marketplace.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>OpenFeature 式 <code>IFeatureFlags.IsEnabled(name, tenantId)<\/code>，namespace <code>qian.common.flags<\/code>，键 <code>flag.&lt;name&gt;<\/code> 值为规则 JSON（默认、租户白名单 / 百分比）；只管灰度放量，与 7.14 授权（买没买）、租户 scope 挂载（开没开）分开存（ADR-014 / ADR-020 D20.5）；<code>flags.set<\/code> 标 <code>write<\/code> + <code>confirm<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>IFeatureFlags<\/code> 对白名单租户返回 true、其他租户 false；与 7.14 授权结果、租户 scope 挂载状态互不影响<\/li>\n<li class='chk'><span class='box'><\/span>UT：百分比规则对同一租户稳定（同 key 多次求值结果一致）<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>flags.set<\/code> 能力元数据标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-CFG-004.md"},{"id":"S1-DATA-001","title":"AddQianData 默认安全装配与 RLS 迁移模板","status":"done","stage":"S1","area":"DATA","areaName":"数据","wave":1,"priority":"P0","type":"feature","owner":"cody","estimate":"5d","days":5.0,"depends":["S1-KUN-001","S1-KUN-005","S1-RT-001","S1-KUN-009"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"docs/adr/ADR-011-metadata-dynamic-data.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-011-metadata-dynamic-data.md"}],"updated":"2026-10-12","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.data<\/code>（<code>Qian.Data.Abstractions<\/code> / <code>ctx.Data<\/code> + <code>Qian.Data<\/code>，随 SDK 进每个 .NET profile）：<code>AddQianData&lt;TContext&gt;()<\/code> 强制 RLS 连接版 + 事务版拦截器、<code>KunMultiTenantModelCacheKeyFactory<\/code>、租户与软删过滤、审计字段填充、<code>xmin<\/code>、snake_case、Guid v7、Outbox 同 DbContext；<code>QianDbContext : KunDbContext<\/code> 构造期校验否则 <code>QianDataMisconfiguredException<\/code>；<code>UseKunSchema(&quot;plugin_&lt;id&gt;&quot;)<\/code>；系统列约定；迁移生成器为每个 <code>IMultiTenant<\/code> 表输出 <code>FORCE ROW LEVEL SECURITY<\/code> 策略；CI 检查「在线 DbContext 必须继承 <code>QianDbContext<\/code>」。全部组件表的前提。<\/p>\n<p>Kun 2026.10.9 行为变更（S1-KUN-009，2026-10-10）：snake_case、Guid v7 默认主键、可空审计主体与 PostgreSQL <code>xmin<\/code> 并发令牌在 Kun 里是显式 opt-in（<code>AddKunDataConventions&lt;TContext&gt;()<\/code> / <code>ModelBuilder.ApplyKunDataConventions()<\/code>），不随 <code>AddKunEntityFrameworkCore()<\/code> 自动生效，由 <code>AddQianData&lt;TContext&gt;()<\/code> 统一装配并在构造期校验；<code>SaveChangesResultAsync()<\/code> 把并发冲突映射为 <code>Result<\/code> 的 Conflict；已有非空主键不变，旧非空数值主体需显式迁移。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>UT：缺少 RLS 拦截器或模型缓存键的 DbContext 在启动时被 <code>AddQianData<\/code> 拒绝；代码中 <code>IgnoreQueryFilters()<\/code> 触发分析器错误<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：以非超级用户、无 BYPASSRLS 的应用角色直连绕过 EF，在设置 <code>app.current_tenant_id = A<\/code> 后 <code>SELECT<\/code> 不到租户 B 的行，向 B 插入被 <code>WITH CHECK<\/code> 拒绝（RLS 兜底）；管理员仅建表造数，保留超级用户可绕过的对照，在线应用拒用高权限角色（S1-DEC-017）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>E2E：参考应用的客户表在租户 A、B 各插入 1000 行，A 的列表查询只返回 A 的数据且 <code>EXPLAIN<\/code> 显示走租户索引<\/li>\n<li class='chk done'><span class='box'>✓<\/span>CI：在线 DbContext 不继承 <code>QianDbContext<\/code> 时门禁失败<\/li>\n<li class='chk done'><span class='box'>✓<\/span>RLS 连接版与事务版拦截器、<code>KunMultiTenantModelCacheKeyFactory<\/code> 的装配改为复用 Kun 2026.10.8 起提供的 <code>AddKunTenantRls&lt;TContext&gt;()<\/code>，<code>AddQianData<\/code> 只补 Qian 自己的约束与启动校验，S1-KUN-001 先行交付的最小装配随之收敛；若评估后不复用，在 <code>packages/Qian.Data/README.md<\/code> 写明原因（S1-KUN-008 的未决问题，产品负责人 2026-10-08 同意并入本任务）<\/li>\n<\/ul>\n<h4>分阶段验收边界<\/h4>\n<p>按已批准的 [S1-DEC-018](S1-DEC-018.md)，以上五项为数据本体验收，本任务在本体通过 CI 并合并后完成，解除 Registry 的实现前置。完整组件交付仍须由 [S1-RT-014](S1-RT-014.md) 完成 SDK 字段源生成、默认装配与私有 NuGet 锁步发布，并由 [S1-RT-011](S1-RT-011.md) 回验真实 <code>qian add data<\/code> 安装。相关安装门通过前，<code>plugins/qian.data<\/code> 保留骨架标记；QA-002 总目标继续未完成。<\/p>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>\n<ul>\n<li>2026-10-08 cody：S1-KUN-001 先行交付 Qian.Data.Abstractions / Qian.Data 最小 RLS 安全装配及启动拒绝测试，详见 packages/Qian.Data/README.md；本任务仍负责完整组件、迁移模板、数据约定与分析器，未认领或提前勾选本任务验收。<\/li>\n<li>2026-10-08 cody：先行安全基础已合并 Qian PR #7（https://github.com/idadawn/qian/pull/7），后续实现复用 QianDbContext 与 AddQianData；完整验收与本任务状态保持待办。<\/li>\n<li>2026-10-08 claude：验收加一条：AddQianData 的 RLS 拦截器与模型缓存键装配复用 Kun 2026.10.8 的 AddKunTenantRls&lt;TContext&gt;()（S1-KUN-008 未决问题，产品负责人同意并入本任务）<\/li>\n<li>2026-10-10 claude：背景记入 Kun 2026.10.9 的数据约定变更（snake_case / Guid v7 / <code>xmin<\/code> 为显式 opt-in，<code>AddKunDataConventions&lt;TContext&gt;()<\/code> 由 <code>AddQianData<\/code> 装配），随 S1-KUN-009 升级可用<\/li>\n<li>2026-10-11 someone：用户已批准补齐QA-002必要前置。开始DATA-001：复用Kun 2026.10.9安全装配和数据约定，补迁移RLS、编译期门禁与真实双租户验收。<\/li>\n<li>2026-10-11 someone：验收中超级用户受RLS约束的要求与PostgreSQL16事实及仓库受限应用角色测试规范冲突；记录决策等待确认，继续独立的Kun装配、模型约定及分析器实现。<\/li>\n<li>2026-10-11 someone：独立准备已实现：复用Kun双拦截器/审计/租户写入，强制插件schema与模型约定，保留业务过滤；编译正反例通过。PostgreSQL16容器8项数据测试无跳过通过，包括超级用户对照、Guid v7/审计/xmin/软删。自动迁移、完整组件与参考应用仍未完成，DEC-017待确认。<\/li>\n<li>2026-10-11 someone：DEC-017已获批，验收口径阻塞解除。草稿PR #44保留，待当前AZ-001契约收尾后按既定串行约束恢复完整实现；尚未完成的功能与验收不变。<\/li>\n<li>2026-10-11 cody：Kun权限修复等待发布期间串行恢复：落实已批准DEC-017，先同步真实角色边界及app.current_tenant_id，并补在线高权限角色拒绝。<\/li>\n<li>2026-10-11 cody：DEC-017已实施：会话契约与受限角色验收已同步；应用启动和同步/异步开连接拒绝superuser/BYPASSRLS，预打开连接及管理员SET ROLE降权对照同样拒绝。13项真库数据测试通过；全仓266项测试零跳过，36门禁及12包依赖检查通过。自动迁移、完整seam/Outbox与1000行索引仍未完成。<\/li>\n<li>2026-10-12 cody：新增PostgreSQL迁移SQL生成器：从目标模型的租户标记自动为新建表输出ENABLE/FORCE RLS，限制策略抵御附加宽松策略，空租户拒绝访问。真实执行迁移差异器生成的SQL验证跨租户写和空租户写均42501；数据16项通过。历史表改造仍须显式迁移，参考应用/seam/Outbox尚未完成。<\/li>\n<li>2026-10-12 cody：当前增量全仓269项测试无跳过、36门禁与12包依赖检查通过；保留草稿#44，串行转回已取得正式Kun修复包的AZ-001收尾。DATA待恢复项为完整Data seam/Outbox、deleted_by和每租户1000行参考应用索引验收，既有代码与验收证据保留。<\/li>\n<li>2026-10-12 cody：AZ-001已通过最终CI并随PR #45合并；恢复DATA完整实现。同步主线正式Kun2026.10.11与QIAN0005，合并保留数据QIAN0003/0004和全部角色/RLS策略保护。<\/li>\n<li>2026-10-12 cody：与AZ-001主线合并后验证通过：正式Kun2026.10.11，13个包依赖检查、37项门禁、293项测试均成功且无跳过；保留QIAN0003/0004/0005全部规则。接着补齐Data seam、同上下文Outbox、deleted_by及真实参考应用索引验收。<\/li>\n<li>2026-10-12 cody：新增真实DataPlugin、DataDefinition/IDataService/IDataSession：每次会话独立scope，复用Kun EfUnitOfWork并绑定同一上下文/事件缓冲；验证通知同scope、保存失败整体回滚、多上下文互不串写、租户切换拒绝及卸载释放。补齐deleted_by：直接Remove转软删除，删除主体/时间自动填充且原审计不能改写。全仓299测试零跳过；数据22项含严格ValidateOnBuild/ValidateScopes通过；13包依赖、37门禁覆盖通过（一次本地还原进程异常的委托编译样例独立重跑通过）。旧组件配置骨架与正式入口尚待对齐，千行参考应用/索引验收未完成，保持草稿。<\/li>\n<li>2026-10-12 cody：五项本体验收完成：实际Kestrel+RS256身份+PostgreSQL的客户列表验证A/B各1000行；捕获真实列表SQL执行EXPLAIN ANALYZE命中租户复合索引。连接引用选择、独立库模式和租户挂载边界通过；全仓308测试零跳过、37门禁及13包依赖通过。SDK字段生成RT-014依赖RT-004，RT-004又依赖DATA-001，完整代码安装另属RT-011；按DEC-018请求本体与集成分期，未获批前保留草稿及骨架标记。<\/li>\n<li>2026-10-12 cody：独立前置CFG-001已随PR #46合并；同步最新主线并保留本草稿。组合验证316项测试零跳过、37门禁、15包依赖检查通过，包含真实CRM/PG索引与真实Apollo。DEC-018仍待产品负责人答复，本次同步不代表DATA合并或安装门通过。<\/li>\n<li>2026-10-12 cody：同步已合并的 CFG-002 与 Kun 2026.10.12；组合全仓构建零警告、358 项测试零失败零跳过、38 项门禁及 16 包依赖检查通过。真实 CRM HTTP/RLS 与实际列表 SQL 索引计划、真实 Apollo 拒绝/恢复同时通过。PR #44 继续保持草稿和 blocked，DEC-018 未答复，不改验收分期或 SDK/CLI 安装边界。<\/li>\n<li>2026-10-12 cody：产品负责人已批准 DEC-018 分阶段验收；五项数据本体验收完成，并随 PR #44 在最终 CI 全绿后合并交付。复核 Linux 证据为 358/358 测试零跳过，真实列表查询命中租户复合索引。SDK 源生成、默认装配、私有 NuGet 锁步发布和 qian add data 已回写 RT-014/011 为未完成必过项；保留骨架标记，QA-002 未完成。<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-001.md"},{"id":"S1-DATA-002","title":"多副本迁移协调、分布式 ID（Guid v7 / 雪花租约）与序号服务","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-DATA-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>MigrateAsync<\/code> 前取 <code>pg_advisory_lock(hash(schema))<\/code>，K8s 迁移 Job 先行（<code>--migrate-only<\/code>），多副本启动时只校验不迁移；默认 Guid v7，数值 id 用雪花、WorkerId 经 Redis 租约 <code>qian:snowflake:worker:{n}<\/code> 分配；<code>ISequenceService.NextAsync(ruleCode, scopeKey)<\/code> 规则 DSL <code>prefix + yyyyMMdd + seq(6)<\/code>，PG <code>UPDATE ... RETURNING<\/code> 原子取号。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：两个副本同时启动并执行迁移，只有一个执行 DDL、另一个等待后校验通过<\/li>\n<li class='chk'><span class='box'><\/span>IT：100 并发取号同一序号规则无重复无跳号；规则修改后从 1 重新开始<\/li>\n<li class='chk'><span class='box'><\/span>IT：雪花 WorkerId 在 3 个副本间互不相同，副本重启后租约回收复用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-002.md"},{"id":"S1-DATA-003","title":"基准类型与 PG 方言组件、数据连接档案","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-DATA-001","S1-CFG-002"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>BaseDataType<\/code>（int / bigint / decimal / float / datetime / varchar / text / bool / json / uuid，系统类不可删）、<code>DbDialect<\/code>（postgres）、<code>DialectTypeMapping<\/code>（长度 / 精度 / 区间校验）作为种子数据与 <code>GET /api/data/meta/types<\/code>；方言为独立组件 <code>Qian.Data.Dialect.Pg<\/code>（数据包，<code>qian.data.dialect/v1<\/code> SPI）；<code>DataConnection<\/code>（凭证只存 secretRef、<code>POST /connections/{id}:test<\/code>、详情不回传密钥）；<code>StandardField<\/code> 由基类固化。MySQL 方言本期不做。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/data/meta/types<\/code> 返回基准类型、方言与映射，系统类不可删除<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>POST /connections/{id}:test<\/code> 对可达 / 不可达库分别返回成功 / 结构化错误；详情接口不回传密钥<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>DialectTypeMapping<\/code> 对超出长度 / 精度 / 区间的字段定义拒绝<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-003.md"},{"id":"S1-DATA-004","title":"Filter AST、运算符矩阵与 IRecordHook 契约","status":"todo","stage":"S1","area":"DATA","areaName":"数据","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-DATA-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"},{"path":"docs/adr/ADR-011-metadata-dynamic-data.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-011-metadata-dynamic-data.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>第 3 波 S2 契约冻结：Filter AST <code>{ logic, groups: [{ logic, conditions: [{ field, op, value | sysVar }] }] }<\/code>，运算符 <code>eq ne like notLike isNull notNull in notIn ge gt le lt between<\/code>，矩阵 <code>{ fieldType: [op] }<\/code> 发布为 JSON Schema，五处共用；数据规则策略契约（主键策略、乐观锁、逻辑删、业务主键）；<code>IRecordHook<\/code> before / after 契约与 <code>qian.record.changed.v1<\/code> 信封；S2 SQL 生成只接受参数化 + 标识符白名单。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：Filter AST 示例通过 JSON Schema 校验；<code>between<\/code> 用于布尔字段被矩阵拒绝<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>qian.record.changed.v1<\/code> 信封与 <code>IRecordHook<\/code> 接口随 <code>Qian.Data.Abstractions<\/code> 发布并通过 PublicAPI 分析器<\/li>\n<li class='chk'><span class='box'><\/span>文档：契约写入 specs 并被 7.5 数据权限、§08 高级查询 / 流程条件引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DATA-004.md"},{"id":"S1-DEC-001","ti S 运营）与分发渠道（S1 只发 GitHub Packages，是否以及何时公开到 nuget.org / npm）。它决定能否公开 feed、ISV 能否再分发，并影响 7.2.4 社区市场与 <code>qian add<\/code> 的包源。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>许可证结论写入 ADR-019 §7 与 ADR-020 §7 第 6 条，并在所有 <code>Qian.*<\/code> / <code>@qian/*<\/code> / <code>@yue/*<\/code> 包元数据中落地<\/li>\n<li class='chk done'><span class='box'>✓<\/span>分发渠道结论：S1 GitHub Packages 私有 feed 的组织与权限方案；公开 feed 的前置条件与时点<\/li>\n<li class='chk done'><span class='box'>✓<\/span>7.2.4 社区市场「只发现、不自动信任」与包源白名单按结论回填<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：拍板：Apache-2.0（包族、CLI、yue），S3 商业组件另定；S1 GitHub Packages 私有，S2 末或首个外部宿主试用时公开 nuget.org/npm（ADR-020 §7 第 6 条）<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-006.md"},{"id":"S1-DEC-007","title":"拍板：qian CLI 是否提供可选匿名遥测","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave":0,"priority":"P2","type":"decision","owner":"claude","estimate":"0.5d","days":0.5,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/adr/ADR-020-component-model-v2.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-07","acceptance":{"done":2,"total":2},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 §7 第 7 条：<code>qian<\/code> CLI 是否提供可选的匿名遥测以统计外部宿主安装数；默认不带，S3 随隐私口径一起拍板（R43）。S1 只需确认「默认不带」并在 CLI 预留开关位置。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>结论写入 ADR-020 §7 第 7 条；S1 CLI 不发送任何遥测<\/li>\n<li class='chk done'><span class='box'>✓<\/span>若 S3 启用：登记需要的隐私口径、数据项与开关形式<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：拍板：默认不采集；S2 opt-in qian telemetry on，仅命令名/版本/OS/匿名 id；私有化可禁用（ADR-020 §7 第 7 条）<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-007.md"},{"id":"S1-DEC-008","title":"拍板：qian init --template 模板集定稿","status":"done","stage" ate":"0.5d","days":0.5,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/adr/ADR-021-product-family-structure.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-021-product-family-structure.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#D19.7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"docs/prd/specs/component-model.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"deploy/pm-board/README.md","url":"https://github.com/idadawn/qian/blob/main/deploy/pm-board/README.md"}],"updated":"2026-10-07","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>产品族仓库目前分在两个 GitHub 所有者下：Kun 与 iClaw 源码在 CavaiLAB 组织，Qian、部署仓库、MaaS 在个人账号。GitHub Packages 的 NuGet feed 按所有者划分，<code>Qian.*<\/code> 又传递依赖 <code>Kun.*<\/code>，两个所有者意味着消费者要配两段源加 <code>packageSourceMapping<\/code>，与「装一个包就能用」（ADR-019）相悖；<code>qian-plugins<\/code> 规定为「与 Qian 同组织」但组织名仍是占位。<\/p>\n<p><strong>推荐：Qian 迁入 CavaiLAB<\/strong>。理由：Kun 的 CI 与 feed 零改动，产品负责人是该组织管理员，Kun 的其它下游不受影响；迁移成本只在 Qian 侧的四处地址。<strong>备选：新建专用组织<\/strong>（公开形象更干净，但要同时迁 Kun 的 feed 与 CI；留到 S3 公开前再评估，届时包已在 nuget.org / npm）。<strong>备选：维持现状<\/strong>（两个 feed，S1 内部可忍，S2 末公开前必须解决）。<\/p>\n<p>若迁移，GitHub 会自动重定向 git 地址，但要改：① <code>deploy/pm-board/deployment.yaml<\/code> 的 <code>GITSYNC_REPO<\/code>；② <code>deploy/pm-board/bootstrap.sh<\/code> 的 <code>REPO<\/code>；③ 部署仓库 <code>env-ds/argocd/qian-pm-board-application.yaml<\/code> 的 <code>repoURL<\/code> 与 ArgoCD 仓库凭据 <code>argocd/qian-repo-ssh<\/code> 的 <code>url<\/code>；④ 在新仓库重新登记只读 deploy key；⑤ CI secrets / variables 随仓库迁移；开放的 PR 与 issue 随仓库保留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人决定：产品族所有者 = <code>idadawn<\/code>，<strong>Kun 从 CavaiLAB 迁入<\/strong>（而非 Qian 迁出），理由是 iCla -KUN-004，且还有 DATA/TEN/AZ 前置。Kun 客户端、会话、S2S 与编译门禁已可独立验证；不能用协议夹具冒充产品身份服务，也不能未经裁决改写现有验收。<\/p>\n<h4>已裁决<\/h4>\n<p>2026-10-11 产品负责人明确选择“分阶段验收（推荐）”。权威结论已写入 ADR-005 §9；SDK 阶段与真实身份服务联调分别由 S1-KUN-004、S1-IDP-002 承担，后者仍是身份服务完成与发布必过项。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人选择验收归属与依赖处理方式<\/li>\n<li class='chk done'><span class='box'>✓<\/span>按裁决同步 S1-KUN-004 / S1-IDP-002 的验收和相关 PRD 引用，保留产品联调门禁<\/li>\n<\/ul>\n<h4>已准备的证据<\/h4>\n<p>Kun 客户端已通过签名协议夹具、真实 HTTP 和 Redis 验证；本地整仓 852 项通过、2 项既有外部对象存储测试跳过，补充策略测试后 Identity 模块 61 项通过；原生程序实测匿名/吊销 401、有效会话 200。Qian 全仓 252 项与 35 项门禁通过。源码及本地测试包均已可评审，不把协议夹具当作真实身份服务。<\/p>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-11 cody：创建任务<\/li>\n<\/ul>\n<ul>\n<li>2026-10-11 cody：编号 014 已被 TS 发布名决策的独立分支占用，本条新决策使用 015，未改动原决策。<\/li>\n<li>2026-10-11 cody：用户已明确选择分阶段验收；同步 ADR、PRD 与真实身份服务必过联调门。<\/li>\n<li>2026-10-11 cody：完成：用户已批准分阶段验收，结论写入 ADR-005 §9，PRD 与 IDP-002 保留真实 PKCE/nonce 联调必过门。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-015.md"},{"id":"S1-DEC-016","title":"DEP-001 基线验收与真实平台四依赖联调分阶段","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave":0,"priority":"P0","type":"decision","owner":"cody","estimate":"1d","days":1.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"pm/tasks/S1-DEP-001.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEP-001.md"},{"path":"pm/tasks/S1-DEP-002.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEP-002.md"},{"path":"pm/tasks/S1-DEP-003.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEP-003.md"},{"path":"docs/adr/ADR-017-deployment.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-017-deployment.md"},{"path":"pm/tasks/S1-DEP-005.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEP-005.md"}],"updated":"2026-10-11","acceptance":{"done":2,"total":2},"bodyHtml":"<h4>背景<\/h4>\n<p>DEP-001 第一项要求真实 qian-platform 可访问 PG / Redis / RabbitMQ / Apollo；DEP-002 的专属 L1 服务和 DEP-003 的平台镜像却都依赖 DEP-001。当前 qian-platform 仍是组合骨架，不能以贴同名标签的探针或已有共享服务冒充验收。<\/p>\n<p>2026-10-11 早前只读实查曾发现 qd 的 API 返回 ServiceUnavailable，K3s activating/start、NRestarts=550；未修改现网。后续复核 API 已恢复，当前资源容量和生产节点池仍待安排，现场证据见 [基线记录](../../deploy/baseline/README.md)。这些环境前置不因验收裁决而豁免。<\/p>\n<h4>已裁决<\/h4>\n<p>2026-10-11 产品负责人明确选择“分阶段验收，保留真实联调门（推荐）”。权威结论写入 ADR-017 §9：DEP-001 完成真实基础设施验收，真实 qian-platform 四依赖协议联调保留在 DEP-005 的发布必过项，并显式串联 DEP-002/003 的交付。<\/p>\n<p>已准备两环境隔离清单、数据服务、只建缺失项的 Secret 引导工具、静态门禁及上线/回退步骤，尚未接入 Argo 或执行集群变更。具体部署仍须实时容量/节点池确认和变更批准。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人明确选择验收顺序<\/li>\n<li class='chk done'><span class='box'>✓<\/span>按裁决更新 DEP-001 与后续部署任务，保持真实四依赖联调的必过门<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-11 cody：创建任务<\/li>\n<li>2026-10-11 cody：用户已批准分阶段验收，保留真实平台四依赖联调为后续发布必过项；同步 ADR/PRD 与相关任务。<\/li>\n<li>2026-10-11 cody：完成：用户已批准分阶段验收，ADR-017 §9 与 PRD/DEP-001/002/003/005 同步；真实四依赖联调保留发布必过并串联前置。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-016.md"},{"id":"S1-DEC-017","title":"DATA-001 的 RLS 验收角色与既有租户会话契约对齐","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave":0,"priority":"P0","type":"decision","owner":"cody","estimate":"1d","days":1.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"pm/tasks/S1-DATA-001.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DATA-001.md"}],"updated":"2026-10-12","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>DATA-001 / PRD §7.6 要求“数据库超级用户直连”仍被 RLS 拒绝，和 PostgreSQL 16 的角色边界冲突。超级用户及 BYPASSRLS 角色始终绕过行安全；FORCE RLS 约束表所有者，但不能约束超级用户。仓库 <code>tests/README.md<\/code> 与 <code>packages/Qian.Data/AGENTS.md<\/code> 已规定使用受限应用角色验证 RLS。<\/p>\n<p>另有会话名漂移：PRD 旧例写 <code>app.tenant_id<\/code>，组件规格旧例写 <code>qian.tenant_id<\/code>；已发布 Kun 2026.10.9 的双拦截器及既有 Qian 数据测试实际使用 <code>app.current_tenant_id<\/code>，租户标识为字符串。<\/p>\n<p>已批准裁决：管理员连接仅建表和造数；RLS 正向验收通过 NOSUPERUSER / NOBYPASSRLS 的应用角色直接执行原生 SQL，验证跨租户读不可见与 WITH CHECK 拒绝写；增加超级用户可以绕过的对照，在线应用拒用超级用户或 BYPASSRLS 角色。SQL 策略与文档统一到现有 Kun 会话契约，不额外引入第二个租户会话变量。<\/p>\n<p>依据：[PostgreSQL 16 行安全文档](https://www.postgresql.org/docs/16/ddl-rowsecurity.html)、<code>tests/Qian.Testing.Containers/PostgresFixture.cs<\/code>、<code>tests/Qian.Data.Tests/DataSafetyTests.cs<\/code> 与 Kun <code>TenantRlsConnectionInterceptor<\/code> / <code>TenantRlsTransactionInterceptor<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人确认按受限应用角色验收，并保留超级用户绕过的对照<\/li>\n<li class='chk done'><span class='box'>✓<\/span>DATA-001、PRD、ADR/规格和实现统一既有租户会话名，禁止混用第二变量<\/li>\n<li class='chk done'><span class='box'>✓<\/span>PostgreSQL 16 真库验证角色属性、FORCE RLS、WITH CHECK 与缺租户时拒绝访问<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-11 cody：创建任务，已有装配和编译门禁准备继续推进；涉及验收口径的修改等待确认。<\/li>\n<li>2026-10-11 someone：已在本机真实PostgreSQL16容器补充对照：同一FORCE RLS表，超级用户设租户a仍读到2行；受限应用角色无租户0行、租户a读1行，向b写入报42501。Qian.Data.Tests 6项通过且无跳过，支持建议的角色边界。<\/li>\n<li>2026-10-11 someone：产品负责人已批准推荐方案：受限应用角色验证RLS，管理员仅建表造数，保留超管绕过对照并拒绝在线高权限角色，统一app.current_tenant_id。待DATA-001串行恢复时同步规范并完成真库验收。<\/li>\n<li>2026-10-11 cody：已按批准同步DATA验收、PRD安全/质量章节、ADR-004与组件规格，统一app.current_tenant_id；应用角色拦截器覆盖同步/异步开连接及预打开连接，真库12项已通过。补充管理员SET ROLE受限角色的对照后回验，完整DATA其余功能保持未完成。<\/li>\n<li>2026-10-11 cody：裁决及新增高权限角色拒绝已完成本地真实验收，随DATA草稿PR #44待合并；全仓266项测试无跳过，13项数据测试含超管降权对照。<\/li>\n<li>2026-10-12 cody：批准的受限应用角色边界与 app.current_tenant_id 已落实到实现、规范和真实 PostgreSQL/HTTP 验收，随 DATA 本体 PR #44 交付。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-017.md"},{"id":"S1-DEC-018","title":"DATA-001 本体与 SDK/代码安装集成的分阶段验收","status":"done","stage":"S1","area":"DEC","areaName":"待拍板决策","wave":0,"priority":"P0","type":"decision","owner":"cody","estimate":"1d","days":1.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"pm/tasks/S1-DATA-001.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DATA-001.md"},{"path":"pm/tasks/S1-RT-004.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-RT-004.md"},{"path":"pm/tasks/S1-RT-014.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-RT-014.md"},{"path":"pm/tasks/S1-RT-011.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-RT-011.md"}],"updated":"2026-10-12","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>数据本体的五项验收已有真实证据；组件代码字段必须由 SDK 源生成，但 RT-014 依赖 RT-004，而 RT-004 又依赖 DATA-001，形成验收循环。完整代码包安装由 RT-011 负责，其开发中的 CLI 尚未通过真实命名组件、私有发布与平台权限等全部门禁。产品负责人已批准本体与集成分阶段验收，保留后续必过门，不以配置骨架代替完整安装。<\/p>\n<h4>已准备的可审阅结果<\/h4>\n<ul>\n<li>[Qian PR #44](https://github.com/idadawn/qian/pull/44)：安全装配、自动新表 RLS、受限角色检查、数据服务、同上下文 Outbox、软删审计、连接引用选择与独立库使用均已有实现和真实测试。<\/li>\n<li>samples/Qian.Sample.Crm 是实际 Kestrel 宿主，使用真实签名令牌和 Kun 认证/权限端口。PostgreSQL 中 A/B 各 1000 行；A 的全部分页只返回 A，B 读取 A 记录为 404，伪造令牌/租户头/错误调用方被拒绝。<\/li>\n<li>测试抓取 HTTP 列表的实际 SQL 与参数执行 EXPLAIN ANALYZE，确认命中 ix_customers_tenant_id_id；没有关闭顺序扫描或扩大数据集。实际计划随 CI 测试结果上传。<\/li>\n<li>同步 CFG-002 / Kun 2026.10.12 后，本地全仓构建零警告、16 包依赖检查、38 项门禁及 358 项测试通过，零跳过；[远程 CI](https://github.com/idadawn/qian/actions/runs/38176785648) 的 358 项结果和真实索引计划已复核。<\/li>\n<\/ul>\n<h4>已批准的分期<\/h4>\n<p>1. 第一阶段：在本 PR 远程 CI 全绿后合并已完成的数据本体，DATA-001 标为本体验收完成，解除 Registry 的实现前置。<\/p>\n<p>2. 第二阶段：由 RT-014 补代码字段源生成、SDK 默认装配和包族私有 NuGet 锁步发布；由 RT-011 补 qian add 代码包真实安装。两者仍是完整组件交付的必过门，后续任务必须回验本组件。<\/p>\n<p>3. 第二阶段未通过前，保留 plugins/qian.data 的骨架标记，不宣称正式组件安装或私有 NuGet 发布已经完成。QA-002 总目标继续保持未完成，按必要依赖推进。<\/p>\n<p>产品负责人于 2026-10-12 明确选择「分阶段验收，保留后续安装门」，第一阶段在本 PR 最终 CI 全绿后交付；第二阶段的未完成项已经回写 RT-014 / RT-011，不因 DATA-001 关闭而豁免。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>产品负责人确认分阶段验收与上述后续必过门<\/li>\n<li class='chk done'><span class='box'>✓<\/span>DATA-001 与 RT-014 / RT-011 回链，完整组件安装状态不被提前标为已完成<\/li>\n<li class='chk done'><span class='box'>✓<\/span>DATA 本体的远程 CI 与真实数据库/HTTP/索引证据通过后才合并<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-12 cody：创建任务<\/li>\n<li>2026-10-12 cody：产品负责人明确批准分阶段验收并保留后续安装门；已回写 DATA-001、RT-014/011、PRD 和组件文档。DATA 本体按已核验的真实证据与最终 CI 门禁合并；不撤骨架标记，不关闭 QA-002。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEC-018.md"},{"id":"S1-DEP-001","title":"K3s 基线治理：命名空间、专属库、默认拒绝、配额","status":"done","stage":"S1","area":"DEP","areaName":"部署物料","wave":1,"priority":"P0","type":"infra","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-017-deployment.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-017-deployment.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"},{"path":"deploy/baseline/README.md","url":"https://github.com/idadawn/qian/blob/main/deploy/baseline/README.md"},{"path":"pm/tasks/S1-DEC-016.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEC-016.md"}],"updated":"2026-10-11","acceptance":{"done":4,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>S1-M1 K3s 基线：<code>qian-staging<\/code> / <code>qian-prod<\/code> 命名空间；每环境专属 PostgreSQL 16（<code>qian<\/code> 库、schema-per-service、RLS 开启）与 Redis 7（不复用跨 ns 共享实例）；default-deny NetworkPolicy + 按 <code>permissions.egress<\/code> 白名单放行（平台自有出网点 SSRF 基线，R10）；ResourceQuota / LimitRange / PDB 模板；K3s <code>--secrets-encryption<\/code>；Traefik <code>forwardedHeaders.trustedIPs<\/code>；生产独立节点池（Q16）；Harbor 新增「插件包 OCI artifact」制品类型。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>E2E：在 <code>qian-staging<\/code> 内启动一个未声明 egress 的 Pod，访问外网与其他 ns 被 NetworkPolicy 拒绝；明确标识的已授权诊断工作负载能经真实协议/认证访问本环境 PG / Redis（基线阶段，不冒充平台应用）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>检查：<code>qian-staging<\/code> / <code>qian-prod<\/code> 使用独立命名空间、专属 PG / Redis 与独立数据卷；生产独立节点池实际就绪<\/li>\n<li class='chk done'><span class='box'>✓<\/span>检查：<code>qian-staging<\/code> 命名空间存在 ResourceQuota 与 LimitRange；无 <code>:latest<\/code> 镜像<\/li>\n<li class='chk done'><span class='box'>✓<\/span>检查：Traefik <code>trustedIPs<\/code> 已配置，OIDC issuer 为 https；K3s secrets-encryption 开启<\/li>\n<\/ul>\n<p>真实 <code>qian-platform<\/code> 访问 PG / Redis / RabbitMQ / Apollo 的协议联调按已批准的 DEC-016 留在 S1-DEP-005 发布必过项；本任务完成不代表应用已经完成该联调。<\/p>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-11 cody：开始：只读核对真实 K3s 与部署仓库，准备独立命名空间、网络隔离、专属数据服务和验收物料；集群级与生产变更需具体审核后执行。<\/li>\n<li>2026-10-11 cody：部署仓 PR #88 提供两环境独立数据服务、default-deny、配额/PDB/节点池约束、引导与验收脚本；离线门禁和真实本机固定镜像验证通过。现场 qd API 未就绪、K3s activating/start（550→551 次重启），未作集群变更。等待现网恢复、具体变更准入与 DEC-016 验收顺序裁决，实际三项验收保持未完成。<\/li>\n<li>2026-10-11 cody：已批准 DEC-016，解除验收顺序阻塞，继续真实基线核验。最新只读检查 API readyz 成功、三节点 Ready；仅有 qian-tools，没有 qian-staging/prod，尚无生产专用节点池标签；K3s 加密已开启，待具体准入与部署验收。<\/li>\n<li>2026-10-11 cody：DEC-016 已批准且 API 已恢复；实际容量仍阻塞：qd 仅余 55m CPU，worker01 仅余约 372Mi 内存，worker02 仅余445m/498Mi且数据盘不足20Gi，没有节点可放置现有500m/512Mi/20Gi的PG。等待staging资源安排及生产独立节点池；未降低请求、迁移其他服务或执行集群变更。<\/li>\n<li>2026-10-11 cody：用户已明确要求现有集群内划 Qian 专用节点。已新增 pve01 VM106/qian-prod01（2vCPU/4Gi、独立100Gi数据盘），加入原K3s，仅agent；专用标签/taint/LB排除、UUID挂载与重启自动恢复已实测。继续验收生产基线，staging容量仍未解除。<\/li>\n<li>2026-10-11 cody：生产专用节点与qian-prod真实基线已完成：部署仓#89/#90合并，PG/Redis认证/RLS、PVC落点、外网与跨namespace默认拒绝均通过；staging的namespace/配额/网络策略和真实网络对照也通过，但PG/Redis未部署。当前剩余为staging容量：已准备VM101内存8→9Gi、磁盘60→100Gi的维护提案，涉及既有业务节点重启，待批准与前置检查；未修改VM101。<\/li>\n<li>2026-10-11 someone：用户已明确批准按PR #39维护方案扩容并重启VM101；开始复核、备份、DNS与入口保障及staging真实验收。<\/li>\n<li>2026-10-11 someone：已批准维护完成：VM101扩容与受控重启，原27个工作负载和原卷恢复。部署仓PR #91合并；staging完整验收cefbdf7eac94与prod复测492f888bfdac通过，协议认证/RLS/网络拒绝、配额/镜像/入口/加密/生产专用池均有现场证据，测试资源已清理。真实四依赖平台联调继续保留DEP-005。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEP-001.md"},{"id":"S1-DEP-002","title":"L1 组件上 K3s：RabbitMQ、Apollo + MySQL、OIDC","status":"todo","stage":"S1","area":"DEP","areaName":"部署物料","wave":1,"priority":"P0","type":"infra","owner":"","estimate":"5d","days":5.0,"depends":["S1-DEP-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-007-config-center-apollo.md","url":"https://github.com/idadawn/qian/blob/ma .md"}],"updated":"2026-10-11","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>R31：<code>platform<\/code> → <code>qian-platform<\/code>（JIT，含 <code>shell<\/code> 与 <code>model-gateway<\/code> 组合包）、<code>identity<\/code> → <code>qian-identity<\/code>（JIT）、<code>gateway<\/code> → <code>qian-gateway<\/code>（AOT distroless）、可选 <code>model-gateway<\/code> → <code>qian-model-gateway-adapter<\/code>（P1）；<code>standalone<\/code> / <code>minimal<\/code> 不出镜像；多阶段构建、非 root、只读根文件系统；SBOM（Syft）+ 漏洞扫描（Grype / Trivy）+ Cosign；profile 文件与 <code>qian.patch.yml<\/code> 随镜像发布，环境级 <code>--patch<\/code> overlay 由 ConfigMap 挂载。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>检查：三个 profile 镜像按 digest 引用、带 Cosign 签名与 SBOM；<code>gateway<\/code> 镜像为 AOT distroless<\/li>\n<li class='chk'><span class='box'><\/span>检查：每个 profile 镜像内 <code>qian --dump-config<\/code> 的输出与 git 中对应 profile + 组合包 + patch 的合成结果一致（配置漂移门禁）<\/li>\n<li class='chk'><span class='box'><\/span>检查：镜像以非 root 运行、根文件系统只读；<code>shell<\/code> 静态制品随 <code>platform<\/code> 镜像发布并经 <code>gateway<\/code> 提供<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>\n<ul>\n<li>2026-10-11 cody：按用户批准的 DEC-016，DEP-001 保留为真实基础设施前置；本任务产出须参与 DEP-005 的真实平台四依赖联调发布门，不能以基线探针替代。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEP-003.md"},{"id":"S1-DEP-004","title":"qian pack Kustomize 片段生成器与迁移 Job","status":"todo","stage":"S1","area":"DEP","areaName":"部署物料","wave":2,"priority":"P0","type":"infra","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-013","S1-DEP-003"],"blockedBy":["S1-RT-013","S1-DEP-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>从 <code>plugin.json<\/code> 与 profile 生成：Deployment（资源、探针、<code>terminationGracePeriodSeconds ≥ 优雅停机 + 10s<\/code>、<code>automountServiceAccountToken: false<\/code>）、Service、NetworkPolicy（默认拒绝，放行网关 → 服务、服务 → PG / Redis / RabbitMQ / Apollo、<code>permissions.egress<\/code> 经出口代理）、ResourceQuota / LimitRange、PDB、ConfigMap（<code>__APP_CONF__<\/code>、Apollo 引导项）、Secret 模板（只键名）、迁移 Job；Kustomize 只注入 Apollo 引导项。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：参考应用 <code>plugin.json<\/code> 生成的片段含 Deployment / Service / NetworkPolicy / PDB / ConfigMap / Secret 模板 / 迁移 Job，<code>kustomize build<\/code> 通过<\/li>\n<li class='chk'><span class='box'><\/span>E2E：生成的 NetworkPolicy 使未声明 egress 的组件访问外网被拒，声明的域名经出口代理放行<\/li>\n<li class='chk'><span class='box'><\/span>检查：Secret 模板只含键名；ConfigMap 只含 Apollo 引导项与 <code>__APP_CONF__<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-DEP-004.md"},{"id":"S1-DEP-005","title":"发布链与 Argo app-of-apps（迁移先行、digest 写回）","status":"todo","stage":"S1","area":"DEP","areaName":"部署物料","wave":2,"priority":"P0","type":"infra","owner":"","estimate":"3d","days":3.0,"depends":["S1-DEP-004","S1-DATA-002","S1-DEP-002"],"blockedBy":["S1-DEP-004","S1-DATA-002","S1-DEP-002"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-017-deployment.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-017-deployment.md"},{"path":"pm/tasks/S1-DEC-016.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEC-016.md"}],"updated":"2026-10-11","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>不可变发布事件（40 位 SHA、CalVer、<code>dry_run<\/code>）→ 验签 → 固定检出 → 构建推送 → 迁移 Job 先行（<code>--migrate-only<\/code>，advisory lock）→ <code>kustomize edit set image<\/code> 按 digest 写回 → Argo 收敛 → smoke（<code>/readyz<\/code> + 参考应用登录）；Argo Application <code>qian-platform<\/code>（L2）、<code>qian-integrations<\/code>（租户接线）；<code>prune: false<\/code> 起步；<code>Qian.Runtime<\/code> 与 profile 随 CalVer 发布。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：从一次发布事件到 staging 三个 profile 镜像全部 <code>Ready<\/code>、外壳经 <code>gateway<\/code> 可访问、参考应用可登录，中间无人工步骤<\/li>\n<li class='chk'><span class='box'><\/span>E2E：真实 <code>qian-platform<\/code> 在 staging 经实际协议与认证访问本环境 PG / Redis / RabbitMQ / Apollo，精确网络放行与应用就绪状态一致；记录工作负载镜像 digest、环境端点和脱敏结果。这是发布必过门，不能以诊断 Pod、同名标签、共享服务或仅 TCP 连通代替（DEC-016）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：kill <code>qian-platform<\/code> 一个副本，<code>/readyz<\/code> 摘流、无 5xx 泄漏到网关；滚动升级时迁移 Job 先完成再切镜像<\/li>\n<li class='chk'><span class='box'><\/span>检查：Argo <code>qian-platform<\/code>、<code>qian-integrations<\/code> Application 存在且按 digest 引用<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-11 cody：按用户批准的 DEC-016 承接真实平台四依赖联调必过项，显式增加 DEP-002 前置；DEP-003 经 DEP-004 传递依赖，基线阶段完成不能跳过应用联调。<\/li>\n<\/ul>","file":"pm/tasks/S1-DEP-005.md"},{"id":"S1-DEP-006","title":"OTel Collector 接 LGTM 与 Alertmanager 告警","status":"todo","stage":"S1","area":"DEP","areaName":"部署物料","wave":4,"priority":"P1","type":"infra","owner":"","estimate":"2d","days":2.0,"depends":["S1-AUD-003","S1-DEP-001"],"blockedBy":["S1-AUD-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.11.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>OTel Collector → 现网 LGTM（Prometheus / Grafana / Loki / Tempo）；Alertmanager 部署与 5 条基础告警（源文档 P2，ROADMAP 列 P1）；Grafana 仪表盘 JSON 由 S1-AUD-004 提供。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：外壳 → 网关 → platform → RabbitMQ nt-model-v2.md"},{"path":"docs/prd/specs/component-model.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-013-frontend-yue.md#D13.18","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>「介绍组件如何使用」是文档站的主体。按 ADR-020 D20.9，每个组件的文档源在它自己的文件夹里（<code>README.md<\/code> 含「模型体验」「已知限制」两节，<code>docs/*.mdx<\/code> 为使用指南），文档站在构建前汇总；yue 组件要能在 MDX 里活演示并自动出 API 表；.NET 包与 TypeScript 包的 API 参考由工具生成，不手写。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>收集脚本把各组件 <code>README.md<\/code> 与 <code>docs/*.mdx<\/code> 按 docs-site.md §3 的九节模板汇总进 <code>website/docs/components/<\/code>，保留组件 id、版本、所属 profile 等元数据到 frontmatter；缺「模型体验」或「已知限制」节的组件使构建失败（与 S1-QA-006 的 README 契约门禁同一规则）<\/li>\n<li class='chk'><span class='box'><\/span><code>@rspress/plugin-preview<\/code> 与 <code>@rspress/plugin-playground<\/code> 接入：yue 组件在 MDX 代码块内活渲染并可编辑；<code>@rspress/plugin-api-docgen<\/code> 为 <code>@yue/core<\/code> 全部组件生成 props 表<\/li>\n<li class='chk'><span class='box'><\/span><code>@rspress/plugin-typedoc<\/code> 生成 <code>@qian/runtime<\/code>、<code>@qian/plugin-sdk<\/code>、<code>@yue/sdk<\/code> 的 API 文档并挂在站点 <code>/sdk/api/frontend/<\/code>；DocFX 从 XML 注释生成 <code>Qian.*<\/code> .NET 包 API 参考并挂在 <code>/sdk/api/dotnet/<\/code>（复用 <code>website/scripts/build-kun-api.ts<\/code> 的流水线）；平台 OpenAPI 用 Scalar 渲染在 <code>/sdk/api/http/<\/code>；API 页不进侧栏、不渲染侧栏（R54、R56），并在 <code>/sdk/api/<\/code> 落地页更新状态<\/li>\n<li class='chk'><span class='box'><\/span><code>qian docs generate<\/code>（S1-RT-010）输出的配置目录、模块图、事件生产 / 消费图进入站点并随 CI 更新<\/li>\n<li class='chk'><span class='box'><\/span>UT：收集脚本对缺节、重复 id、断链三类错误各有一个失败用例<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-07 claude：创建任务<\/li>\n<li>2026-10-07 claude：信
