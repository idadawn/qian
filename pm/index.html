adawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>IIdentityConnector { Descriptor; BeginChallengeAsync; HandleCallbackAsync; ExchangeImplicitAsync }<\/code> 与 <code>connector.manifest<\/code>（协议、终端、配置 Schema、密钥只填 secretRef、回调模板），连接器以 <code>provides[]<\/code> + <code>policy.egress<\/code> 声明（R31）、只依赖 <code>Qian.Identity.Abstractions<\/code>；<code>/connect/callback/{connectorId}<\/code> 由本体统一校验 state / nonce；绑定流程（未绑定 → 引导登录并显式确认）归本体；首批 <code>qian.identity.connector.oidc<\/code>（企业 IdP / Authentik 作上游）；假连接器 TCK fixture。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：以 Authentik（运维侧）为上游，经通用 OIDC 连接器登录 Qian；首次登录进入「确认绑定」页，确认后 <code>ExternalIdentity<\/code> 建立，同租户内重复绑定被拒<\/li>\n<li class='chk'><span class='box'><\/span>TCK：用一个假连接器实现 SPI，连接器清单校验、state 篡改拒绝、回调幂等三项通过<\/li>\n<li class='chk'><span class='box'><\/span>CI：<code>Qian.Identity.Connector.Oidc<\/code> 不依赖 <code>Qian.Identity.Server<\/code> 实现包<\/li>\n<li class='chk'><span class='box'><\/span>UT：连接器凭据只接受 secretRef，详情接口不回传密钥<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-007.md"},{"id":"S1-IDP-008","title":"企业微信连接器（扫码 + 工作台免登）","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":4,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-007","S1-RT-004"],"blockedBy":["S1-IDP-007","S1-RT-004"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>补充裁决 S1 必做、迁移顺序第 4 chema 契约文件入 <code>contracts/<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：每个目录查询带 description 与示例（Agent 契约）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-010.md"},{"id":"S1-KUN-001","title":"Kun 多租户后台链路修复：BeginScope、回灌、RLS 强制","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-001-kun-relationship.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-001-kun-relationship.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"packages/Qian.Data/README.md","url":"https://github.com/idadawn/qian/blob/main/packages/Qian.Data/README.md"}],"updated":"2026-10-08","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 1 项：<code>ITenantContext.BeginScope<\/code>、<code>MessageContext.TenantId<\/code> 从信封读取并在订阅器回灌、Saga 执行器按租户开作用域、<code>AddKunTenantRls<\/code> 自动挂双拦截器并强制模型缓存键工厂、<code>DefaultTenantResolver<\/code> 增加 <code>Production<\/code> 模式、两套 <code>ITenantContext<\/code> 收敛为 <code>AsyncLocalTenantContext<\/code>、claim 统一 <code>tenant_id<\/code>。第 1 波可信计算基的前提；上游 PR 优先，超 1 个迭代转 <code>Kun.MultiTenancy.Patches<\/code> 补丁包。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：租户 A 发出的集成事件，在消费端 handler 内 <code>ITenantContext.TenantId == A<\/code>，且 handler 内 EF 查询自动带 <code>tenant_id = A<\/code> 过滤（Testcontainers PG + RabbitMQ）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：生产模式下带 <code>X-Tenant-Id<\/code> 头但无合法令牌的请求返回 401，不落到 <code>default<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：同时注册 <code>AddKunMultiTenancy<\/code> >IOutboxMessageStore<\/code> EF 默认实现、Outbox 锁默认开、publisher confirm。S1 第一周先用最小集成测试实证「领域事件→集成事件路径丢消息」再定上游修复或 Qian 侧规定。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT（第一周实证）：Catalog 建商品后断言 <code>outbox_messages<\/code> 行数，确认当前路径是否丢消息并记录结论<\/li>\n<li class='chk'><span class='box'><\/span>IT：命令 handler 内经通知 handler 发出的集成事件，提交后 <code>outbox_messages<\/code> 行数 +1<\/li>\n<li class='chk'><span class='box'><\/span>IT：消费端 handler 第一次抛异常、第二次成功，事件最终恰被处理一次且 <code>processed_messages<\/code> 只有一行；RabbitMQ 容器重启后未 ack 消息重投不丢<\/li>\n<li class='chk'><span class='box'><\/span>IT：两个发布器副本同时轮询同一 Outbox 表，每条消息只发布一次（publisher confirm 计数）<\/li>\n<li class='chk'><span class='box'><\/span>UT：被 Skip 的 at-least-once 集成测试恢复为必跑并通过<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-002.md"},{"id":"S1-KUN-003","title":"Kun 网关加固与 gRPC 流式拦截器修复","status":"todo","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-010-gateway-layers.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-010-gateway-layers.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 4、5 项：回退认证策略默认「要求已认证」、路由级限流真正绑定、可信代理网段、JWKS 双钥热轮换、网关宿主 <code>AddKunObservability<\/code>、<code>/healthz<\/code> <code>/readyz<\/code>、<code>client_credentials<\/code> 签发端点；Tracing / Auth / Result 三个 gRPC 拦截器补齐 server / client / duplex streaming。7.9 网关装配的前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：未带令牌请求任一业务路由返回 401（除显式匿名白名单）<\/li>\n<li class='chk'><span class='box'><\/span>IT：对限流路由超阈值返回 429 且响应头 新增一个模型后 <code>models:sync<\/code> 使其出现在目录；下线后健康状态变更<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>models:sync<\/code> 标 <code>external<\/code> + <code>confirm<\/code>，目录查询 <code>read<\/code>；供应商密钥只以 secretRef 出现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-MGW-001.md"},{"id":"S1-MGW-002","title":"Higress 控制面接线：上游入 git、租户 consumer、计量","status":"todo","stage":"S1","area":"MGW","areaName":"模型网关","wave":4,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-MGW-001","S1-AUD-004","S1-DEP-005"],"blockedBy":["S1-MGW-001","S1-AUD-004","S1-DEP-005"],"order":7,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.16","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-015-model-gateway.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-015-model-gateway.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>把 GPUStack 注册为 Higress 上游（<code>ai-proxy<\/code> 供应商与逻辑模型名映射入 git，经部署仓库 PR）；为 Qian 租户生成 Higress consumer（key-auth）并由服务端生成 <code>x-qian-consumer<\/code> 作限流桶键；从响应回流 usage 落 7.11.2 计量事件（<code>unit = token<\/code>）；<code>ai-token-ratelimit<\/code>；租户应用经 OpenAI 兼容面 <code>/v1/chat/completions<\/code>、<code>/v1/embeddings<\/code> 调用；坏配置 fail-open 到产品默认路由；不自写模型代理、SSO/S2S 不经 Higress。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：租户 A 的应用经 OpenAI 兼容面完成一次 chat 与一次 embedding 调用，<code>meter_events<\/code> 出现 <code>unit = token<\/code> 记录且带 <code>tenant_id<\/code>；超过 <code>ai-token-ratelimit<\/code> 阈值返回 429<\/li>\n<li class='chk'><span class='box'><\/span>E2E：模型下线后 Higress 路由摘除；经逻辑名调用落到替代模型或返回结构化错误<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：Higress 配置变更全部经部署仓库 PR 合入，adapter 不持有线上直改权限<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-MGW-002.md"},{"id":"S1-NTF-001","title":"通知内核 Qian.Notify：消息类型、模板、配置与 INotifier","status":"todo","stage":"S1","area":"NTF","areaName":"消息通知","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-004","S1-TEN-001","S1-IDP-009","S1-CFG-002","S1-AUD-001"],"blockedBy":["S1-RT-004","S1-TEN-001","S1-IDP-009","S1-CFG-002","S1-AUD-001"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.12","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.notify<\/code>（<code>Qian.Notify.Abstractions<\/code> / <code>ctx.Notify<\/code> + <code>Qian.Notify<\/code>）：消息类型由清单 <code>contributes: qian.notify.message-type/v1<\/code> 注册（编码、参数 Schema、模板变量、落地深链）；<code>message_types<\/code> / <code>notify_templates<\/code>（每模板一渠道、<code>{@字段}<\/code>）/ <code>send_configs<\/code> / <code>send_config_templates<\/code> / <code>receive_configs<\/code>（admin 默认 / 锁定）/ <code>channel_accounts<\/code>（配置 + <code>secretRef<\/code>）；<code>INotifier.SendAsync(configCode, recipients, params, idempotencyKey)<\/code>；<code>INotificationChannel<\/code> typed port；判定链（场景未开启不生成 → 接收配置过滤 → 模板必须启用 → 被引用模板不可删）；<code>GET /api/notify/send-configs<\/code>、<code>POST /send-configs/{code}:validate<\/code>、<code>POST /api/notify/send<\/code>；收件人寻址经 7.4.3 目录。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：同一 <code>idempotencyKey<\/code> 的两次 <code>send<\/code> 只产生一次投递<\/li>\n<li class='chk'><span class='box'><\/span>IT：删除被发送配置引用的模板返回结构化错误；渠道账号详情接口不含明文密钥<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/notify/send-configs<\/code> 返回每个配置的参数 JSON Schema；<code>:validate<\/code> 对缺参返回带 JSON Pointer 的错误<\/li>\n<li class='chk'><span class='box'><\/span>UT：收件人在接收配置里关闭某渠道时该渠道记录被跳过；全部过滤则不生成监控<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-NTF-001.md"},{"id":"S1-NTF-002","title":"异步投递、监控与收件人记录、按收件人定向重试","status":"todo","stage":"S1","area":"NTF","areaName":"消息通知","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-NTF-001","S1-EVT-001","S1-SCH-001"],"blockedBy":["S1-NTF-001","S1-EVT-001","S1-SCH-001"],"order":7,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.12","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>真正异步投递（队列 + <code>sending<\/code> 态）；<code>notify_monitors<\/code>（<code>sending | succeeded | failed | partial<\/code>、重试载荷）与 <code>notify_records<\/code>（每收件人：状态、尝试次数、最后错误）；失败按收件人定向重试（默认 3 次，1–5，经 7.13 延时）；<code>GET /api/notify/monitors<\/code>、<code>POST /monitors/{id}:retry<\/code> 只重发失败收件人；事件 <code>notify.sent / notify.failed / notify.read.v1<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：调用 <code>notify.send<\/code> 给 3 个收件人（其中 1 人关闭了邮件渠道），生成 1 条监控、2 条邮件记录 + 3 条站内信记录；监控先为 <code>sending<\/code> 再终态<\/li>\n<li class='chk'><span class='box'><\/span>IT：SMTP 账号故障时 2 条邮件记录失败，监控 <code>partial<\/code>；修复后 <code>retry<\/code> 只重发这 2 人，不重复发站内信<\/li>\n<li class='chk'><span class='box'><\/span>IT：重试达到上限后记录终态 <code>failed<\/code> 并发 <code>notify.failed.v1<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-NTF-002.md"},{"id":"S1-NTF-003","title":"渠道组件 inbox / smtp / sms 与系统预置模板","status":"todo","stage":"S1","area":"NTF","areaName":"消息通知","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-NTF-001","S1-CFG-002","S1-RT-002"],"blockedBy":["S1-NTF-001","S1-CFG-002","S1-RT-002"],"order":7,"readyNow":false,"refs R-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"}],"updated":"2026-10-08","acceptance":{"done":7,"total":7},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.1–D20.5 的 .NET 落地：按规格 §5.2 实现 <code>IQianPlugin { Inject; ApplyAsync }<\/code>、<code>IPluginContext<\/code>（<code>Inject / TryInject / WhenReadyAsync / Provide / On / DispatchAsync / Effect / Scoped / Restrict / List<\/code>）、按 <code>inject[]<\/code> / <code>provides[]<\/code> 拓扑排序的装载器、可逆副作用逆序撤销、scope 两层扁平（<code>tenant:<\/code> / <code>app:<\/code> / <code>agent-session:<\/code>）与遮蔽 / <code>restrict<\/code> 交集。组件库唯一必需依赖，一切组件任务的前置，第 1 波首项。仅实现 .NET 侧；语言无关场景位于 <code>tck/runtime/<\/code>，TS harness 与完整套件由 S1-RT-003 / S1-QA-002 接续。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>TCK：<code>Inject<\/code> 的服务键无人提供 → 启动失败并指出缺失键与请求方；依赖成环 → 结构化错误列出环路<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：<code>Apply<\/code> 中注册的全部 effect 在卸载时按逆序撤销，卸载后服务容器中无残留<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：五种分发模式各一组用例——<code>waterfall<\/code> 监听器不调用 <code>next()<\/code> 时下游不执行；<code>bail<\/code> 停在首个返回值；<code>parallel<\/code> 任一失败不影响其余<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：租户 A scope 注册同名服务后，A 内解析到遮蔽项，B 与全局不受影响；两条 restriction 的交集生效；被过滤项在目录与执行两处都「不存在」<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>Qian.Runtime<\/code> 只依赖 <code>Kun.Core<\/code>、<code>Kun.Mediator<\/code>、.NET DI 与已有的 <code>Qian.Runtime.Errors<\/code>，无业务语义；不引用 <code>Kun.Validation<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span><code>Kun.*<\/code> 的 PackageVersion 一律引用 <code>$(KunVersion)<\/code>（属性若尚不存在则在本任务加入），<code>NuGet.config<\/code> 用 packageSourceMapping 把 <code>Kun.*<\/code> 映射到 nuget.org；Kun 正式版从 nuget.org 还原，只有需要 Kun 预发布版时才加 GitHub Packages 源（ADR-021 D21.3）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>Kun <code>Error<\/code> → <code>QianError<\/code> 放在 <code>Qian.Runtime<\/code>，<code>ValidationException.Errors<\/code> → <code>errors[]<\/code> 放在 <code>Qian.Runtime.Errors.AspNetCore<\/code>（只有它引用 <code>Kun.Validation<\/code>）；保持 ErrorDetail 封闭，按平台内置码映射（contracts/v0/README.md §3.7 / R48），上游 KunExceptionHandler 修正由 S1-KUN-006 负责<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：验收补一条 <code>KunVersion<\/code> 单点钉版（ADR-021 D21.3）<\/li>\n<li>2026-10-08 claude：验收补一条 Kun 错误桥接（随首个引用 Kun.* 包的任务，contracts/v0/README.md §3.7）<\/li>\n<li>2026-10-08 someone：开始<\/li>\n<li>2026-10-08 someone：装载器与 Inject 已实现：T01、T02 与缺失键 YAML 场景通过；启动错误使用 qian.runtime 内置码，已按 QIAN_UPDATE_CONTRACTS=1 更新目录。<\/li>\n<li>2026-10-08 someone：Effect 同步/异步逆序撤销、失败回滚、级联卸载与恢复已覆盖；手动撤销可用 WhenIdleAsync 等待异步清理。<\/li>\n<li>2026-10-08 someone：五种分发及其异常/顺序语义已实现：T05–T11 YAML 场景、真实并发、空结果与事件重名测试通过。<\/li>\n<li>2026-10-08 someone：scope 遮蔽、restriction 交集、目录/执行不可区分、无继承、跨 scope 事件与具名 seam 已通过；含依赖重绑定共 29 个运行时测试。<\/li>\n<li>2026-10-08 someone：Kun.Core / Kun.Mediator 2026.9.13 已在 nuget.org 正式发布，ubuntu-latest 无 GitHub Packages 凭据，因此按任务指示改为正式版映射到 nuget.org，仅预发布版才另加 GitHub 源；复用 main 的 KunVersion。两处错误桥接与依赖边界测试通过，全新缓存还原成功。<\/li>\n<li>2026-10-08 someone：本地验收：构建零警告零错误，依赖图通过，19 个门禁自测通过，整套 .NET 219 个测试通过且零跳过（Runtime 41、Errors 157、容器 21）。本机 127.0.0.1 被其它 HTTP 路径拦截，容器测试指定 TESTCONTAINERS_HOST_OVERRIDE=localhost 并设置回环 NO_PROXY 后通过；未改夹具。补充异步 Apply 取消回滚、类型化配置、restriction 异常隔离与 Pending 诊断。<\/li>\n<li>2026-10-08 someone：完成 .NET 最小运行时、19 个语言无关场景、Kun 错误桥接与 nuget.org 包源，七项验收全部通过，提交 PR 评审。<\/li>\n<li>2026-10-08 claude：PR #5 已由产品负责人合并（5788415，2026-10-08 04:16Z）。复核：main 上构建零警告、Runtime 41 + Errors 157 + 容器 21 = 219 测试通过，check_deps / check_docs / pm validate 与门禁自测通过；Contracts.cs 与规格 §5.2 对齐，T01–T14、T21、T22、T24 场景文件就位，Kun.* 钉 $(KunVersion) 且映射 nuget.org。备注：Qian.Runtime.csproj 引用 Kun.Mediator 但源码尚未使用（进程内事件直接分发，跨进程桥接归 qian.events）；Inject(key) 抛 ServiceNotReadyException、Inject(key, name) 抛 QianErrorException，两者都携带 NOT_FOUND。→ done<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-001.md"},{"id":"S1-RT-002","title":"profile / 组合包 / patch 装载器与 dump-config","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.7：条目 <code>{ id, plugin, config, scope? }<\/code>，层叠 profile → 组合包 → profile <code>qian.patch.yml<\/code> → home 级 patch → <code>--patch<\/code> overlay；条目 <code>config<\/code> 按组件 <code>config.schema<\/code> 校验；随发行版交付 <code>platform<\/code> / <code>gateway<\/code> / <code>identity<\/code> / <code>standalone<\/code> / <code>minimal<\/code> 五个 profile 文件与 base / shell / model-gateway 组合包骨架；<code>qian --profile &lt;p&gt; --dump-config<\/code> 标注每条目来源层。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：<code>qian --profile platform --dump-config<\/code> 打印整棵插件树并标注来源层；任取一条条目用 <code>--patch<\/code> 替换其 <code>config<\/code> 后生效，再次 <code>dump-config<\/code> 显示来源为 overlay<\/li>\n<li class='chk'><span class='box'><\/span>TCK：patch 按 <code>id<\/code> 定位并替换整个 <code>config<\/code> 或插入新条目；条目 <code>config<\/code> 不符合组件 <code>config.schema<\/code> 时启动失败并带 JSON Pointer<\/li>\n<li class='chk'><span class='box'><\/span>UT：五个 profile 文件可被装载器解析；<code>standalone<\/code> / <code>minimal<\/code> 不含 <code>qian.registry<\/code> / <code>qian.lifecycle<\/code> / <code>qian.capabilities<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>minimal<\/code> profile 仅装 <code>Qian.Runtime<\/code> 与表面装载器，可作 TCK 基准宿主启动<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-002.md"},{"id":"S1-RT-003","title":"@qian/runtime：TypeScript 同语义运行时（外壳插件树）","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-001","S1-DEC-001"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#5.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.2：yue 外壳也是一棵插件树，TS 侧提供与 .NET 相同的 <code>Inject<\/code> / <code>Apply<\/code> / 五种分发 / <code>ctx.Effect()<\/code> / scope 遮蔽与 <code>restrict<\/code> 语义，由同一组 TCK fixture 固化；是否采用现成库由 S1-DEC-001 决定。第 2 波，7.15.1 外壳与 <code>@qian/plugin-sdk<\/code> 的基础。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：运行时语义套件的同一组 fixture 在 TS 侧全部通过（依赖缺失、成环、逆序撤销、五种分发、scope 遮蔽与 restrict）<\/li>\n<li class='chk'><span class='box'><\/span>UT：scope 化注册——租户 scope 的贡献遮蔽同名全局贡献，供 7.15.1 插槽注册表使用<\/li>\n<li class='chk'><span class='box'><\/span>包 <code>@qian/runtime<\/code> 以 npm 发布到私有 feed，带 <code>.d.ts<\/code> 与 README「模型体验」「已知限制与延期项」节<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-003.md"},{"id":"S1-RT-004","title":"qian.registry 插件：清单校验、注册表与 scope 视图","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-001","S1-RT-002","S1-DATA-001","S1-DEC-002","S1-DEC-010"],"blockedBy":["S1-RT-002","S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/prd/specs/component-model.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-002-plugin-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-002-plugin-model.md"}],"updated":"2026-10-08","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>原 <code>qian.kernel<\/code> 注册表改为平台插件 <code>Qian.Registry<\/code>（<code>ctx.Registry<\/code>）：<code>IPluginManifestLoader<\/code> / <code>PluginManifestValidator<\/code>（JSON Schema 2020-12 + 语义校验，错误带 JSON Pointer）；PG schema <code>registry<\/code> 的 <code>plugin_artifacts<\/code> / <code>plugin_revisions<\/code> / <code>tenant_plugin_installs<\/code> / <code>scope_patches<\/code> / <code>extension_points<\/code> / <code>contracts<\/code> / <code>capabilities<\/code> / <code>event_types<\/code> / <code>entity_types<\/code> / <code>lifecycle_runs<\/code>；租户 scope patch 持久化与合入；<code>GET /api/registry/scopes/{scopeKey}/entries<\/code>；未挂载条目 404 / 403 <code>plugin_not_mounted<\/code> 规则（R32）。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：缺任一 S1 必填字段、OCI 引用用 tag 而非 digest、<code>inputSchema<\/code> 含 <code>tenantId<\/code>、<code>inject[]<\/code> 引用无人提供的服务键、<code>scopes[]<\/code> 含非法种类的 <code>plugin.json<\/code>，安装失败并返回带 JSON Pointer 的结构化错误<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>policy.required: true<\/code> 只允许出现在 <code>policy.tier: system<\/code> 的平台插件上，否则校验失败<\/li>\n<li class='chk'><span class='box'><\/span>IT：对租户 A 写一条 scope patch、B 不写，<code>GET /api/registry/scopes/tenant:B/entries/&lt;id&gt;<\/code> 对持 <code>qian.registry:scope:read<\/code> 者返回 403 <code>plugin_not_mounted<\/code>、<code>reason = not_mounted<\/code>，无该权限者 404<\/li>\n<li class='chk'><span class='box'><\/span>IT：scope patch 变更事件触发装载器重新合入，撤销 patch 后 ≤ 5s 生效，不重启进程<\/li>\n<li class='chk'><span class='box'><\/span>IT：v1 别名 <code>/api/kernel/*<\/code> 返回同一结果并带 <code>Deprecation<\/code> 响应头（R33）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：依赖加 S1-DEC-010：R32 的 403 原因（not_entitled / not_mounted / restricted）在封闭 ErrorDetail 中的承载方式待定（contracts/v0/README.md 第 8 节第 4 条）<\/li>\n<li>2026-10-08 claude：依赖的默认裁决任务改号为 S1-DEC-010（原 S1-DEC-009 与 main 上已关闭的仓库归属拍板撞号）<\/li>\n<li>2026-10-08 claude：S1-DEC-010 已裁决 R48：R32 的 403 原因即错误码（PLUGIN_NOT_ENTITLED / PLUGIN_NOT_MOUNTED / PLUGIN_RESTRICTED / PLUGIN_DEPENDENCY_PENDING，由 Qian.Registry.Abstractions 登记），message 带层级或 restriction id、pointer 指向 patch 条目；该前置已满足<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-004.md"},{"id":"S1-RT-005","title":"qian.lifecycle 插件：两层生命周期、幂等钩子、验签与执行器","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"8d","days":8.0,"depends":["S1-RT-004","S1-CFG-002"],"blockedBy":["S1-RT-004","S1-CFG-002"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.17","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>平台插件 <code>Qian.Lifecycle<\/code>（<code>ctx.Lifecycle<\/code>）：平台级 <code>Install / Activate / Rollback / Deprecate / Retire<\/code>，租户级 <code>Provision / Upgrade / Uninstall / Purge<\/code>，<code>Mount / Unmount<\/code> 写租户 scope patch（取代 <code>Enable / Disable<\/code>）；钩子 <code>idempotencyKey = (tenant, plugin, hook, toVersion)<\/code> 入 <code>lifecycle_runs<\/code>；强制验签（OCI + cosign，声明式包 Ed25519，信任根经 Apollo <code>qian.common.trust<\/code>）；<code>IDeploymentExecutor<\/code> 的 <code>GitOps<\/code> 与 <code>Local<\/code> 两种实现；集成事件 <code>lifecycle.*.v1<\/code> / <code>registry.scope.*.v1<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：参考应用在租户 A、B 分别 <code>Provision<\/code> 并挂载，<code>lifecycle_runs<\/code> 各有一条成功记录；对租户 A 重复执行 <code>Provision<\/code> 不产生副作用（幂等）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：发布参考应用修订 n+1 并激活，租户 A 升级、租户 B 保持 n；对 A 回切到 n 后 A 的请求由修订 n 处理且数据可读（前向兼容）<\/li>\n<li class='chk'><span class='box'><\/span>IT：未签名制品与签名不匹配制品均 <code>Install<\/code> 失败；信任根轮换后旧签名在重叠期内有效<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>Mount(scope, entry)<\/code> 写入 <code>scope_patches<\/code> 并发出 <code>registry.scope.mounted.v1<\/code>；<code>Unmount<\/code> 后 ≤ 5s 三处拦截恢复，不改数据库开关<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>GitOps<\/code> 执行器为 <code>runtime.form: service<\/code> 组件生成 Kustomize 片段并以 K8s 状态 + <code>/health<\/code> 双条件回写注册表（Local 执行器在开发态等价）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-005.md"},{"id":"S1-RT-006","title":"qian.capabilities 插件：能力目录、契约仓库与聚合","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-004","S1-KUN-006","S1-AZ-003"],"blockedBy":["S1-RT-004","S1-KUN-006","S1-AZ-003"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>平台插件 <code>Qian.Capabilities<\/code>（<code>ctx.Capabilities<\/code>）：<code>ICapabilityRegistry<\/code> 收 <code>JsonTypeInfo<\/code> 生成请求 / 响应 Schema；<code>GET /api/capabilities?kind=&amp;q=<\/code> 按权限与 scope restrict 过滤（<code>ttlMs<\/code>、<code>cacheScope: private<\/code>）；<code>GET /api/capabilities/openapi.json<\/code> 聚合 OpenAPI 3.1；<code>IExtensionPointRegistry<\/code> / <code>IContractRepository<\/code>（<code>.proto<\/code> / OpenAPI 契约包带 <code>/vN<\/code>，挂载前契约一致性探测）；菜单由清单贡献 + URN 目录 + 用户偏好（<code>qian.navigation<\/code> 逻辑名）；<code>/api/kernel/capabilities<\/code> 别名。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities<\/code> 对无权限用户不返回其不可调用的能力，对被租户 scope <code>restrict<\/code> 掉的能力同样不返回；响应含 <code>cacheScope: private<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：v1 别名 <code>GET /api/kernel/capabilities<\/code> 返回同一结果并带 <code>Deprecation<\/code> 响应头（R33）<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities/openapi.json<\/code> 需认证并只聚合已挂载组件；挂载一个契约不兼容（OpenAPI diff 破坏性）的组件被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>UT：注册一个命令后目录出现其 ID、JSON Schema 与 Agent 字段（<code>sideEffect / policyHint / requiredScopes / schemaSha256<\/code>）<\/li>\n<li class='chk'><span class='box'><\/span>IT：菜单贡献可按租户 scope 遮蔽；未挂载组件的菜单项不出现（404 语义）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-006.md"},{"id":"S1-RT-007","title":"能力契约预留：可发布元数据、导入导出、Operation、App","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":3,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-RT-006"],"blockedBy":["S1-RT-006"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07 cs/component-model.md#8.4","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/prd/specs/component-model.md#8.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>按 S1-DEC-004 建立同组织独立私有仓库，布局 <code>plugins/&lt;domain&gt;/&lt;id&gt;/<\/code>，S1 收录全部平台插件、参考应用与至少一个 skill-only 示例组件；CI：每个条目过校验器 + <code>qian add<\/code> 到 <code>minimal<\/code> profile 的 smoke；目录网站静态生成（分类、安装命令、README 渲染、校验状态徽章）；GitHub topic <code>qian-plugin<\/code> 社区发现只发现不信任，安装需 <code>--trust<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>CI：官方市场仓库每个条目指向的组件通过五种表面校验器与清单校验零错误；<code>qian add<\/code> 每个条目到 <code>minimal<\/code> profile 的 smoke 全部通过<\/li>\n<li class='chk'><span class='box'><\/span>E2E：目录网站由 marketplace.json 一条命令生成，条目数、分类与仓库一致，每个条目显示校验状态徽章<\/li>\n<li class='chk'><span class='box'><\/span>IT：经 GitHub topic 发现的社区组件标记「未验证」，<code>qian add<\/code> 该组件在无 <code>--trust<\/code> 时拒绝并说明原因<\/li>\n<li class='chk'><span class='box'><\/span>检查：仓库收录全部 <code>platform<\/code> base 组合包平台插件、参考应用与一个 skill-only 示例<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-017.md"},{"id":"S1-SCH-001","title":"qian.scheduler 核心：持久化作业、集群安全领取、Cancel","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-DATA-001","S1-RT-001","S1-TEN-001"],"blockedBy":["S1-DATA-001","S1-TEN-001"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-012-workflow-engine.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-012-workflow-engine.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.scheduler<\/code>（<code>Qian.Scheduler.Abstractions<\/code> / <code>ctx.Scheduler<\/code> + <code>Qian.Scheduler<\/code>）：<code>job_definitions<\/code> / <code>job_triggers<\/code> / <code>job_runs<\/code>；cron 6/7 段、固定间隔、一次性延时；多租户命名空间；每副本每秒 <code>FOR UPDATE SKIP LOCKED<\/code> 领取到期触发器 + 租约；misfire、并发策略与超时；<code>Cancel(businessKey)<\/code>；<code>local<\/code> 任务类型 <code>[QianJob(&quot;code&quot;)]<\/code>；<code>IScheduler.ScheduleOnce / ScheduleCron / Cancel<\/code>。7.3 到期扫描、7.4 密码提醒、7.12 重试、7.11 链校验的公共前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：3 个副本运行、100 个每分钟触发器，每分钟恰 100 次执行无重复（<code>job_runs<\/code> 按 trigger × 分钟唯一）<\/li>\n<li class='chk'><span class='box'><\/span>IT：杀掉正在执行的副本，租约到期后触发器被另一副本接管并按 misfire 策略处理<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>ScheduleOnce(businessKey)<\/code> 后 <code>Cancel(businessKey)<\/code>，到点不执行；重复 <code>ScheduleOnce<\/code> 同一业务键只保留一条<\/li>\n<li class='chk'><span class='box'><\/span>UT：作业定义 Schema 机器可读；目标必须是能力目录中的 URI，任意 URL 被拒<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-001.md"},{"id":"S1-SCH-002","title":"callback 任务类型回调契约、执行日志与 run 事件","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-SCH-001","S1-IDP-002","S1-CFG-002","S1-EVT-001"],"blockedBy":["S1-SCH-001","S1-IDP-002","S1-CFG-002","S1-EVT-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>callback<\/code> 类型：<code>POST {service}/qian-jobs/{code}<\/code> 按 K8s Service 名寻址，头 <code>X-Qian-Run-Id<\/code>、<code>X-Qian-Signature<\/code>（HMAC，密钥 secretRef），S2S <code>aud = service<\/code>（服务身份 <code>client_credentials<\/code>），幂等键 = run id，超时、重试、结果回写 <code>POST /api/scheduler/runs/{id}/result<\/code>；结构化执行日志（状态、耗时、错误分类、业务结果）；API 与最小管理面；事件 <code>scheduler.run.completed / failed.v1<\/code>；<code>qian.scheduler.job-type/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：回调签名错误被对端拒绝；回调超时后按策略重试并最终写 <code>error_class = timeout<\/code>；对端回写业务失败后 <code>job_runs.business_result = failed<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：回调携带的 S2S 令牌 <code>aud<\/code> 为目标服务且 <code>principal_kind = service<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>jobs.create<\/code> 标 <code>write<\/code> + <code>confirm<\/code>，<code>run-now<\/code> 标 <code>write<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-002.md"},{"id":"S1-SCH-003","title":"qian.realtime：WebSocket/SSE、一次性票据与背板","status":"todo","stage":"S1","area":"SCH","areaName":"调度与实时","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-004","S1-GW-001","S1-EVT-001"],"blockedBy":["S1-IDP-004","S1-GW-001","S1-EVT-001"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.13.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.realtime<\/code>（<code>Qian.Realtime.Abstractions<\/code> / <code>ctx.Realtime<\/code> + <code>Qian.Realtime<\/code>，P1，经 <code>gateway<\/code> 透传）：<code>POST /api/realtime/tickets<\/code>（30s 一次性票据）握手鉴权、URL 不接受 <code>access_token<\/code>；Redis Pub/Sub 背板扇出（用户 / 租户 / 全部）；连接表只在 Redis <code>rt:conn:{tenant}:{membership}<\/code>；事件类型目录与 JSON Schema（<code>messagePush<\/code>、<code>unReadMsg<\/code>、<code>online<\/code>、<code>logout<\/code>、<code>identityRevisionChanged<\/code>）作为 <code>@yue/sdk<\/code> 的类型来源；<code>IRealtimePush.PushAsync<\/code>；<code>session_revoked<\/code> → <code>logout<\/code>；无通道时站内信 / 权限刷新降级轮询。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：用户在两个浏览器连接到不同副本，向该用户 <code>Push<\/code> 一次，两个连接各收到一次<\/li>\n<li class='chk'><span class='box'><\/span>IT：票据过期或复用握手失败 401；URL 中不接受 <code>access_token<\/code> 参数<\/li>\n<li class='chk'><span class='box'><\/span>E2E：管理员强制下线后该用户前端 ≤ 3s 收到 <code>logout<\/code> 并跳转登录页<\/li>\n<li class='chk'><span class='box'><\/span>UT：SSE 事件 JSON Schema 为唯一真相源并生成 TS 类型；实例重启后 Redis 连接表自动清理<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-SCH-003.md"},{"id":"S1-TEN-001","title":"租户主档、fail-closed 租户上下文与传播器、tenancy API","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-KUN-001","S1-RT-001","S1-DATA-001"],"blockedBy":["S1-DATA-001"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.tenancy<\/code>（<code>Qian.Tenancy.Abstractions<\/code> / <code>ctx.Tenancy<\/code> + <code>Qian.Tenancy<\/code>）：<code>Tenant<\/code> / <code>TenantAdmin<\/code> 实体（租户号小写字母数字、创建后不可改；隔离策略创建时一次性决定）、<code>ITenantContext<\/code> 唯一实现（AsyncLocal + 中间件，claim <code>tenant_id<\/code>，生产模式禁头兜底与 <code>default<\/code> 回退）、<code>ITenantContextPropagator<\/code>（事件信封、作业参数、gRPC 元数据）、<code>ITenantDirectory.Get(code)<\/code>、<code>GET/POST /api/tenancy/tenants<\/code>、<code>PUT /tenants/{id}<\/code>；独立模式可换宿主 <code>ITenantContext<\/code> 或 <code>SingleTenant<\/code>。第 1 波可信计算基。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：生产模式下无令牌、仅带 <code>X-Tenant-Id<\/code> 的请求与无 <code>tenant_id<\/code> 的消息都被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：运营后台创建租户 A、B（共享库 + RLS），各自管理员登录后只看到本租户数据；以 A 的令牌直接请求 B 的记录 id 返回 404<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>ITenantContextPropagator<\/code> 写入的 <code>tenant_id<\/code> 在消费端、作业执行器、gRPC 对端 <code>BeginScope<\/code> 后可读<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>inputSchema<\/code> 中不出现 <code>tenantId<\/code>；运营接口的目标租户是资源路径<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-001.md"},{"id":"S1-TEN-002","title":"租户状态机、tenant.*.v1 事件、到期扫描与会话吊销联动","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-EVT-001","S1-SCH-001","S1-IDP-004"],"blockedBy":["S1-TEN-001","S1-EVT-001","S1-SCH-001","S1-IDP-004"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>S1 实现 <strong>待激活 → 试用 | 正常 → 宽限 → 冻结 / 恢复<\/strong> 迁移，每次迁移发 <code>tenant.created/activated/suspended/resumed/expired.v1<\/code>；<code>POST /tenants/{id}:activate|suspend|resume<\/code>（幂等 + 审批钩子）；到期扫描作业由 7.13 调度器执行；会话中心订阅后吊销该租户会话；<code>GET /api/tenancy/meta/state-machine<\/code> 机器可读。只读 / 注销 / 数据销毁尾部为 S3。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：租户到期进入宽限后，该租户新登录被拒、已登录会话在 ≤ 60s 内失效（<code>tenant.expired.v1<\/code> → 会话吊销）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：7.3 租户到期扫描作业在 staging 准点触发并发出 <code>tenant.expired.v1<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：非法迁移（如从注销回正常）返回结构化错误；<code>Suspend<\/code> 任一状态可进、<code>Resume<\/code> 回原状态<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>suspend / purge<\/code> 能力标 <code>destructive<\/code> + <code>humanOnly<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-002.md"},{"id":"S1-TEN-003","title":"开通编排 Orchestrator 与幂等步骤表","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-RT-005"],"blockedBy":["S1-TEN-001","S1-RT-005"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>开通编排由 <code>qian.lifecycle<\/code> 承担（R13），<code>qian.tenancy<\/code> 只装配其租户级 <code>Provision<\/code> 入口：创建主档 → <code>ITenantProvisioner.ProvisionAsync<\/code>（Shared + RLS）→ 对每个平台插件与租户 scope 已挂载组件执行 <code>tenantProvision<\/code> 钩子 → 创建租户管理员 Membership → 写初始授权 → 发通知；失败按 <code>tenant_provision_steps<\/code> / <code>lifecycle_runs<\/code> 步骤表重试，不靠事务、不用 Saga。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：开通中途在第 3 步注入失败，重试后从第 3 步继续，前两步不重复执行（<code>tenant_provision_steps<\/code>）<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用在租户 A、B 分别开通，<code>lifecycle_runs<\/code> 各有一条成功记录；重复开通幂等<\/li>\n<li class='chk'><span class='box'><\/span>IT：Shared + RLS 策略下开通后 GUC 与策略就绪，租户管理员可登录<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-003.md"},{"id":"S1-TEN-004","title":"租户配置服务 ITenantSettings 与用户配额","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-TEN-001","S1-RT-004","S1-CFG-003","S1-AUD-001"],"blockedBy":["S1-TEN-001","S1-RT-004","S1-CFG-003","S1-AUD-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-007-config-center-apollo.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-007-config-center-apollo.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>ITenantSettings.Get&lt;T&gt;(pluginId, key)<\/code>：值按插件 <code>config.schema<\/code>（<code>scopes: [tenant]<\/code>）校验、变更审计、缓存键带租户前缀；平台默认值来自 Apollo，租户覆盖即租户 scope patch（存 PG <code>scope_patches<\/code>，与文件 patch 同格式同校验器）；<code>GET/PUT /tenants/{id}/settings/{plugin}<\/code>、<code>GET /tenants/{id}/quota<\/code>；单管理员 + 用户配额（不计平台超管、计租户管理员，Q12）。登录策略、密码策略、文件配额都是它的客户。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：用户配额为 5 时第 6 个成员创建返回结构化错误 <code>CARDINALITY_USER_LIMIT<\/code>，平台超管不计入计数<\/li>\n<li class='chk'><span class='box'><\/span>IT：租户级登录策略覆盖写入 <code>TenantSetting<\/code> 后 7.4 在下一次登录即生效，且变更出现在审计链<\/li>\n<li class='chk'><span class='box'><\/span>UT：不符合插件 <code>config.schema<\/code> 的租户覆盖值被拒绝并带 JSON Pointer<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>qian dump-config --scope tenant:&lt;id&gt;<\/code> 打印的合成结果与 <code>ITenantSettings<\/code> 读到的值一致<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-004.md"},{"id":"S1-TEN-005","title":"运营后台最小 CRUD 页面（yue）：租户列表、新建编辑、管理员、重置密码","status":"todo","stage":"S1","area":"TEN","areaName":"租户","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-TEN-001","S1-YUE-007","S1-YUE-008","S1-YUE-009"],"blockedBy":["S1-TEN-001","S1-YUE-007","S1-YUE-008","S1-YUE-009"],"order":8,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>运营后台页面：列表 / 筛选、新建 / 编辑抽屉、授权（调 7.14）、管理员维护（<code>GET/PUT /tenants/{id}/admins<\/code>）、重置密码；用 SchemaForm + DataTable 实现，不出现第二套表单或表格实现。自助申请 / 审核 / 邀请为 S3。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：运营后台创建租户 A、B 并各设管理员，管理员登录后只看到本租户数据<\/li>\n<li class='chk'><span class='box'><\/span>E2E：租户管理页用 OrganizeSelect / UserSelect / RoleSelect / 授权树完成角色授予<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：页面只用 <code>@yue/form<\/code> SchemaForm 与 <code>@yue/data<\/code> DataTable，无第二套实现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-TEN-005.md"},{"id":"S1-YUE-001","title":"qian.shell MF2 宿主、插槽注册表、桥接 API 与前端 SDK","status":"todo","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-003","S1-YUE-006","S1-YUE-009"],"blockedBy":["S1-RT-003","S1-YUE-006","S1-YUE-009"],"order":8,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-013-frontend-yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>外壳是 <code>@qian/runtime<\/code> 上的一棵 TS 插件树，打包为 <code>platform<\/code> 的 <code>shell<\/code> 组合包（静态制品，经 <code>gateway<\/code> 提供，R31）：<code>registerRemotes / loadRemote<\/code>、<code>mf-manifest.json<\/code> 类型提示与预加载；共享 singleton <code>react / react-dom / @yue/* / @qian/plugin-sdk<\/code>、<code>engines.yue<\/code> 校验；六个插槽 <code>qian.shell.nav/v1<\/code>、<code>settings/v1<\/code>、<code>user-menu/v1<\/code>、<code>command/v1<\/code>、<code>preview/v1<\/code>、<code>client-action/v1<\/code>（输入 Schema + 输出类型，租户 scope 贡献遮蔽全局）；桥接 API <code>window.__qian.bridge<\/code>（<code>getContext<\/code> 只读、<code>navigate<\/code>、<code>notify<\/code>、<code>invoke<\/code> 带幂等键、<code>registerClientAction<\/code>），校验调用方远程 ID 与插槽作用域；npm <code>@qian/plugin-sdk<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：<code>engines.yue<\/code> 不满足的远程模块被拒绝加载并在控制台与审计留痕；共享依赖只存在一份 React 实例<\/li>\n<li class='chk'><span class='box'><\/span>UT：桥接 API 拒绝来自未注册远程或超出声明作用域的调用；<code>getContext()<\/code> 返回对象不可写<\/li>\n<li class='chk'><span class='box'><\/span>UT：租户 scope 的插槽贡献遮蔽同名全局贡献；客户端动作注册表（名称、参数 JSON Schema、权限、人话描述）可导出 JSON<\/li>\n<li class='chk'><span class='box'><\/span>包 <code>@qian/plugin-sdk<\/code> 发布到私有 feed，含注册远程、导航与插槽贡献、<code>PlatformClient<\/code>、拦截器链<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-YUE-001.md"},{"id":"S1-YUE-002","title":"外壳认证流程、租户切换、菜单路由、运行时配置注入与兜底页","status":"todo","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-YUE-001","S1-IDP-003","S1-GW-001","S1-RT-004"],"blockedBy":["S1-YUE-001","S1-IDP-003","S1-GW-001","S1-RT-004"],"order":9,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>OIDC code + PKCE、<code>AuthProvider<\/code> 契约、刷新队列合并、多租户选择、过期弹窗；后端菜单 → 路由（<code>menuTypeRegistry<\/code>：页面、外链）；租户切换器（令牌重签）+ 平台代管常驻横幅；主题 / 语言切换、用户下拉；403 / 404 / 500 / 离线兜底与 ErrorBoundary；<code>window.__APP_CONF__<\/code>（K8s ConfigMap）；<code>Preferences<\/code> 注入；站内信顶栏弹窗；加载规则：租户 scope 已挂载 ∧ 路由需要的插槽 → <code>loadRemote<\/code>（权益接线在 S1-ENT-002）；令牌不进 localStorage / URL / iframe。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：登录 → 多租户选择 → 切换租户 → 令牌重签 → 菜单与权限随之刷新；令牌过期时刷新队列合并并发请求，失败弹过期对话框<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用的远程模块在租户 A scope 已挂载时按需加载并出现在导航；在租户 B scope 未挂载时 <code>mf-manifest.json<\/code> 不被请求<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：<code>localStorage<\/code> 中不存在 access/refresh token 明文；URL 与 iframe src 中不出现令牌<\/li>\n<li class='chk'><span class='box'><\/span>E2E：改 ConfigMap 中 <code>__APP_CONF__.apiBase<\/code> 后刷新即生效，不重编译<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-YUE-002.md"},{"id":"S1-YUE-003","title":"yue 工程化基线、CI 门禁矩阵与 Base UI 验证门","status":"todo","stage":"S1","area":"YUE","areaName":"外壳与 yue","wave":2,"priority":"P0","type":"infra","owner":"","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/yue.md"},{"path":"docs/adr/ADR-013-frontend-yue.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/migration/REA odo","stage":"S2","area":"DOCS","areaName":"文档站与组件文档","wave":1,"priority":"P1","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-DOCS-003","S1-MGW-001","S1-YUE-005"],"blockedBy":["S1-DOCS-003","S1-MGW-001","S1-YUE-005"],"order":4,"readyNow":false,"refs":[{"path":"docs/adr/ADR-013-frontend-yue.md#D13.18","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-013-frontend-yue.md"},{"path":"docs/adr/ADR-015-model-gateway.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-015-model-gateway.md"},{"path":"docs/adr/ADR-016-iclaw-boundary.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-016-iclaw-boundary.md"},{"path":"docs/prd/10-s4-agent.md","url":"https://github.com/idadawn/qian/blob/main/docs/prd/10-s4-agent.md"}],"updated":"2026-10-07","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>Rspress 自身不带站内 AI 聊天，这一块按 ADR-013 D13.18 用自己的栈实现：检索基于 S1-DOCS-003 产出的 <code>.md<\/code> 与 <code>kb-index.json<\/code>（由产品负责人规划的知识库承载），模型调用经模型网关（Higress + GPUStack，ADR-015），Agent 运行时侧按 ADR-016 复用 iClaw（经 MCP / HTTP），挂件本身是一个 yue 组件。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>yue 组件 <code>&lt;AskDocs&gt;<\/code> 可嵌入文档站右下角与搜索框，支持流式回答，回答末尾列出来源页链接（至少 1 条、最多 5 条）<\/li>\n<li class='chk'><span class='box'><\/span>检索走知识库接口，命中内容来自 S1-DOCS-003 的 <code>.md<\/code> 产物；知识库不可用时自动降级为站内搜索并明示<\/li>\n<li class='chk'><span class='box'><\/span>模型调用只经模型网关，不直连任何第三方模型服务；网关侧有租户与配额计量（ADR-015）<\/li>\n<li class='chk'><span class='box'><\/span>默认不保存对话内容；是否记录可在站点配置开关，并在界面明示<\/li>\n<li class='chk'><span class='box'><\/span>IT：对 20 条「组件如何使用」类问题的回答全部给出正确来源页（人工评审集，纳入发布前检查）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-07 claude：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S2-DOCS-001.md"}];
const STATUS = {todo:'待办',doing:'进行中',review:'待评审',done:'已完成',blocked:'阻塞'};
const ORDER = ['todo','doing','review','done','blocked'];
const $ = s => document.querySelector(s);
const by = {}; TASKS.forEach(t => by[t.id] = t);
let view = 'board', sortKey = 'order', sortAsc = true;

function fill(sel, vals, label){ const s=$(sel); [...new Set(vals)].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;s.appendChild(o);}); }
fill('#f-stage', TASKS.map(t=>t.stage));
fill('#f-area', TASKS.map(t=>t.area), v=>`${v} ${(TASKS.find(t=>t.area===v)||{}).areaName||''}`);
fill('#f-wave', TASKS.map(t=>String(t.wave)), v=>v==='0'?'决策':`第 ${v} 波`);
fill('#f-status', ORDER.filter(s=>TASKS.some(t=>t.status===s)), v=>STATUS[v]);
fill('#f-priority', TASKS.map(t=>t.priority));
fill('#f-owner', TASKS.map(t=>t.owner||'（未认领）'));

function filtered(){
  const g = id => $(id).value, q = $('#f-q').value.trim().toLowerCase();
  return TASKS.filter(t =>
    (!g('#f-stage')||t.stage===g('#f-stage')) && (!g('#f-area')||t.area===g('#f-area')) &&
    (!g('#f-wave')||String(t.wave)===g('#f-wave')) && (!g('#f-status')||t.status===g('#f-status')) &&
    (!g('#f-priority')||t.priority===g('#f-priority')) && (!g('#f-owner')||(t.owner||'（未认领）')===g('#f-owner')) &&
    (!q||t.id.toLowerCase().includes(q)||t.title.toLowerCase().includes(q)));
}
const w = t => $('#weighted').checked ? (t.days||1) : 1;
function pct(list){ const tot=list.reduce((a,t)=>a+w(t),0); const done=list.filter(t=>t.status==='done').reduce((a,t)=>a+w(t),0); const doing=list.filter(t=>t.status==='doing'||t.status==='review').reduce((a,t)=>a+w(t),0); return {tot,done,doing,p:tot?Math.round(done*100/tot):0,pd:tot?Math.round(doing*100/tot):0}; }
function orderChip(t){ if(t.status!=='todo'&&t.status!=='blocked') return ''; return t.readyNow?'<span class="chip ok">可开始</span>':`<span class="chip wait">第 ${t.order+1} 批 · 等 ${t.blockedBy.length} 个前置</span>`; }
function chip(t){ return `${orderChip(t)}<span class="chip ${t.priority.toLowerCase()}">${t.priority}</span><span class="chip">${t.area}</span><span class="chip">w${t.wave}</span>${t.owner?`<span class="chip">${esc(t.owner)}</span>`:''}${t.blockedBy.length&&t.status!=='done'?`<span class="chip blk">被阻塞 ${t.blockedBy.length}</span>`:''}`; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const list = filtered();
  const all = pct(TASKS), cur = pct(list);
  $('#pdone').style.width = all.p+'%';
  $('#meta').textContent = `总体 ${all.p}% · ${TASKS.length} 个任务 · 最近更新 ${TASKS.map(t=>t.updated).sort().pop()||'—'}`;
  const k = s => list.filter(t=>t.status===s).length;
  $('#kpis').innerHTML = `<div class="kpi"><b>${cur.p}%</b><span>当前筛选完成度${$('#weighted').checked?'（加权）':''}</span></div>` +
    ORDER.map(s=>`<div class="kpi"><b>${k(s)}</b><span>${STATUS[s]}</span></div>`).join('') +
    `<div class="kpi"><b>${list.filter(t=>t.blockedBy.length&&t.status!=='done').length}</b><span>被未完成依赖阻塞</span></div>`;
  ['board','table','progress','deps'].forEach(v=>$('#v-'+v).hidden = v!==view);
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  if(view==='board') renderBoard(list); else if(view==='table') renderTable(list); else if(view==='progress') renderProgress(list); else renderDeps(list);
}
function card(t){ return `<div class="card" data-id="${t.id}"><div class="id">${t.id} · ${esc(t.estimate)} · ${t.updated}</div><div class="t">${esc(t.title)}</div><div class="chips">${chip(t)}</div></div>`; }
function renderBoard(list){
  $('#v-board').innerHTML = ORDER.map(s=>{ const items=list.filter(t=>t.status===s).sort((a,b)=>(s==='todo'||s==='blocked')?(a.order-b.order||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id)):(a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id))); return `<div class="col"><h3>${STATUS[s]} · ${items.length}${s==='todo'?' <small>（按可做先后）</small>':''}</h3>${items.map(card).join('')||'<div class="empty">—</div>'}</div>`; }).join('');
}
function renderTable(list){
  const cols=[['order','顺序'],['id','ID'],['title','标题'],['status','状态'],['priority','优先级'],['wave','波次'],['area','领域'],['owner','负责人'],['estimate','估算'],['updated','更新']];
  const rows=[...list].sort((a,b)=>{ if(sortKey==='order'){ const d=(a.order-b.order)||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id); return d*(sortAsc?1:-1);} const x=a[sortKey],y=b[sortKey];return (x>y?1:x<y?-1:0)*(sortAsc?1:-1);});
  $('#v-table').innerHTML = `<table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortAsc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(t=>`<tr data-id="${t.id}"><td>${t.status==='done'?'—':(t.readyNow?'<span class="chip ok">可开始</span>':(t.status==='todo'||t.status==='blocked')?`第 ${t.order+1} 批`:STATUS[t.status])}</td><td><code>${t.id}</code></td><td>${esc(t.title)}${t.blockedBy.length&&t.status!=='done'?' <span class="chip blk">阻塞</span>':''}</td><td>${STATUS[t.status]}</td><td><span class="chip ${t.priority.toLowerCase()}">${t.priority}</span></td><td>${t.wave===0?'决策':t.wave}</td><td>${t.area}</td><td>${esc(t.owner||'—')}</td><td>${esc(t.estimate)}</td><td>${t.updated}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">没有匹配的任务</td></tr>'}</tbody></table>`;
  $('#v-table').querySelectorAll('th').forEach(th=>th.onclick=()=>{ if(sortKey===th.dataset.k) sortAsc=!sortAsc; else {sortKey=th.dataset.k; sortAsc=true;} render(); });
}
function group(list, key, label){
  const g={}; list.forEach(t=>{const k=key(t); (g[k]=g[k]||[]).push(t);});
  return Object.keys(g).sort().map(k=>{const p=pct(g[k]); return `<div class="pline"><span>${label?label(k,g[k]):k}</span><div class="bar"><i style="width:${p.p}%"></i><i class="doing" style="width:${p.pd}%;margin-top:-10px;margin-left:${p.p}%"></i></div><span class="n">${p.p}% · ${g[k].filter(t=>t.status==='done').length}/${g[k].length}</span></div>`;}).join('');
}
function renderProgress(list){
  $('#v-progress').innerHTML = [
    ['按阶段', group(list, t=>t.stage)],
    ['按波次', group(list, t=>String(t.wave), k=>k==='0'?'决策（wave 0）':`第 ${k} 波`)],
    ['按领域', group(list, t=>t.area, (k,g)=>`${k} ${g[0].areaName}`)],
    ['按负责人', group(list, t=>t.owner||'（未认领）')],
    ['按优先级', group(list, t=>t.priority)],
  ].map(([h,b])=>`<div class="pbox"><h3>${h}</h3>${b||'<div class="empty">—</div>'}</div>`).join('');
}
function renderDeps(list){
  const blocked = list.filter(t=>t.status!=='done'&&(t.status==='blocked'||t.blockedBy.length)).sort((a,b)=>a.order-b.order||a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id));
  const ready = list.filter(t=>t.status==='todo'&&!t.blockedBy.length).sort((a,b)=>a.priority.localeCompare(b.priority)||a.wave-b.wave||a.id.localeCompare(b.id));
  $('#v-deps').innerHTML = `<div class="prog"><div class="pbox"><h3>可以开始（无未完成依赖的待办）· ${ready.length}</h3>${ready.map(card).join('')||'<div class="empty">—</div>'}</div><div class="pbox"><h3>被阻塞 · ${blocked.length}</h3>${blocked.map(t=>`<div class="card" data-id="${t.id}"><div class="id">${t.id}</div><div class="t">${esc(t.title)}</div><div class="hint">${t.status==='blocked'?'状态为阻塞':''} ${t.blockedBy.length?'等待：'+t.blockedBy.map(d=>`<code>${d}</code>`).join(' '):''}</div></div>`).join('')||'<div class="empty">—</div>'}</div></div>`;
}
function openTask(id){
  const t = by[id]; if(!t) return;
  $('#dbody').innerHTML = `<h2>${t.id} ${esc(t.title)}</h2><div class="meta">${STATUS[t.status]} · ${t.priority} · ${t.stage} 第 ${t.wave} 波 · ${t.area} ${esc(t.areaName)} · ${esc(t.estimate)} · 负责人 ${esc(t.owner||'未认领')} · 更新 ${t.updated}</div><div class="chips">${chip(t)}</div>
    ${t.depends.length?`<h4>依赖</h4><div>${t.depends.map(d=>`<a href="#" data-id="${d}"><code>${d}</code></a> ${by[d]?esc(by[d].title)+'（'+STATUS[by[d].status]+'）':''}`).join('<br>')}</div>`:''}
    ${t.refs.length?`<h4>文档</h4><div>${t.refs.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.path)}</a>`).join('<br>')}</div>`:''}
    <h4>文件</h4><div><a href="https://github.com/idadawn/qian/blob/main/${t.file}" target="_blank" rel="noopener">${t.file}</a></div>
    ${t.bodyHtml}`;
  $('#drawer').classList.add('open');
  $('#dbody').querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openTask(a.dataset.id);});
}
document.addEventListener('click', e => { const c = e.target.closest('[data-id]'); if(c && !e.target.closest('a[href]') && !e.target.closest('#dbody')) openTask(c.dataset.id); });
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
document.querySelectorAll('select,#f-q,#weighted').forEach(el=>el.addEventListener('input',render));
$('#reset').onclick=()=>{document.querySelectorAll('select').forEach(s=>s.value='');$('#f-q').value='';render();};
$('#close').onclick=()=>$('#drawer').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawer').classList.remove('open');});
render();
</script>
</body>
</html>
