/adr/ADR-014-marketplace.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.entitlement<\/code>（<code>Qian.Entitlement.Abstractions<\/code> / <code>ctx.Entitlement<\/code> + <code>Qian.Entitlement<\/code>）：<code>tenant_entitlements<\/code>（tenant、plugin、version_range、plan_id 可空、source <code>manual | plan | order<\/code>、valid_from/to、status、granted_by）；<code>PUT/DELETE /api/tenants/{id}/entitlements/{plugin}<\/code>、<code>GET /api/entitlements/me?plugin=<\/code>（返回 <code>{ entitled, versionRange, validTo, features[], seats, meters }<\/code> S3 字段可空）；Redis <code>ent:{tenant}:{plugin}<\/code> TTL 5 分钟 + <code>entitlement.changed.v1<\/code> 失效；授予 → <code>qian.lifecycle<\/code> 的 <code>Entitled<\/code>；平台插件（<code>policy.required: true<\/code>）恒授权。「开没开」由 scope patch 表达，本组件只答「买没买」。权益 API 形状是 S3 市场几乎改不了的三件事之一。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>IsEntitled<\/code> 对平台插件恒 true；对过期授权（<code>valid_to<\/code> 已过）返回 false 并发事件<\/li>\n<li class='chk'><span class='box'><\/span>UT：权益响应 Schema 含 S3 预留字段（可空），契约快照测试锁定形状<\/li>\n<li class='chk'><span class='box'><\/span>IT：授予 / 撤销写审计并发 <code>entitlement.changed.v1<\/code>，缓存 ≤ 5s 失效<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>entitlements.me<\/code> 标 <code>read<\/code>；授予 / 撤销标 <code>write<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-ENT-001.md"},{"id":"S1-ENT-002","title":"权益 ∧ scope 挂载 ∧ 灰度：三处拦截接线与正交验证","status":"todo","stage":"S1","area":"ENT","areaName":"权益","wave":3,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-ENT-001","S1-GW-003","S1-RT-014","S1-YUE-002","S1-CFG-004"],"blockedBy":["S1-ENT-001","S1-GW-003","S1-RT-014","S1-YUE-002","S1-CFG-004"],"order":8,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>把 <code>ctx.Entitlement<\/code> 接进网关 <code>PluginEnabledTransform<\/code>、SDK <code>PluginEnabledMiddleware<\/code>、外壳远程模块加载三处：未授权、未挂载、被 restrict 一律 404 / 不加载，与不存在无法区分（R32）；与 7.8 特性开关正交。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：对租户 B 撤销参考应用授权后 ≤ 5s：网关 404、SDK 404、外壳菜单消失（与不存在无法区分，R32）；重新授予后恢复<\/li>\n<li class='chk'><span class='box'><\/span>IT：已授权 + scope 未挂载 = 404；授权撤销 + scope 已挂载 = 404；两者都满足 + 灰度开关关 = 该灰度特性不可见但组件可用<\/li>\n<li class='chk'><span class='box'><\/span>E2E：未挂载组件的远程模块 <code>mf-manifest.json<\/code> 不被请求<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-ENT-002.md"},{"id":"S1-EVT-001","title":"Qian.Events：信封、稳定事件 ID、Outbox 发布与 MQ 拓扑","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-002","S1-RT-001","S1-DATA-001","S1-KUN-009"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-008-events-messaging.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-008-events-messaging.md"},{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"contracts/v0/event-envelope.schema.json","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/event-envelope.schema.json"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"}],"updated":"2026-10-10","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.events<\/code>（<code>Qian.Events.Abstractions<\/code> / <code>ctx.Events<\/code> + <code>Qian.Events<\/code>，随 SDK 进每个 .NET profile）：<code>QianEventEnvelope { version, event_id (uuid v7), subject, type, occurred_at, tenant_id, producer, correlation_id?, causation_id?, actor { kind, id, on_behalf_of? }, trace_parent, payload }<\/code> 对齐 iClaw 契约；<code>[IntegrationEventId]<\/code> 稳定 ID 与 payload Schema 导出；<code>Publish<\/code> 只允许命令 handler 同 scope；Outbox 发布器批 100、<code>FOR UPDATE SKIP LOCKED<\/code>、publisher confirm、指数退避；exchange <code>qian.events<\/code>（topic）、quorum 队列 <code>q.&lt;service&gt;.&lt;subscription&gt;<\/code>、广播队列；独立模式 Outbox 用宿主 DbContext。与 <code>Qian.Runtime<\/code> 进程内事件不混用。<\/p>\n<p>S1-DEC-013（2026-10-10）裁决：消费端幂等默认用 Kun 的 Redis <code>IProcessedMessageStore<\/code>，PG <code>processed_messages<\/code> 兜底表是本任务的可选项，不做也可；「集成事件只能在命令 handler 同 scope 发出」的分析器规则上游没做（S1-KUN-002 只有运行时 <code>IScopedPublisher<\/code> 兜底），由本任务第 4 条验收落地。<\/p>\n<p>Kun 2026.10.9 行为变更（S1-KUN-009，2026-10-10）：Outbox 表新增可空列 <code>NextAttemptAt<\/code>（持久化指数退避，<code>RetryBaseDelay × 2^(AttemptCount-1)<\/code> 封顶一分钟），参考应用与独立模式宿主 DbContext 都要先生成并应用迁移（kun 仓库 <code>samples/*/Infrastructure/Migrations/*_OutboxRetrySchedule.cs<\/code> 为样板）；默认 <code>EfOutboxMessageStore<\/code> 以 <code>FOR UPDATE SKIP LOCKED<\/code> 领取批次，自定义非事务存储不再默认无锁，须显式 <code>UseRedisOutboxLock()<\/code> 或仅在单实例测试提供 <code>NullOutboxLockProvider<\/code>；消费者成功后才记幂等并 ack，失败经 quorum 队列退避后进 DLX。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：参考应用创建客户后 <code>outbox_messages<\/code> +1，RabbitMQ 收到 1 条<\/li>\n<li class='chk'><span class='box'><\/span>IT：杀掉发布器副本后另一副本接管，无重复发布（confirm 计数 = Outbox 行数）<\/li>\n<li class='chk'><span class='box'><\/span>UT：信封通过 iClaw <code>events-schema.json<\/code> 校验；每个 <code>[IntegrationEventId]<\/code> 都能导出 JSON Schema<\/li>\n<li class='chk'><span class='box'><\/span>UT：在非命令 handler 处 <code>Publish<\/code> 触发分析器错误；<code>actor.kind<\/code> 支持 <code>agent<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：refs 加 contracts/v0/event-envelope.schema.json；iClaw 信封兼容性的验收口径见 contracts/v0/iclaw-alignment.md 第 3 节<\/li>\n<li>2026-10-10 claude：背景记入 Kun 2026.10.9 的 Outbox 行为变更（<code>NextAttemptAt<\/code> 迁移、非事务存储默认拒绝无锁、先记幂等再 ack），随 S1-KUN-009 升级可用<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-001.md"},{"id":"S1-EVT-002","title":"消费端至少一次：手动 ack、指数退避、DLX、Redis 幂等装饰器与租户回灌","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-EVT-001","S1-TEN-001"],"blockedBy":["S1-EVT-001","S1-TEN-001"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>Subscribe&lt;TEvent, THandler&gt;()<\/code>；处理成功后 ack；重试 5 次后进 <code>qian.dlx<\/code> 并告警；幂等装饰器先查 Redis <code>processed:{consumer}:{event_id}<\/code>（TTL 7 天）再执行、成功后写入，PG <code>processed_messages<\/code> 兜底；信封 <code>tenant_id<\/code> → <code>BeginScope<\/code> 与 baggage 注入在订阅器统一完成；竞争消费与广播两种订阅。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：消费端前两次抛异常、第三次成功，<code>processed_messages<\/code> 恰一行；第 6 次仍失败进 DLX 并发告警<\/li>\n<li class='chk'><span class='box'><\/span>IT：同一事件重投两次，幂等装饰器拦截第二次，handler 只执行一次<\/li>\n<li class='chk'><span class='box'><\/span>IT：消费端 handler 内租户上下文为该事件的租户，EF 查询自动带 <code>tenant_id<\/code> 过滤<\/li>\n<li class='chk'><span class='box'><\/span>IT：广播订阅下每个实例各收到一次，竞争订阅下只有一个实例收到<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-002.md"},{"id":"S1-EVT-003","title":"事件目录、AsyncAPI 导出、主题 ACL 与 IOutboxWriter","status":"todo","stage":"S1","area":"EVT","areaName":"事件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-EVT-001","S1-RT-006"],"blockedBy":["S1-EVT-001","S1-RT-006"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>GET /api/capabilities/events<\/code> 返回每事件 ID、版本、Schema、发布插件、订阅者（按权限过滤）；AsyncAPI 描述随 <code>qian pack<\/code> 导出；清单 <code>provides.events.publish/subscribe<\/code> 生成 RabbitMQ 主题 ACL（P1）；<code>IOutboxWriter<\/code> 面向 <code>NpgsqlTransaction<\/code> 的契约（S2 动态表同事务）。事件契约化为 S4 Agent 触发器预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/capabilities/events<\/code> 按权限过滤返回事件 ID、版本、Schema、发布插件与订阅者<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>qian pack<\/code> 导出的 AsyncAPI 与事件目录一致<\/li>\n<li class='chk'><span class='box'><\/span>TCK：清单未声明 <code>publish<\/code> 的事件被运行时拒绝发布（P1，主题 ACL）<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>IOutboxWriter<\/code> 契约随 <code>Qian.Events.Abstractions<\/code> 发布并通过 PublicAPI 分析器<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-EVT-003.md"},{"id":"S1-FILE-001","title":"Qian.Files 核心：租户前缀键、配额、上传策略与预签名 API","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-001","S1-TEN-004","S1-AZ-004","S1-AUD-001","S1-EVT-001","S1-KUN-006","S1-KUN-009"],"blockedBy":["S1-TEN-004","S1-AZ-004","S1-AUD-001","S1-EVT-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"}],"updated":"2026-10-10","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.files<\/code>（<code>Qian.Files.Abstractions<\/code> / <code>ctx.Files<\/code>）基于 Kun 新线 <code>IFileStorage<\/code>：<code>IQianFileService<\/code>、<code>file_objects<\/code> 表、存储键 <code>tenants/{tenant_id}/{plugin_id}/{yyyy}/{MM}/{uuid}{ext}<\/code> 服务端生成、配额读 7.3（<code>QUOTA_EXCEEDED<\/code>）、<code>UploadPolicy<\/code> 由清单 <code>contributes: qian.files.upload-policy/v1<\/code> 声明、MIME 服务端嗅探、<code>ContentDispositionPolicy = attachment<\/code> 不可关闭；<code>POST /api/files/uploads:presign<\/code>（TTL ≤ 15 分钟）、<code>POST /files/{id}:complete<\/code>、<code>GET /files/{id}/download-url<\/code>（TTL ≤ 5 分钟、经 7.5）、<code>DELETE<\/code>（软删）；事件 <code>files.object.created/deleted.v1<\/code>；下载审计；旧线以 Banned API 禁用。退出标准点名能力。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：租户 A 的下载 URL 对 B 的文件 id 返回 404；任何文件的 <code>storage_key<\/code> 都以 <code>tenants/{tenant_id}/<\/code> 开头<\/li>\n<li class='chk'><span class='box'><\/span>IT：上传 <code>text/html<\/code> 文件后下载响应头为 <code>Content-Disposition: attachment<\/code>，且无配置项可改变<\/li>\n<li class='chk'><span class='box'><\/span>IT：配额 10 MB 时第 11 MB 上传返回 <code>QUOTA_EXCEEDED<\/code>；软删后配额释放<\/li>\n<li class='chk'><span class='box'><\/span>IT：预签名 URL 过期后 PUT 失败；<code>complete<\/code> 时 sha256 不符返回错误并标记 <code>quarantined<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>files.presign-upload<\/code> 调用产生审计与 <code>files.object.created.v1<\/code> 事件；<code>files.delete<\/code> 标 <code>destructive<\/code> + <code>confirm<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-001.md"},{"id":"S1-FILE-002","title":"文件 Provider：oss / s3 / local 与 patch 切换","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-FILE-001","S1-CFG-002","S1-RT-002"],"blockedBy":["S1-FILE-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.4 的样例 seam：<code>Qian.Files.Oss<\/code>（现网对象存储）/ <code>Qian.Files.S3<\/code>（MinIO / S3 兼容）/ <code>Qian.Files.Local<\/code>（仅开发与单节点）三个 Provider 只依赖 <code>Qian.Files.Abstractions<\/code>，装载其一；Provider 选择 = profile patch 替换 <code>qian.files<\/code> 条目的 <code>provider<\/code> 配置，切换不影响已有键；凭据经 secretRef；<code>qian.files.provider/v1<\/code> 扩展点。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>TCK：三个 Provider 对同一组文件操作 fixture（上传、预签名、下载、删除）结果一致<\/li>\n<li class='chk'><span class='box'><\/span>E2E：用 <code>--patch<\/code> 把 <code>provider<\/code> 从 <code>local<\/code> 换成 <code>oss<\/code> 后所有消费者不变，已有存储键仍可读<\/li>\n<li class='chk'><span class='box'><\/span>CI：Provider 包的传递依赖中不出现其他 Provider 与 <code>Qian.Files<\/code> 以外的实现包；凭据只以 secretRef 出现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-002.md"},{"id":"S1-FILE-003","title":"分片上传、MD5 秒传与软删保留期清理作业","status":"todo","stage":"S1","area":"FILE","areaName":"文件","wave":2,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-FILE-001","S1-SCH-001"],"blockedBy":["S1-FILE-001","S1-SCH-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.7","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.15.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>file_uploads<\/code> 分片会话：<code>POST /uploads:init<\/code>、<code>PUT /uploads/{id}/parts/{n}<\/code>、<code>POST /uploads/{id}:complete<\/code>、<code>GET /uploads:lookup?sha256=<\/code>（秒传）；yue <code>Upload<\/code> 组件消费其契约；软删后保留期满经 7.13 调度物理删除。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：yue <code>Upload<\/code> 以分片 + MD5 上传 200 MB 文件至 OSS provider，秒传命中返回已有 id<\/li>\n<li class='chk'><span class='box'><\/span>IT：分片会话中断后可续传；<code>complete<\/code> 校验全部分片与总 sha256<\/li>\n<li class='chk'><span class='box'><\/span>IT：软删文件在保留期满后由调度作业物理删除并发出 <code>files.object.deleted.v1<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-FILE-003.md"},{"id":"S1-GW-001","title":"qian.gateway 宿主：强制认证、Cookie 换 S2S、密钥热轮换","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-KUN-003","S1-KUN-004","S1-IDP-005","S1-RT-002"],"blockedBy":["S1-IDP-005"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-010-gateway-layers.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-010-gateway-layers.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"contracts/v0/s2s-claims.schema.json","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/s2s-claims.schema.json"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"}],"updated":"2026-10-07","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.gateway<\/code>（<code>Qian.Gateway.Abstractions<\/code> + <code>Qian.Gateway<\/code>，<code>gateway<\/code> profile 独立 Pod、可 AOT）在 Kun.Gateway 之上写死安全默认值：回退策略 = 已认证、匿名白名单显式枚举；只信任 <code>qian-identity<\/code> 一个 issuer；外部 Bearer 或 Cookie <code>qian.sid<\/code> 统一解析主体后由 <code>S2sTokenIssuer<\/code> 签 60s S2S（RS256、<code>kid<\/code> 轮换），<code>aud<\/code> = 目标 cluster，禁透传；<code>ForwardedClaimTypes<\/code> 白名单；<code>KnownNetworks<\/code> 只含 Traefik 网段；机器身份同样换签（<code>principal_kind = service<\/code>）。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：未带凭据访问 <code>/api/tenancy/tenants<\/code> 返回 401；带外壳 Cookie 访问同一路由，下游收到 60s S2S 且 <code>aud = qian-platform<\/code>、<code>tenant_id<\/code> 正确<\/li>\n<li class='chk'><span class='box'><\/span>IT：S2S 令牌通过 iClaw <code>s2s-jwt-claims<\/code> Schema 校验；<code>exp − iat ≤ 300s<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：轮换私钥期间（双钥重叠 10 分钟）在途请求零失败；重叠期后旧 <code>kid<\/code> 被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：伪造 <code>X-Forwarded-For<\/code> 的请求（非可信网段发出）不改变限流分区与客户端 IP<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：refs 加 contracts/v0/s2s-claims.schema.json：iClaw 无 S2S JSON Schema，验收以该文件为准（iclaw-alignment.md 第 2 节）<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-001.md"},{"id":"S1-GW-002","title":"路由级限流三策略绑定与 Redis 共享计数","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"2d","days":2.0,"depends":["S1-GW-001"],"blockedBy":["S1-GW-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>kun-default<\/code>（匿名 IP）、<code>tenant<\/code>、<code>user<\/code> 三策略真正绑定到路由；429 带 <code>Retry-After<\/code>；多 Pod 共享计数 Redis <code>PartitionedRateLimiter<\/code>（P1）。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：对限流路由以同一租户 200 rps 压测，超阈值返回 429 且响应头含 <code>Retry-After<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：两个网关副本共享计数（P1）<\/li>\n<li class='chk'><span class='box'><\/span>UT：每条生成的路由都带 <code>rateLimiterPolicy<\/code>，缺失时构建期失败<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-002.md"},{"id":"S1-GW-003","title":"路由片段生成、PluginEnabledTransform 与聚合端点","status":"todo","stage":"S1","area":"GW","areaName":"网关","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-GW-001","S1-RT-004","S1-RT-006","S1-RT-013","S1-AUD-003"],"blockedBy":["S1-GW-001","S1-RT-004","S1-RT-006","S1-RT-013","S1-AUD-003"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.14","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>qian pack<\/code> 从 <code>plugin.json<\/code> 生成 YARP <code>routes/clusters<\/code> 片段（<code>authorizationPolicy<\/code>、<code>rateLimiterPolicy<\/code>、<code>requiredScopes<\/code>、<code>pluginId<\/code>），构建期合并；<code>PluginEnabledTransform<\/code> 读租户 scope 视图（权益接线在 S1-ENT-002），未挂载 / 被 restrict 一律 404 与不存在路由无法区分（R32）；<code>GET /api/openapi.json<\/code>、<code>GET /api/capabilities<\/code> 代理与 <code>/api/kernel/capabilities<\/code> 别名；<code>/healthz<\/code> / <code>/readyz<\/code>（JWKS 可取、Redis 可达、上游至少一个健康）；OTel；gRPC-Web；<code>qian.gateway.route-provider/v1<\/code> 扩展点预留。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：租户 B 的 scope 未挂载参考应用时访问其路由 404，响应与访问不存在的路由完全相同（R32）；对 B 写一条租户 scope patch 挂载后 ≤ 5s 放行，网关不重启<\/li>\n<li class='chk'><span class='box'><\/span>E2E：<code>/readyz<\/code> 在 Redis 不可达时返回 503，K8s 停止向其导流<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>GET /api/openapi.json<\/code> 需认证并汇总各宿主；<code>/api/kernel/capabilities<\/code> 返回同一结果并带 <code>Deprecation<\/code> 头<\/li>\n<li class='chk'><span class='box'><\/span>UT：由参考应用 <code>plugin.json<\/code> 生成的路由片段含四个必填字段，缺失即构建失败<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-GW-003.md"},{"id":"S1-IDP-001","title":"身份契约先行：ctx.Identity、claim 规范、SPI 与事件","status":"done","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"cody","estimate":"2d","days":2.0,"depends":["S1-RT-001","S1-AGT-001"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"}],"updated":"2026-10-10","acceptance":{"done":3,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>身份与鉴权互为前置须并行、契约先行：Definition 包定义 <code>ctx.Identity<\/code>、<code>ICurrentUser<\/code> / <code>IAuthenticatedUser<\/code>、令牌 claim 规范集（<code>sub<\/code>、<code>tenant_id<\/code>、<code>membership_id<\/code>、<code>scope<\/code>、<code>identity_revision<\/code>、<code>sid<\/code>、<code>amr<\/code> / <code>acr<\/code>，预留 <code>profile<\/code>、<code>act<\/code>）、<code>IIdentityConnector<\/code> / <code>IAuthenticatorFactor<\/code> SPI、<code>ExternalAssertion<\/code>、事件 <code>identity.login/logout/password_changed/locked/session_revoked.v1<\/code>、<code>Client.type<\/code> 枚举含 <code>agent<\/code>。S1-AZ-003 只依赖本包。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>Qian.Identity.Abstractions<\/code> 只依赖 <code>Qian.Runtime<\/code> 与 Kun 的事件端口 <code>Kun.EventBus<\/code>（Kun 尚未拆出 <code>Kun.EventBus.Abstractions<\/code>，传递带入 StackExchange.Redis；延期项登记在包 README，回切由 S1-KUN-010 跟踪，S1-DEC-013），通过 PublicAPI 分析器<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：claim 规范集与 <code>contracts/v0<\/code> S2S claim Schema 一致；<code>Client.type<\/code> 枚举含 <code>agent<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：事件 <code>identity.*.v1<\/code> 带稳定 <code>[IntegrationEventId]<\/code> 与 JSON Schema<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-09 cody：开始：身份Definition、用户/S2S claim映射、连接器和因子SPI、稳定事件与Schema。<\/li>\n<li>2026-10-09 cody：三项验收完成：身份Definition、精确S2S与用户令牌词汇区分、SPI、Agent枚举、五类稳定事件及Schema；直接依赖Runtime与当前Kun事件抽象入口Kun.EventBus（未拆分.Abstractions包），不复制标记也不依赖身份Provider。专项与全量门禁通过，等待PR。<\/li>\n<li>2026-10-09 someone：身份契约 PR #18 已合并（be696c17）；8 项专项及全量 236 项测试通过，CI 全绿。<\/li>\n<li>2026-10-10 claude：复核：claim 集、<code>agent<\/code> 枚举、五类事件与 Schema 均有测试且通过；第 1 条验收原文「只依赖 Kun.*.Abstractions」与实际（直接引用 <code>Kun.EventBus<\/code>）不符，且依赖图门禁不检查 <code>Kun.*<\/code>，已按实际改写验收并登记延期项（S1-DEC-013、S1-KUN-010）。<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-001.md"},{"id":"S1-IDP-002","title":"Identity.Server：OpenIddict 唯一 issuer 与端点","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-001","S1-KUN-004","S1-DATA-001","S1-TEN-001","S1-AZ-001"],"blockedBy":["S1-TEN-001"],"order":1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"docs/adr/ADR-005-identity-sso.md#9-身份客户端与产品联调分阶段验收2026-10-11","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"},{"path":"pm/tasks/S1-DEC-015.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-DEC-015.md"}],"updated":"2026-10-11","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>可嵌入任意 ASP.NET Core 宿主的 OpenIddict 7.x IdP，默认进 <code>identity<\/code> profile（独立 PG schema <code>identity<\/code>、独立 Redis db）：discovery / authorize / token / userinfo / revocation / introspection / end_session / back-channel logout；授权码 + PKCE、refresh 轮换 + 复用检测、<code>client_credentials<\/code>、RFC 8707 <code>resource<\/code>；非对称签名 + JWKS 轮换；每环境一个规范 issuer；access token 15 分钟；内置客户端注册表（平台、官方插件、外壳、CLI）；CSRF 与安全头。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：OpenIddict 一致性测试（授权码 + PKCE、refresh 轮换、client_credentials、revocation、back-channel logout）全部通过；refresh 令牌复用被检测并吊销整族<\/li>\n<li class='chk'><span class='box'><\/span>IT：已修复的 Kun Identity 客户端对真实 <code>qian-identity<\/code> 完成强制 PKCE 的授权码换取，篡改 nonce 的 id_token 被拒绝；记录实际 Kun 包版本、issuer 与客户端配置，不能以协议夹具或外部 IdP 代替（DEC-015，身份服务完成与发布必过）<\/li>\n<li class='chk'><span class='box'><\/span>代码审查 + IT：令牌中不含任何权限码；日志中无明文 sid、无密码<\/li>\n<li class='chk'><span class='box'><\/span>IT：以 <code>principal_kind = service<\/code> 的 <code>client_credentials<\/code> 令牌调用能力成功，<code>sub = client_id<\/code><\/li>\n<li class='chk'><span class='box'><\/span>IT：嵌入 <code>Qian.Identity.Server<\/code> 的独立宿主能通过 OpenIddict 一致性测试（ADR-019 D19.8）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-11 cody：按用户批准的 DEC-015 承接真实 PKCE/nonce 联调必过项；KUN-004 的 SDK 阶段完成不代表本任务完成，原有前置依赖保持。<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-002.md"},{"id":"S1-IDP-003","title":"Person / Membership 账号模型与统一登录流水线","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-002"],"blockedBy":["S1-IDP-002"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p><code>Person<\/code>（标识集合、Argon2id 凭据与历史哈希、MFA 因子、状态）+ <code>Membership<\/code>（person × tenant、显示名、是否租户管理员、<code>profile<\/code> 预留）+ <code>ExternalIdentity<\/code> + <code>Client<\/code> + <code>Session<\/code> + <code>LoginAudit<\/code>；<code>ISignInPipeline<\/code> 所有方式同一 <code>LoginInput<\/code> 同一签发路径；错误阈值 → 锁定或延时；初始密码强制修改不可取消；多 Membership → <code>selection_token<\/code>（5 分钟）→ 正式令牌；切换租户 = 以选择令牌重签；图形验证码按策略开关。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：同一手机号在租户 A、B 各有 Membership，密码登录后出现租户选择，选 A 后令牌 <code>tenant_id = A<\/code>；在外壳切换到 B 时令牌重签且 <code>membership_id<\/code> 变化<\/li>\n<li class='chk'><span class='box'><\/span>IT：密码错误达到阈值触发锁定；初始密码账号登录后被强制跳转改密且不可跳过<\/li>\n<li class='chk'><span class='box'><\/span>UT：密码以 Argon2id 存储且历史哈希不可复用；<code>LoginAudit<\/code> 每次登录一条<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-003.md"},{"id":"S1-IDP-004","title":"会话中心：Redis 索引、强制下线、后通道登出、revision","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-003"],"blockedBy":["S1-IDP-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>sessions:{person}<\/code> Redis 索引；失效触发：改密、停用、锁定、租户冻结 / 到期、强制下线、权限变更；并发上限默认 5、单端按端类型；后通道登出双向；<code>identity_revision<\/code> 递增并经网关 <code>ForwardedClaimTypes<\/code> 转发供 7.5 比对；管理面 <code>GET /api/identity/sessions?person=<\/code>、<code>POST /sessions/{sid}:revoke<\/code>、<code>POST /persons/{id}:revoke-all<\/code>、在线用户列表；日志只记 sid 哈希。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：改密后该 Person 全部会话 ≤ 5s 内失效；管理员强制下线某会话后其 refresh 被拒<\/li>\n<li class='chk'><span class='box'><\/span>IT：并发上限 5 时第 6 次登录踢掉最早会话并发出 <code>session_revoked<\/code> 事件；单端模式下 PC 后登录踢 PC 先登录、不影响移动端<\/li>\n<li class='chk'><span class='box'><\/span>IT：授权变更后 <code>identity_revision<\/code> 递增，旧令牌请求被服务端拒绝<\/li>\n<li class='chk'><span class='box'><\/span>代码审查：日志中不出现明文 sid（grep 门禁）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-004.md"},{"id":"S1-IDP-005","title":"Identity.Client：RP 接入、Cookie 会话与 S2S 校验","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-002","S1-KUN-004"],"blockedBy":["S1-IDP-002"],"order":2,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-019-library-first-packages.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>进 <code>platform<\/code> / <code>gateway<\/code> / <code>standalone<\/code> 的 RP 包：授权码 + PKCE 换取、<code>nonce<\/code> 校验、refresh、discovery 定期刷新、Cookie 会话 <code>qian.sid<\/code>、S2S 令牌验签（<code>aud<\/code> 绑定、禁透传）；独立宿主可只装 Client 对接任意 OIDC 发行方。网关与 <code>qian add identity<\/code> 的依赖。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：对强制 PKCE 的 <code>qian-identity<\/code> 完成授权码换取；篡改 <code>nonce<\/code> 的 id_token 被拒绝<\/li>\n<li class='chk'><span class='box'><\/span>IT：S2S 令牌 <code>aud<\/code> 不匹配或透传上一跳令牌时下游拒绝<\/li>\n<li class='chk'><span class='box'><\/span>E2E：独立宿主只装 <code>Qian.Identity.Client<\/code> 对接外部 OIDC 发行方完成登录<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-005.md"},{"id":"S1-IDP-006","title":"认证因子（短信 OTP、TOTP）、登录策略与个人中心","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-004","S1-NTF-003","S1-TEN-004","S1-AUD-001"],"blockedBy":["S1-IDP-004","S1-NTF-003","S1-TEN-004","S1-AUD-001"],"order":6,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.12","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>IAuthenticatorFactor<\/code> 实现短信 OTP（经 7.12 <code>sms<\/code> 渠道）与 TOTP（补充裁决升为 S1 必做）；登录策略与密码策略为租户级配置 Schema（经 <code>ITenantSettings<\/code>）；锁定通知与密码到期提醒经 7.12；登录审计入 7.11；个人中心最小集（资料、改密、社交账号、安全）；第三方账号绑定 / 解绑显式确认、同租户唯一。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：TOTP 绑定与校验、短信 OTP 登录（经 7.12 短信 Provider）在 staging 走通<\/li>\n<li class='chk'><span class='box'><\/span>IT：密码错误达到阈值触发锁定，锁定通知经 7.12 发出<\/li>\n<li class='chk'><span class='box'><\/span>IT：租户级登录策略覆盖写入后下一次登录即生效，变更出现在审计链<\/li>\n<li class='chk'><span class='box'><\/span>UT：危险操作（重置他人密码、批量强制下线）标 <code>humanOnly<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-006.md"},{"id":"S1-IDP-007","title":"连接器 SPI、统一回调路由、绑定流程与通用 OIDC 连接器","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":1,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-003","S1-CFG-002"],"blockedBy":["S1-IDP-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/specs/component-model.md#6.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p><code>IIdentityConnector { Descriptor; BeginChallengeAsync; HandleCallbackAsync; ExchangeImplicitAsync }<\/code> 与 <code>connector.manifest<\/code>（协议、终端、配置 Schema、密钥只填 secretRef、回调模板），连接器以 <code>provides[]<\/code> + <code>policy.egress<\/code> 声明（R31）、只依赖 <code>Qian.Identity.Abstractions<\/code>；<code>/connect/callback/{connectorId}<\/code> 由本体统一校验 state / nonce；绑定流程（未绑定 → 引导登录并显式确认）归本体；首批 <code>qian.identity.connector.oidc<\/code>（企业 IdP / Authentik 作上游）；假连接器 TCK fixture。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：以 Authentik（运维侧）为上游，经通用 OIDC 连接器登录 Qian；首次登录进入「确认绑定」页，确认后 <code>ExternalIdentity<\/code> 建立，同租户内重复绑定被拒<\/li>\n<li class='chk'><span class='box'><\/span>TCK：用一个假连接器实现 SPI，连接器清单校验、state 篡改拒绝、回调幂等三项通过<\/li>\n<li class='chk'><span class='box'><\/span>CI：<code>Qian.Identity.Connector.Oidc<\/code> 不依赖 <code>Qian.Identity.Server<\/code> 实现包<\/li>\n<li class='chk'><span class='box'><\/span>UT：连接器凭据只接受 secretRef，详情接口不回传密钥<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-007.md"},{"id":"S1-IDP-008","title":"企业微信连接器（扫码 + 工作台免登）","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":4,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-007","S1-RT-004"],"blockedBy":["S1-IDP-007","S1-RT-004"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.2","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#4.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>补充裁决 S1 必做、迁移顺序第 4 波：网页扫码 + 工作台 UA 识别免登，code 换 userId，多租户先反查 openid 绑定的租户；租户级启停 = 在租户 scope 挂载 / 不挂载其配置条目，被过滤的连接器在登录页与回调路由两处与不存在无法区分；不照搬 JWT 自动续签头与 query token。钉钉 / 飞书为 S2。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>E2E：企业微信扫码登录与企微工作台内免登在 staging 走通；同一企微账号在两个租户分别绑定不同 Membership<\/li>\n<li class='chk'><span class='box'><\/span>IT：在租户 A scope 挂载企微连接器、B 不挂载：A 的登录页出现企微入口，B 不出现且直接请求其回调路由返回与「连接器不存在」相同的错误；挂载 / 卸载经 scope patch 完成，不重启 <code>identity<\/code> profile<\/li>\n<li class='chk'><span class='box'><\/span>UT：清单 <code>policy.egress<\/code> 只含企微域名；凭据来自 secretRef<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-008.md"},{"id":"S1-IDP-009","title":"组织目录最小集：组织树、岗位、用户档案、多归属、用户状态机、批量三态","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-IDP-003","S1-DATA-001"],"blockedBy":["S1-IDP-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-012-workflow-engine.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-012-workflow-engine.md"},{"path":"docs/migration/README.md#3.2","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>作为 <code>qian.identity<\/code> 子模块交付（R1）：<code>organizations<\/code>（<code>path<\/code>、<code>org_type<\/code>、主管、责任岗位，层级上限 9，子树有人则拒删）、<code>org_types<\/code>、<code>positions<\/code>（默认 / 责任岗位）、<code>groups<\/code>（P1）、<code>member_relations<\/code>（多组织多岗位 + 主归属）、<code>user_profiles<\/code>（1:1 Membership）；用户状态机 <code>启用 ⇄ 禁用 → 锁定<\/code>，「删除」= 禁用 + 标记；批量操作三态结果；<code>GET /api/directory/orgs/tree<\/code>、<code>/orgs/{id}/members<\/code>、<code>/positions/{id}/holders<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：删除含成员的组织返回结构化错误并拒绝；移动组织后 <code>path<\/code> 冗余字段同步更新<\/li>\n<li class='chk'><span class='box'><\/span>IT：批量禁用 10 人其中 2 人为租户管理员，返回 <code>PARTIAL_SUCCESS<\/code> + 逐条 items[]<\/li>\n<li class='chk'><span class='box'><\/span>UT：组织类型为租户可配字典；层级超过上限被拒<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>disable member<\/code> 标 <code>write<\/code> + <code>confirm<\/code>；物理删除标 <code>destructive<\/code> + <code>humanOnly<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-009.md"},{"id":"S1-IDP-010","title":"目录派生查询契约与 directory.*.v1 变更事件","status":"todo","stage":"S1","area":"IDP","areaName":"身份与连接器","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-IDP-009","S1-EVT-001"],"blockedBy":["S1-IDP-009","S1-EVT-001"],"order":4,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.4.3","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-012-workflow-engine.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-012-workflow-engine.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>派生查询契约：<code>/members/{id}/manager<\/code>、<code>/members/{id}/superiors<\/code>（按岗位链返回上级责任人序列）、部门负责人、<code>/me/subordinates?depth=<\/code>（<code>@下属 / @子孙<\/code>）；责任人解析契约 S1 定义、S2 流程消费；目录变更事件 <code>directory.org.*<\/code>、<code>directory.position.*<\/code>、<code>directory.member.*.v1<\/code>（CloudEvents）；SCIM 2.0 核心 schema 作为对外契约；向 yue <code>OrganizeSelect / UserSelect / RoleSelect<\/code> 提供数据源。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：<code>/members/{id}/superiors<\/code> 按岗位链返回上级责任人序列；主归属变化后结果随之变化<\/li>\n<li class='chk'><span class='box'><\/span>E2E：参考应用用 <code>OrganizeSelect<\/code> 选部门、<code>UserSelect<\/code> 选人，数据来自本租户目录<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>directory.*.v1<\/code> 事件带稳定 ID 与 JSON Schema；SCIM 核心 schema 契约文件入 <code>contracts/<\/code><\/li>\n<li class='chk'><span class='box'><\/span>UT：每个目录查询带 description 与示例（Agent 契约）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-IDP-010.md"},{"id":"S1-KUN-001","title":"Kun 多租户后台链路修复：BeginScope、回灌、RLS 强制","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-001-kun-relationship.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-001-kun-relationship.md"},{"path":"docs/adr/ADR-004-database-tenant-isolation.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-004-database-tenant-isolation.md"},{"path":"packages/Qian.Data/README.md","url":"https://github.com/idadawn/qian/blob/main/packages/Qian.Data/README.md"}],"updated":"2026-10-08","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 1 项：<code>ITenantContext.BeginScope<\/code>、<code>MessageContext.TenantId<\/code> 从信封读取并在订阅器回灌、Saga 执行器按租户开作用域、<code>AddKunTenantRls<\/code> 自动挂双拦截器并强制模型缓存键工厂、<code>DefaultTenantResolver<\/code> 增加 <code>Production<\/code> 模式、两套 <code>ITenantContext<\/code> 收敛为 <code>AsyncLocalTenantContext<\/code>、claim 统一 <code>tenant_id<\/code>。第 1 波可信计算基的前提；上游 PR 优先，超 1 个迭代转 <code>Kun.MultiTenancy.Patches<\/code> 补丁包。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：租户 A 发出的集成事件，在消费端 handler 内 <code>ITenantContext.TenantId == A<\/code>，且 handler 内 EF 查询自动带 <code>tenant_id = A<\/code> 过滤（Testcontainers PG + RabbitMQ）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：生产模式下带 <code>X-Tenant-Id<\/code> 头但无合法令牌的请求返回 401，不落到 <code>default<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：同时注册 <code>AddKunMultiTenancy<\/code> 与 <code>AddKunSecurity<\/code> 只解析出一个 <code>ITenantContext<\/code> 实现<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：忘记 <code>ReplaceService&lt;IModelCacheKeyFactory&gt;<\/code> 的 DbContext 在 <code>AddQianData<\/code> 装配下被拒绝启动<\/li>\n<li class='chk done'><span class='box'>✓<\/span>修复以上游 PR 或 <code>Kun.*.Patches<\/code> 补丁包落地，回合入日期已记录<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-08 cody：开始<\/li>\n<li>2026-10-08 cody：Kun 修复见[上游 PR #43](https://github.com/idadawn/kun/pull/43)；生产 JWT、消息 A/B 隔离、双注册、Saga 与 Outbox 回灌均有回归；Qian 交付最小 AddQianData 安全装配及启动拒绝。上游回合入日期待 CI 全绿合并后补记。<\/li>\n<li>2026-10-08 cody：Qian 安全装配已合并 PR #7（https://github.com/idadawn/qian/pull/7）；本地全量 224 项测试通过，19 项门禁自测通过；上游本地 679 项单元、72 项集成通过，既有 2 项 OSS 实弹与 1 项幂等测试跳过，新增用例无跳过。KunVersion 暂为 2026.9.13，上游修复随下一次 Kun 发版后升级消费。<\/li>\n<li>2026-10-08 cody：完成：上游修复于 2026-10-08 回合入 Kun PR #43（https://github.com/idadawn/kun/pull/43，合并提交 c939f2e9f645d5e603c91f040e7a91188505fdba），22 项 CI 全绿；Qian 最小安全装配已合并 PR #7（https://github.com/idadawn/qian/pull/7，合并提交 45f65c6a4309f3002a9adaba22a4d2c3f1a67b2e），全部验收完成，无未决设计问题。<\/li>\n<li>2026-10-08 claude：上游修复已随 Kun 2026.10.8 发布（tag v2026.10.8），Qian 由 S1-KUN-008 升级消费<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-001.md"},{"id":"S1-KUN-002","title":"Kun Outbox 与事件语义修复：同 scope、手动 ack、多副本锁","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.10","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-008-events-messaging.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-008-events-messaging.md"}],"updated":"2026-10-10","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 2 项：领域事件派发改为提交前同 scope、分析器规则「集成事件只能在命令 handler 同 scope 发出」、消费端处理成功后才 ack 并指数退避进 DLX、<code>IOutboxMessageStore<\/code> EF 默认实现、Outbox 锁默认开、publisher confirm。S1 第一周先用最小集成测试实证「领域事件→集成事件路径丢消息」再定上游修复或 Qian 侧规定。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT（第一周实证）：Catalog 建商品后断言 <code>outbox_messages<\/code> 行数，确认当前路径是否丢消息并记录结论<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：命令 handler 内经通知 handler 发出的集成事件，提交后 <code>outbox_messages<\/code> 行数 +1<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：消费端 handler 第一次抛异常、第二次成功，事件最终恰被处理一次且 <code>processed_messages<\/code> 只有一行；RabbitMQ 容器重启后未 ack 消息重投不丢<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：两个发布器副本同时轮询同一 Outbox 表，每条消息只发布一次（publisher confirm 计数）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：被 Skip 的 at-least-once 集成测试恢复为必跑并通过<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-09 cody：开始：实证 Catalog 领域事件转 Outbox 路径，修复同 scope 派发、消费确认与多副本发布。<\/li>\n<li>2026-10-09 cody：验收完成：旧 Catalog 商品已提交但 Outbox=0 已实证并修复为1；全量783通过（2项既有OSS凭据测试跳过），91项集成全通过；涵盖双副本、容器重启未ack重投、退避与死信。按 ADR-008 D8.4 默认 Redis，processed_messages 成功记录语义由单一 idemp 键验证。上游 [Kun PR #46](https://github.com/idadawn/kun/pull/46)，等待 CI 全绿合并；尚未发布新包。<\/li>\n<li>2026-10-09 cody：完成：Kun PR #46 已在22项CI全绿后合并，上游main同步；五项验收完成。尚未发布Kun新包，Qian仍锁定2026.10.8。<\/li>\n<li>2026-10-10 claude：复核：本机 Docker 真跑 Outbox / 幂等集成测试通过。第 3 条验收的 <code>processed_messages<\/code> 表在 Kun 里不存在，实际以 Redis <code>idemp:<\/code> 键断言，口径经 S1-DEC-013 定为默认（PRD 7.10 已改）；分析器规则由 S1-EVT-001 落地；消费新 API 待 S1-KUN-009 发版升级。<\/li>\n<li>2026-10-10 claude：上游 Kun PR #46 已随 Kun 2026.10.9 正式发布（kun#48、tag v2026.10.9），Qian 的 KunVersion 升级与消费由 S1-KUN-009 完成<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-002.md"},{"id":"S1-KUN-003","title":"Kun 网关加固与 gRPC 流式拦截器修复","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.9","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-010-gateway-layers.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-010-gateway-layers.md"}],"updated":"2026-10-11","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 4、5 项：回退认证策略默认「要求已认证」、路由级限流真正绑定、可信代理网段、JWKS 双钥热轮换、网关宿主 <code>AddKunObservability<\/code>、<code>/healthz<\/code> <code>/readyz<\/code>、<code>client_credentials<\/code> 签发端点；Tracing / Auth / Result 三个 gRPC 拦截器补齐 server / client / duplex streaming。7.9 网关装配的前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>E2E：未带令牌请求任一业务路由返回 401（除显式匿名白名单）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：对限流路由超阈值返回 429 且响应头含 <code>Retry-After<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：轮换签名私钥后，旧 <code>kid<\/code> 令牌在重叠窗口内仍可验证，窗口外被拒绝；过程不重启进程<\/li>\n<li class='chk done'><span class='box'>✓<\/span>E2E：伪造 <code>X-Forwarded-For<\/code> 的请求（非可信网段发出）不改变限流分区<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：无 <code>tenant_id<\/code> 的流式调用在首帧前被拒绝（<code>Unauthenticated<\/code>）；流式调用出现在 trace 中<\/li>\n<\/ul>\n<h4>验收证据与边界<\/h4>\n<ul>\n<li>Kun 上游实现与真实集成测试：网关 9 项、gRPC 四形态 8 项；实际 Kestrel/HTTP2 与 RSA JWT，缺租户时 handler 和应用帧读取计数均为零。<\/li>\n<li>签名私钥在同进程原子替换后使用新 kid；重叠 JWKS 同时验旧、新签名，到期刷新 JWKS 后拒绝旧签名。消费者缓存不会被主动撤销，仍须验证寿命与时钟偏移并刷新公钥；多副本和重启需协调轮换。<\/li>\n<li>信任名单为空、非匹配代理、显式可信 IP、可信 CIDR 四种情形均经实际请求验证；仅后两者可根据转发地址切换分区。<\/li>\n<li>本地全仓 Release 测试 811 项通过、2 项既有外部对象存储测试跳过；本机不跑依赖已部署示例环境的测试及 Linux 专用原生示例测试，后者由上游 CI 单独执行。<\/li>\n<li>原生网关开启观测后的健康检查/就绪/JWKS 200、匿名业务路由 401 已验证；EF 观测通过运行时特性守卫从原生路径裁掉，保留原生编译门禁。<\/li>\n<li>机器 <code>client_credentials<\/code> 端点按 ADR-010 D10.5 与 PRD 7.9 属于 <code>qian.identity<\/code>（S1-IDP-002）；此项完成 Kun 的认证换签边界，不将身份产品端点标为已实现。<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-11 cody：开始：Kun 2026.10.9 发版任务已收尾；独立 worktree 核对网关安全默认值、限流、代理头、签名钥轮换与三类 gRPC 流式拦截器。<\/li>\n<li>2026-10-11 cody：验收实现与本地检查通过，Kun PR https://github.com/idadawn/kun/pull/49；等待上游 CI 全绿合并后记录完成。<\/li>\n<li>2026-10-11 cody：完成：Kun PR #49 已于 2026-10-11 合并，24 项必跑 CI 全绿（含 Linux Native AOT 与真实集成测试）；五项验收全部完成。<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-003.md"},{"id":"S1-KUN-004","title":"Kun Identity 客户端链路修复与 S2S 签发器收敛去产品化","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":["S1-DEC-015"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-005-identity-sso.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-005-identity-sso.md"},{"path":"contracts/v0/s2s-claims.schema.json","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/s2s-claims.schema.json"},{"path":"contracts/v0/iclaw-alignment.md","url":"https://github.com/idadawn/qian/blob/main/contracts/v0/iclaw-alignment.md"}],"updated":"2026-10-11","acceptance":{"done":6,"total":6},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 6、7 项：<code>ExchangeCodeAsync<\/code> 发送 <code>code_verifier<\/code>、校验 <code>nonce<\/code>、补 refresh / client_credentials / discovery 刷新、会话索引与后通道登出、日志只记 sid 哈希、CSRF、<code>SignInHelper<\/code> DI；三套签发器收敛为网关 <code>S2sTokenIssuer<\/code> 一套并对齐 iClaw S2S claim 契约，<code>exp − iat ≤ 300s<\/code>，约 30 处下游产品字样改为可配置。7.4 / 7.9 的前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：真实 HTTP/RSA 协议夹具验证授权码换取发送 PKCE verifier，篡改 <code>nonce<\/code> 的 id_token 被拒绝；真实 <code>qian-identity<\/code> 联调按已批准的 DEC-015 留在 S1-IDP-002 必过项<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：吊销某用户全部会话后，其任一 sid 的请求返回 401<\/li>\n<li class='chk done'><span class='box'>✓<\/span>代码审查：日志中不出现明文 sid（grep 门禁）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：Qian 代码树中引用废弃签发器即编译告警升错误<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：网关签出的 S2S 令牌通过 iClaw <code>contracts/v0/s2s-jwt-claims<\/code> JSON Schema 校验<\/li>\n<li class='chk done'><span class='box'>✓<\/span>代码审查：<code>Kun.*<\/code> 发布包中 grep 不到下游产品名的默认值<\/li>\n<\/ul>\n<h4>验收证据与阶段边界<\/h4>\n<ul>\n<li>真实 HTTP/RSA 协议夹具已证明 PKCE verifier 发送、nonce 篡改拒绝、state/到期/重放保护。产品负责人于 2026-10-11 批准 DEC-015；本任务按 SDK 阶段验收，真实 Qian 身份服务联调由 S1-IDP-002 的独立必过项承接，不将夹具结果表述为产品联调完成。<\/li>\n<li>已核验上游 [Kun PR #51](https://github.com/idadawn/kun/pull/51) 合并于 <code>ee2f36662e65e7c79b9cbca16f8bdb9ea6123dba<\/code>；Qian 编译门禁 [PR #29](https://github.com/idadawn/qian/pull/29) 合并于 <code>a63a950c4889f73679afc22ea81e2daaa7c216d8<\/code>。<\/li>\n<li>真实 Redis 的原子续期/吊销/索引/重放测试通过；实际 HTTP 验证多会话吊销后均为 401，其他用户仍可访问；写请求缺防跨站令牌在 handler 前拒绝。异常含原始 sid 时，日志仍只有 SHA256 与异常类型。<\/li>\n<li>网关按冻结 contracts/v0/s2s-claims.schema.json 验证五种主体/租户/角色组合，固定 aud/roles 数组、UUID、每跳 audience 和 1–300 秒寿命。旧签发 API 标记 KUNS2S001。<\/li>\n<li>Qian 编译负例引用当前 KunVersion 的真实发布包，两个旧签发器及旧注册方法被 RS0030 拦截，即使关闭一般警告升错仍失败；网关签发器正例通过。全仓 252 项测试和 35 项门禁通过。<\/li>\n<li>本地五个测试包打包和默认值扫描通过；它们未发布到 feed。升级需规范身份投影、Redis 新键空间与重新登录、共享 Data Protection 密钥，详见上游 Identity 客户端指南。<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：refs 加 contracts/v0/s2s-claims.schema.json：iClaw 无 S2S JSON Schema，验收以该文件为准（iclaw-alignment.md 第 2 节）<\/li>\n<li>2026-10-11 cody：开始：KUN-003/007 已进入 review；修复 OIDC、会话与 S2S。真实 qian-identity 联调与 S1-IDP-002 存在反向依赖，保留该验收项，不以替身冒充。<\/li>\n<li>2026-10-11 cody：SDK 实现和独立验收完成；真实 qian-identity 联调与 S1-IDP-002 存在循环，等待 S1-DEC-015 裁决，不冒充真实产品验收。<\/li>\n<li>2026-10-11 cody：上游修复已提交 https://github.com/idadawn/kun/pull/51；源码、迁移说明和验证证据可评审，等待 CI；产品联调口径仍待 S1-DEC-015。<\/li>\n<li>2026-10-11 cody：根据已批准的 DEC-015 解除验收口径阻塞，核验已合并 SDK 修复并办理完成记录。<\/li>\n<li>2026-10-11 cody：完成：依用户批准的 DEC-015 按 SDK 阶段验收；已核验 Kun #51 与 Qian #29 合并，六项 SDK 验收通过。真实身份服务 PKCE/nonce 联调已明确留在 IDP-002，本次不声明发包或产品上线。<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-004.md"},{"id":"S1-KUN-005","title":"Kun 审计路径收敛与数据约定修复","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.11.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.6","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-009-audit.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-009-audit.md"}],"updated":"2026-10-09","acceptance":{"done":5,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 8、9 项：废弃事后不同事务的 <code>AuditSaveChangesInterceptor<\/code>，实体级以同事务 <code>AuditLog<\/code> + Outbox 为准，<code>IAuditChainState<\/code> PostgreSQL 实现、<code>IAuditReader<\/code> EF 实现、<code>AuditActorType<\/code> 增 <code>Agent<\/code>；审计字段自动填充拦截器、<code>CreatedBy<\/code> 可空、<code>xmin<\/code> 并发令牌、snake_case、<code>Guid.CreateVersion7()<\/code> 默认主键。7.6 / 7.11 装配的前提。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：业务事务回滚时 <code>audit_logs<\/code> 无残留行；提交时审计行与业务行同事务可见<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：两个副本并发追加同一租户链，链无分叉（<code>prev_hash<\/code> 严格串联，重放校验通过）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>AuditEntry.ActorType<\/code> 可取 <code>Agent<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：新增实体 <code>created_at/created_by<\/code> 非空，更新时 <code>updated_*<\/code> 刷新、<code>created_*<\/code> 不变<\/li>\n<li class='chk done'><span class='box'>✓<\/span>IT：两个并发更新中一个因 <code>xmin<\/code> 变化抛 <code>DbUpdateConcurrencyException<\/code> 并映射为 <code>Result<\/code> 冲突错误<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-09 cody：开始：核对审计事务、哈希链与数据约定，按逐项验收实现上游修复。<\/li>\n<li>2026-10-09 cody：接续中断工作；同事务审计与双副本链专项通过，修复高并发序列化饥饿后全量集成测试 81 通过、1 项既有 Outbox 跳过留 S1-KUN-002。<\/li>\n<li>2026-10-09 cody：五项验收完成，上游 [Kun PR #45](https://github.com/idadawn/kun/pull/45)；专项 PostgreSQL 测试 10 通过，全量回归通过（3 项既有跳过）；源码尚未发布新包，Qian KunVersion 仍为 2026.10.8。待上游 CI 全绿合并后关闭。<\/li>\n<li>2026-10-09 cody：完成：上游 Kun PR #45 已在 22 项 CI 全绿后合并，Kun main 已同步；五项验收全部完成。当前只关闭上游修复任务，尚未发布新包，Qian 的 KunVersion 仍为 2026.10.8。<\/li>\n<li>2026-10-10 claude：上游 Kun PR #45 已随 Kun 2026.10.9 正式发布（kun#48、tag v2026.10.9），Qian 的 KunVersion 升级与消费由 S1-KUN-009 完成<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-005.md"},{"id":"S1-KUN-006","title":"Kun 配置、鉴权端口、能力目录与废弃 API 修复","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"3d","days":3.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.8","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.5","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-006-authorization-model.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-006-authorization-model.md"}],"updated":"2026-10-09","acceptance":{"done":6,"total":6},"bodyHtml":"<h4>背景<\/h4>\n<p>7.1 第 10–13 项：<code>Kun.Configuration.Apollo<\/code> provider 基础与热更新「校验失败保留旧值并告警」、options JSON Schema 导出；<code>Kun.Authorization<\/code> 只放端口（<code>IPermissionChecker<\/code> / <code>IDataPermissionFilter<\/code> / <code>IFieldPolicy<\/code>）与三处集成；<code>ICapabilityRegistry<\/code> 注册时收 <code>JsonTypeInfo<\/code> 并可枚举；<code>Kun.Infrastructure<\/code> 死接口与旧线 <code>Kun.Storage<\/code> 废弃、<code>AddKunDapper<\/code> 瑕疵、<code>PerformanceBehavior<\/code> 阈值可配。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>IT：发布一份非法配置后 <code>IOptionsMonitor&lt;T&gt;.CurrentValue<\/code> 仍返回上一份有效值，且发出告警指标<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>AddKunOptions&lt;T&gt;<\/code> 可导出 JSON Schema 2020-12<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：未注册实现时任何受保护端点缺省拒绝（fail-closed）；IT：Mediator 行为对标记了所需权限的命令在 handler 前调用 <code>Check<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：注册一个命令后，能力目录中出现其 ID、请求 / 响应 JSON Schema<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：Qian 代码树引用 <code>Kun.Infrastructure.IRepository<\/code> 或旧线 <code>Kun.Storage.IFileStorage<\/code> 即编译错误（Banned API 分析器）<\/li>\n<li class='chk done'><span class='box'>✓<\/span><code>KunExceptionHandler<\/code> 改走 <code>IProblemDetailsService<\/code>，不再直接 <code>WriteAsJsonAsync<\/code> ProblemDetails（contracts/v0/README.md §3.7 过渡态；否则 Kun 产生的错误体不会被 Qian 规范为 ErrorDetail）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-08 claude：验收补一条 KunExceptionHandler 走 IProblemDetailsService（S1-AGT-001 评审发现的尾巴，contracts/v0/README.md §3.7）<\/li>\n<li>2026-10-09 c ionBehavior<\/code> 只有逐命令泛型注册、没有全局开放泛型注册，S1-AZ-001 须自行决定）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-10 claude：创建任务（S1-DEC-013 验收复核发现的缺口）<\/li>\n<li>2026-10-10 claude：开始：kun#48 发版 PR 已开，CI 后打 tag v2026.10.9；随后 Qian 升级 KunVersion<\/li>\n<li>2026-10-10 claude：kun#48 24 项 CI 全绿后合并，v2026.10.9 已打在 merge commit 并由 release.yml 发布到 nuget.org 与 GitHub Packages；发布前用本地打包的 2026.10.9 预验证 Qian：Release 构建 0 警告（补了分析器两处 XML 注释）、243 项测试通过、Banned API 四样例判定不变（负例多报 KUNLEGACY001）、依赖图门禁通过<\/li>\n<li>2026-10-11 someone：四项验收全部勾选，PR 待 CI 合并<\/li>\n<li>2026-10-11 someone：已合并 PR #25；并入 main 后重跑：Release 构建 0 警告、252 项测试通过、门禁 35 项与依赖图 12 个包通过、文档站 658 页检查通过<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-009.md"},{"id":"S1-KUN-010","title":"Kun.EventBus.Abstractions 拆包与 Definition 包的 Kun 依赖门禁","status":"todo","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":2,"priority":"P1","type":"fix","owner":"","estimate":"1d","days":1.0,"depends":["S1-KUN-009"],"blockedBy":[],"order":0,"readyNow":true,"refs":[{"path":"docs/prd/specs/component-model.md#6.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-019-library-first-packages.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-019-library-first-packages.md"},{"path":"docs/adr/ADR-001-kun-relationship.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-001-kun-relationship.md"}],"updated":"2026-10-10","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>组件规格 §6.1 与 ADR-019 D19.2 要求 Definition 包仅依赖 <code>Kun.*.Abstractions<\/code>，但 Kun 的稳定事件标记 <code>IntegrationEventIdAttribute<\/code> 与事件注册端口在 <code>Kun.EventBus<\/code> 包里，没有 <code>.Abstractions<\/code> 拆分，<code>Qian.Identity.Abstractions<\/code> 只能直接引用它，传递带入 StackExchange.Redis 等实现依赖（S1-IDP-001，S1-DEC-013 R64）。<code>scripts/check_deps.py<\/code> 的 <code>role_of()<\/code> 把非 <code>qian.<\/code> 包一律归 external 放行，所以这条规则目前没有门禁；同类现状还有 <code>Qian.Data.Abstractions<\/code> 直接依赖 <code>Kun.EntityFrameworkCore<\/code> / <code>Kun.MultiTenancy.EntityFrameworkCore<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>上游：Kun 拆出 <code>Kun.EventBus.Abstractions<\/code>（<code>IntegrationEventIdAttribute<\/code>、<code>IIntegrationEvent<\/code>、带 <code>JsonTypeInfo<\/code> 的事件注册端口），<code>Kun.EventBus<\/code> 依赖它；随下一次 Kun 发版<\/li>\n<li class='chk'><span class='box'><\/span>Qian：<code>Qian.Identity.Abstractions<\/code> 改引 <code>Kun.EventBus.Abstractions<\/code>，<code>DefinitionReferencesOnlyRuntimeAndFrameworkEventPort<\/code> 的期望值同步，包 README 的延期项移除<\/li>\n<li class='chk'><span class='box'><\/span>门禁：<code>check_deps.py<\/code> 对 <code>definition<\/code> 角色的 Kun 直接依赖只放行 <code>Kun.*.Abstractions<\/code> 与显式白名单（<code>Qian.Data.Abstractions<\/code> 的两项要么迁移要么登记理由），<code>tests/gates<\/code> 加正反例<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-10 claude：创建任务（S1-DEC-013 验收复核发现的偏差）<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-010.md"},{"id":"S1-KUN-011","title":"EF 租户过滤器改用当前 DbContext 上下文，避免跨宿主复用旧访问器","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"1d","days":1.0,"depends":["S1-KUN-001","S1-KUN-009","S1-KUN-012"],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"pm/tasks/S1-RT-004.md","url":"https://github.com/idadawn/qian/blob/main/pm/tasks/S1-RT-004.md"}],"updated":"2026-10-12","acceptance":{"done":4,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>RT-004 的真实 PostgreSQL 多宿主测试复现：正式 Kun 2026.10.12 的全局查询过滤器捕获首个 ITenantContext 实例；相同上下文类型和租户复用 EF 模型后，新宿主会引用旧宿主已退出的租户作用域，SQL 变成 WHERE FALSE，已写入 patch 无法查询或更新。需在 Kun 修复并真实发版，再由 Qian 升级唯一 KunVersion 回验，不能靠共享测试上下文或绕过查询过滤器掩盖。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>Kun：共享模型在不同租户访问器/宿主之间复用时读取当前 DbContext；真实 PostgreSQL 覆盖旧访问器退出及改为其它租户，默认与按租户模型缓存均通过<\/li>\n<li class='chk done'><span class='box'>✓<\/span>Kun：旧访问器入口无法安全绑定当前 DbContext 时明确拒绝，提供 DbContext 重载、迁移说明与回归；全部上游 CI 通过后合并<\/li>\n<li class='chk done'><span class='box'>✓<\/span>发布：按修正后的同日修复规则发布到 nuget.org，Qian 真实还原并核验来源；不以本地项目引用或临时包代替<\/li>\n<li class='chk done'><span class='box'>✓<\/span>Qian：只通过中央 KunVersion 钉定修复版，真实 Data 跨宿主回归从旧版失败转为通过，全仓构建/门禁/测试通过，解除 RT-004 的框架前置<\/li>\n<\/ul>\n<h4>已准备的上游修复<\/h4>\n<p>[Kun PR #54](https://github.com/idadawn/kun/pull/54) 在正式版源码上复现 4/4 失败后修复；最终 8 项真库模型复用回归、13 项相关单元测试及 27 项相关基础设施测试通过。旧 <code>ApplyKunMultiTenantFilters(ITenantContext)<\/code> 标记 KUNTENANT001 并明确拒绝，非 KunDbContext 消费者迁移到接收 DbContext 的重载。Qian 继承 KunDbContext 的路径自动获得修复。<\/p>\n<p>原 <code>2026.10.12-2<\/code> 发布被 nuget.org 以包清单版本无效拒绝，失败标签保留。S1-KUN-012 将同日补丁格式改为 <code>2026.10.12-hotfix.2<\/code>，并在推送前检查实际包及内部依赖；[正式发布](https://github.com/idadawn/kun/actions/runs/38206412089) 已成功。Qian 使用 <code>[KunVersion]<\/code> 精确范围，实际还原出的 13 个 Kun 依赖均为该版本且来自 nuget.org，防止按最低版本范围选回同日基础版。<\/p>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-12 cody：创建任务<\/li>\n<li>2026-10-12 cody：已在注册表真库测试及已发布 v2026.10.12 源码确认旧 ITenantContext 被模型捕获；转 Kun 独立分支修复、真库回归和正式修复版发布。<\/li>\n<li>2026-10-12 cody：Kun PR #54 已在 24 项 CI 全绿后合并（f262ca7），首次唯一失败为 RabbitMQ 容器端口争用，单独重跑通过。v2026.10.12-2 标签已推送，正式发布流水线 38202858511 进行中。Qian 新增两项独立宿主/Data/RLS 回归，在旧 NuGet 2026.10.12 上均实际失败；待正式包可还原后钉版并完成绿测。<\/li>\n<li>2026-10-12 cody：上游源码修复已合并；发布因既有同日数字后缀不兼容 NuGet 而失败。由 S1-KUN-012 修发布链，正式包发布后恢复精确钉版及下游回验。<\/li>\n<li>2026-10-12 cody：正式 hotfix.2 包已从 nuget.org 真实还原；全部 13 个已用 Kun 依赖版本/来源核对通过。两项跨宿主真库回归从旧包 2/2 失败转为 2/2 通过。中央引用与 DocFX 均改为精确版本，文档生成复核实际资产版本；继续全仓验证后交付。<\/li>\n<li>2026-10-12 cody：Kun #54/#55 已合并并正式发布 hotfix.2；Qian 实际还原 13 个 Kun 依赖的版本与 nuget.org 来源均已核验。两项真实受限角色跨宿主回归由旧包失败转为通过，全仓 360 测试零失败零跳过、38 门禁与 16 包依赖检查通过；文档站 66 测试与 667 页完整构建检查通过。中央引用和 DocFX 均使用严格精确版本，并复核实际资产。解除 RT-004 的框架前置，完整 QA-002 仍未完成。<\/li>\n<\/ul>","file":"pm/tasks/S1-KUN-011.md"},{"id":"S1-KUN-012","title":"修复 Kun 同日补丁的 NuGet 版本格式与发布校验","status":"done","stage":"S1","area":"KUN","areaName":"Kun 缺口修复","wave":1,"priority":"P0","type":"fix","owner":"cody","estimate":"1d","days":1.0,"depends":[],"blockedBy":[],"order":-1,"readyNow":false,"refs":[{"path":"pm/ta tion.md"},{"path":"docs/adr/ADR-015-model-gateway.md","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-015-model-gateway.md"},{"path":"docs/migration/README.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>组件 <code>qian.model-gateway<\/code>（<code>runtime.form: service<\/code>，<code>Qian.ModelGateway.Abstractions<\/code> / <code>ctx.ModelGateway<\/code> + <code>Qian.ModelGateway<\/code>，<code>model-gateway<\/code> 组合包默认挂 <code>platform<\/code>、可选独立 profile）：GPUStack <code>/v1/models<\/code> 发现、健康探测、上下线；<code>model-capabilities<\/code> / <code>model-governance<\/code> 契约（直接用 iClaw 的）；逻辑模型目录（<code>chat-default<\/code>、<code>embedding-default<\/code> 用途槽位）；<code>GET /api/models<\/code>、<code>GET /api/models/{id}/health<\/code>、<code>POST /api/models:sync<\/code>；<code>IModelCatalog<\/code>、<code>qian.model-gateway.provider/v1<\/code> 扩展点、事件 <code>model.catalog.changed.v1<\/code>；密钥 secretRef。范围先 LLM + Embedding（Q17），GPU 归属待拍板，可独立延期。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>UT：目录条目通过 <code>model-capabilities<\/code> JSON Schema 校验<\/li>\n<li class='chk'><span class='box'><\/span>E2E：GPUStack 新增一个模型后 <code>models:sync<\/code> 使其出现在目录；下线后健康状态变更<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>models:sync<\/code> 标 <code>external<\/code> + <code>confirm<\/code>，目录查询 <code>read<\/code>；供应商密钥只以 secretRef 出现<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-MGW-001.md"},{"id":"S1-MGW-002","title":"Higress 控制面接线：上游入 git、租户 consumer、计量","status":"todo","stage":"S1","area":"MGW","areaName":"模型网关","wave":4,"priority":"P1","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-MGW-001","S1-AUD-004","S1-DEP-005"],"blockedBy":["S1-MGW-001","S1-AUD-004","S1-DEP-005"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.16","url":"ht fy.Abstractions<\/code> / <code>ctx.Notify<\/code> + <code>Qian.Notify<\/code>）：消息类型由清单 <code>contributes: qian.notify.message-type/v1<\/code> 注册（编码、参数 Schema、模板变量、落地深链）；<code>message_types<\/code> / <code>notify_templates<\/code>（每模板一渠道、<code>{@字段}<\/code>）/ <code>send_configs<\/code> / <code>send_config_templates<\/code> / <code>receive_configs<\/code>（admin 默认 / 锁定）/ <code>channel_accounts<\/code>（配置 + <code>secretRef<\/code>）；<code>INotifier.SendAsync(configCode, recipients, params, idempotencyKey)<\/code>；<code>INotificationChannel<\/code> typed port；判定链（场景未开启不生成 → 接收配置过滤 → 模板必须启用 → 被引用模板不可删）；<code>GET /api/notify/send-configs<\/code>、<code>POST /send-configs/{code}:validate<\/code>、<code>POST /api/notify/send<\/code>；收件人寻址经 7.4.3 目录。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：同一 <code>idempotencyKey<\/code> 的两次 <code>send<\/code> 只产生一次投递<\/li>\n<li class='chk'><span class='box'><\/span>IT：删除被发送配置引用的模板返回结构化错误；渠道账号详情接口不含明文密钥<\/li>\n<li class='chk'><span class='box'><\/span>UT：<code>GET /api/notify/send-configs<\/code> 返回每个配置的参数 JSON Schema；<code>:validate<\/code> 对缺参返回带 JSON Pointer 的错误<\/li>\n<li class='chk'><span class='box'><\/span>UT：收件人在接收配置里关闭某渠道时该渠道记录被跳过；全部过滤则不生成监控<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-NTF-001.md"},{"id":"S1-NTF-002","title":"异步投递、监控与收件人记录、按收件人定向重试","status":"todo","stage":"S1","area":"NTF","areaName":"消息通知","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"3d","days":3.0,"depends":["S1-NTF-001","S1-EVT-001","S1-SCH-001"],"blockedBy":["S1-NTF-001","S1-EVT-001","S1-SCH-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.12","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.13.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":3},"bodyHtml":"<h4>背景<\/h4>\n<p>真正异步投递（队列 + <code>sending<\/code> 态）；<code>notify_monitors<\/code>（<code>sending | succeeded | failed | partial<\/code>、重试载荷）与 <code>notify_records<\/code>（每收件人：状态、尝试次数、最后错误）；失败按收件人定向重试（默认 3 次，1–5，经 7.13 延时）；<code>GET /api/notify/monitors<\/code>、<code>POST /monitors/{id}:retry<\/code> 只重发失败收件人；事件 <code>notify.sent / notify.failed / notify.read.v1<\/code>。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><span class='box'><\/span>IT：调用 <code>notify.send<\/code> 给 3 个收件人（其中 1 人关闭了邮件渠道），生成 1 条监控、2 条邮件记录 + 3 条站内信记录；监控先为 <code>sending<\/code> 再终态<\/li>\n<li class='chk'><span class='box'><\/span>IT：SMTP 账号故障时 2 条邮件记录失败，监控 <code>partial<\/code>；修复后 <code>retry<\/code> 只重发这 2 人，不重复发站内信<\/li>\n<li class='chk'><span class='box'><\/span>IT：重试达到上限后记录终态 <code>failed<\/code> 并发 <code>notify.failed.v1<\/code><\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-NTF-002.md"},{"id":"S1-NTF-003","title":"渠道组件 inbox / smtp / sms 与系统预置模板","status":"todo","stage":"S1","area":"NTF","areaName":"消息通知","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-NTF-001","S1-CFG-002","S1-RT-002"],"blockedBy":["S1-NTF-001"],"order":5,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.12","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.4.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/migration/README.md#8","url":"https://github.com/idadawn/qian/blob/main/docs/migration/README.md"}],"updated":"2026-10-06","acceptance":{"done":0,"total":4},"bodyHtml":"<h4>背景<\/h4>\n<p>三个独立组件 <code>qian.notify.channel.inbox / .smtp / .sms<\/code>（<code>Qian.Notify.Channel.Inbox<\/code> / <code>.Email<\/code> / <code>.Sms<\/code>，只依赖 <code>Qian.Notify.Abstractions<\/code>）：站内信（<code>inbox_messages<\/code>、已读 / 回执 / 深链、<code>GET /api/notify/inbox<\/code>、<code>POST /inbox/{id}:read<\/code>，有实时通道时推角标、否则 ":"https://github.com/idadawn/qian/blob/main/docs/prd/specs/component-model.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"},{"path":"docs/ROADMAP.md","url":"https://github.com/idadawn/qian/blob/main/docs/ROADMAP.md"}],"updated":"2026-10-08","acceptance":{"done":7,"total":7},"bodyHtml":"<h4>背景<\/h4>\n<p>ADR-020 D20.1–D20.5 的 .NET 落地：按规格 §5.2 实现 <code>IQianPlugin { Inject; ApplyAsync }<\/code>、<code>IPluginContext<\/code>（<code>Inject / TryInject / WhenReadyAsync / Provide / On / DispatchAsync / Effect / Scoped / Restrict / List<\/code>）、按 <code>inject[]<\/code> / <code>provides[]<\/code> 拓扑排序的装载器、可逆副作用逆序撤销、scope 两层扁平（<code>tenant:<\/code> / <code>app:<\/code> / <code>agent-session:<\/code>）与遮蔽 / <code>restrict<\/code> 交集。组件库唯一必需依赖，一切组件任务的前置，第 1 波首项。仅实现 .NET 侧；语言无关场景位于 <code>tck/runtime/<\/code>，TS harness 与完整套件由 S1-RT-003 / S1-QA-002 接续。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk done'><span class='box'>✓<\/span>TCK：<code>Inject<\/code> 的服务键无人提供 → 启动失败并指出缺失键与请求方；依赖成环 → 结构化错误列出环路<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：<code>Apply<\/code> 中注册的全部 effect 在卸载时按逆序撤销，卸载后服务容器中无残留<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：五种分发模式各一组用例——<code>waterfall<\/code> 监听器不调用 <code>next()<\/code> 时下游不执行；<code>bail<\/code> 停在首个返回值；<code>parallel<\/code> 任一失败不影响其余<\/li>\n<li class='chk done'><span class='box'>✓<\/span>TCK：租户 A scope 注册同名服务后，A 内解析到遮蔽项，B 与全局不受影响；两条 restriction 的交集生效；被过滤项在目录与执行两处都「不存在」<\/li>\n<li class='chk done'><span class='box'>✓<\/span>UT：<code>Qian.Runtime<\/code> 只依赖 <code>Kun.Core<\/code>、<code>Kun.Mediator<\/code>、.NET DI 与已有的 <code>Qian.Runtime.Errors<\/code>，无业务语义；不引用 <code>Kun.Validation<\/code><\/li>\n<li class='chk done'><span class='box'>✓<\/span><code>Kun.*<\/code> 的 PackageVersion 一律引用 <code>$(KunVersion)<\/code>（属性若尚不存在则在本任务加入），<code>NuGet.config<\/code> 用 packageSourceMapping 把 <code>Kun.*<\/code> 映射到 nuget.org；Kun 正式版从 nuget.org 还原，只有需要 Kun 预发布版时才加 GitHub Packages 源（ADR-021 D21.3）<\/li>\n<li class='chk done'><span class='box'>✓<\/span>Kun <code>Error<\/code> → <code>QianError<\/code> 放在 <code>Qian.Runtime<\/code>，<code>ValidationException.Errors<\/code> → <code>errors[]<\/code> 放在 <code>Qian.Runtime.Errors.AspNetCore<\/code>（只有它引用 <code>Kun.Validation<\/code>）；保持 ErrorDetail 封闭，按平台内置码映射（contracts/v0/README.md §3.7 / R48），上游 KunExceptionHandler 修正由 S1-KUN-006 负责<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<li>2026-10-07 claude：验收补一条 <code>KunVersion<\/code> 单点钉版（ADR-021 D21.3）<\/li>\n<li>2026-10-08 claude：验收补一条 Kun 错误桥接（随首个引用 Kun.* 包的任务，contracts/v0/README.md §3.7）<\/li>\n<li>2026-10-08 someone：开始<\/li>\n<li>2026-10-08 someone：装载器与 Inject 已实现：T01、T02 与缺失键 YAML 场景通过；启动错误使用 qian.runtime 内置码，已按 QIAN_UPDATE_CONTRACTS=1 更新目录。<\/li>\n<li>2026-10-08 someone：Effect 同步/异步逆序撤销、失败回滚、级联卸载与恢复已覆盖；手动撤销可用 WhenIdleAsync 等待异步清理。<\/li>\n<li>2026-10-08 someone：五种分发及其异常/顺序语义已实现：T05–T11 YAML 场景、真实并发、空结果与事件重名测试通过。<\/li>\n<li>2026-10-08 someone：scope 遮蔽、restriction 交集、目录/执行不可区分、无继承、跨 scope 事件与具名 seam 已通过；含依赖重绑定共 29 个运行时测试。<\/li>\n<li>2026-10-08 someone：Kun.Core / Kun.Mediator 2026.9.13 已在 nuget.org 正式发布，ubuntu-latest 无 GitHub Packages 凭据，因此按任务指示改为正式版映射到 nuget.org，仅预发布版才另加 GitHub 源；复用 main 的 KunVersion。两处错误桥接与依赖边界测试通过，全新缓存还原成功。<\/li>\n<li>2026-10-08 someone：本地验收：构建零警告零错误，依赖图通过，19 个门禁自测通过，整套 .NET 219 个测试通过且零跳过（Runtime 41、Errors 157、容器 21）。本机 127.0.0.1 被其它 HTTP 路径拦截，容器测试指定 TESTCONTAINERS_HOST_OVERRIDE=localhost 并设置回环 NO_PROXY 后通过；未改夹具。补充异步 Apply 取消回滚、类型化配置、restriction 异常隔离与 Pending 诊断。<\/li>\n<li>2026-10-08 someone：完成 .NET 最小运行时、19 个语言无关场景、Kun 错误桥接与 nuget.org 包源，七项验收全部通过，提交 PR 评审。<\/li>\n<li>2026-10-08 claude：PR #5 已由产品负责人合并（5788415，2026-10-08 04:16Z）。复核：main 上构建零警告、Runtime 41 + Errors 157 + 容器 21 = 219 测试通过，check_deps / check_docs / pm validate 与门禁自测通过；Contracts.cs 与规格 §5.2 对齐，T01–T14、T21、T22、T24 场景文件就位，Kun.* 钉 $(KunVersion) 且映射 nuget.org。备注：Qian.Runtime.csproj 引用 Kun.Mediator 但源码尚未使用（ <code>Install<\/code> 失败；信任根轮换后旧签名在重叠期内有效<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>Mount(scope, entry)<\/code> 写入 <code>scope_patches<\/code> 并发出 <code>registry.scope.mounted.v1<\/code>；<code>Unmount<\/code> 后 ≤ 5s 三处拦截恢复，不改数据库开关<\/li>\n<li class='chk'><span class='box'><\/span>IT：<code>GitOps<\/code> 执行器为 <code>runtime.form: service<\/code> 组件生成 Kustomize 片段并以 K8s 状态 + <code>/health<\/code> 双条件回写注册表（Local 执行器在开发态等价）<\/li>\n<\/ul>\n<h4>进度日志<\/h4>\n<ul>\n<li>2026-10-06 planner：创建任务<\/li>\n<\/ul>","file":"pm/tasks/S1-RT-005.md"},{"id":"S1-RT-006","title":"qian.capabilities 插件：能力目录、契约仓库与聚合","status":"todo","stage":"S1","area":"RT","areaName":"运行时 / CLI / 市场","wave":2,"priority":"P0","type":"feature","owner":"","estimate":"5d","days":5.0,"depends":["S1-RT-004","S1-KUN-006","S1-AZ-003","S1-KUN-009"],"blockedBy":["S1-RT-004","S1-AZ-003"],"order":3,"readyNow":false,"refs":[{"path":"docs/prd/07-s1-foundation.md#7.2.1","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/prd/07-s1-foundation.md#7.18","url":"https://github.com/idadawn/qian/blob/main/docs/prd/07-s1-foundation.md"},{"path":"docs/adr/ADR-020-component-model-v2.md#2","url":"https://github.com/idadawn/qian/blob/main/docs/adr/ADR-020-component-model-v2.md"}],"updated":"2026-10-10","acceptance":{"done":0,"total":5},"bodyHtml":"<h4>背景<\/h4>\n<p>平台插件 <code>Qian.Capabilities<\/code>（<code>ctx.Capabilities<\/code>）：<code>ICapabilityRegistry<\/code> 收 <code>JsonTypeInfo<\/code> 生成请求 / 响应 Schema；<code>GET /api/capabilities?kind=&amp;q=<\/code> 按权限与 scope restrict 过滤（<code>ttlMs<\/code>、<code>cacheScope: private<\/code>）；<code>GET /api/capabilities/openapi.json<\/code> 聚合 OpenAPI 3.1；<code>IExtensionPointRegistry<\/code> / <code>IContractRepository<\/code>（<code>.proto<\/code> / OpenAPI 契约包带 <code>/vN<\/code>，挂载前契约一致性探测）；菜单由清单贡献 + URN 目录 + 用户偏好（<code>qian.navigation<\/code> 逻辑名）；<code>/api/kernel/capabilities<\/code> 别名。<\/p>\n<h4>验收<\/h4>\n<ul>\n<li class='chk'><sp
