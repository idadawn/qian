- id: gateway
  plugin: qian.gateway
  config:
    identityIssuer: https://id.example.internal/
    identityAudience: https://gateway.example.internal
    issuer: https://gateway.example.internal/s2s
    signingKeyPath: /var/run/secrets/qian/gateway/private.pem
    publicKeyPath: /var/run/secrets/qian/gateway/public.pem
    trustedProxyNetworks: []
    routes:
    - id: platform
      path: /api/{**rest}
      cluster: qian-platform
      rateLimiterPolicy: tenant
    clusters:
    - id: qian-platform
      address: http://qian-platform:8080/
- id: identity
  plugin: qian.identity.client
  config:
    issuer: https://id.example.internal
    clientId: qian-gateway
    clientSecret: secretRef://platform/identity/client-secret
- id: config
  plugin: qian.config.apollo
  config:
    meta: http://apollo-config.apollo:8080
    appId: qian-gateway
    namespaces:
    - application
    - qian.common.trust
- id: observability
  plugin: qian.observability
  config:
    otlp: http://otel-collector.observability:4317
- id: audit
  plugin: qian.audit.native
  config:
    tenantBinding: audit_tenant
    platformBinding: audit_platform
    tenantRole: qian_gateway_audit_tenant
    platformRole: qian_gateway_audit_platform
    functionOwner: qian_gateway_audit_writer
    maxAttempts: 6
- id: data
  plugin: qian.data.native
  config:
    connections:
    - audit_tenant
    - audit_platform
