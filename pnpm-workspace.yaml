# pnpm 工作区：文档站 website/、Qian 的 Node 包 packages/qian-*、yue 前端包 packages/yue/*（@idadawn/yue-<目录名>，S1-YUE-003）、前端应用 apps/*。
packages:
  - website
  - packages/qian-*
  - packages/yue/*
  - apps/*

# 允许跑 postinstall 的依赖（pnpm 12 默认拒绝未审核的构建脚本）：unrs-resolver 只在预编译二进制缺失时才编译。
allowBuilds:
  unrs-resolver: true

# 版本目录：前端依赖只在这里钉一次，各包的 package.json 写 "catalog:"。版本矩阵页从这里读 @idadawn/yue-* 的工作区包。
# typescript 钉 6.0.x：typescript-eslint 8 只支持 < 6.1。
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@types/node": ^24.0.0
  typescript: ~6.0.3
  "@base-ui/react": 1.8.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  "@rslib/core": ^1.0.3
  vitest: ^5.0.3
  "@vitest/browser": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  playwright: ^1.64.0
  "@playwright/test": ^1.64.0
  "@axe-core/playwright": ^4.13.0
  axe-core: ^4.11.0
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  publint: ^0.3.25

minimumReleaseAgeExclude:
  - "@playwright/test@1.64.0"
  - playwright-core@1.64.0
  - playwright@1.64.0
  - vite@8.3.4
