name: docs-site

# 文档站（S1-DOCS-001）：PR 构建并发布预览到 /pr-preview/pr-<n>/，合并到 main 后发布正式站点。
# 构建产物推到 docs-site 分支，K3s 上的 git-sync + nginx 提供访问（deploy/docs-site/README.md）。
# 「Kun 框架」小节与 Kun API 参考（S1-DOCS-005，docs-site.md §2b）：按 Directory.Packages.props 的 KunVersion
# 检出私有 kun 仓库的 tag（只读 deploy key 存在 Secret KUN_DOCS_DEPLOY_KEY），DocFX 需要 .NET SDK。

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "website/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deploy/docs-site/**"
      - "Directory.Packages.props"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deploy/docs-site/**"
      - "Directory.Packages.props"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # 访问入口：WireGuard 侧经节点别名的固定 NodePort、公司内网的 MetalLB 地址（deploy/docs-site/service.yaml）
  DOCS_ORIGIN_WG: http://10.78.1.161:30820
  DOCS_ORIGIN_LAN: http://192.168.1.211

jobs:
  build:
    name: 构建与检查
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.pull_request.number) || '/' }}
      KUN_DOCS_PATH: ${{ github.workspace }}/.kun
    steps:
      - uses: actions/checkout@v4

      - name: 读 KunVersion
        id: kun
        run: |
          version="$(sed -n 's:.*<KunVersion>\(.*\)</KunVersion>.*:\1:p' Directory.Packages.props | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Directory.Packages.props::缺少 <KunVersion>：Kun 小节按它镜像，不回退 main（docs-site.md §2b.1）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 检查 kun 仓库只读凭据
        env:
          KEY: ${{ secrets.KUN_DOCS_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::拿不到 Secret KUN_DOCS_DEPLOY_KEY（对 idadawn/kun 只读的 deploy key 私钥）。fork 来的 PR 与 Dependabot 拿不到本仓库的 Actions Secret，文档站只在本仓库的分支上构建（R60）；本仓库缺这个 Secret 时按 website/README.md §6 配置"
            exit 1
          fi

      # 全部历史：镜像页的 updated 取源文件在该 tag 上的最后提交日期
      - name: 检出 kun 仓库 v${{ steps.kun.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: idadawn/kun
          ref: v${{ steps.kun.outputs.version }}
          path: .kun
          fetch-depth: 0
          ssh-key: ${{ secrets.KUN_DOCS_DEPLOY_KEY }}
          persist-credentials: false

      # DocFX 从 Kun.* 包生成 API 参考（website/.config/dotnet-tools.json 锁定 docfx 版本）
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-docs-${{ runner.os }}-${{ steps.kun.outputs.version }}-${{ hashFiles('website/.config/dotnet-tools.json') }}
          restore-keys: nuget-docs-${{ runner.os }}-

      # 先装 Node 24 再装 pnpm：pnpm 版本取自根目录 package.json 的 packageManager，它本身要求较新的 Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm --filter website typecheck

      - name: 生成器单测
        run: pnpm --filter website test

      - name: 构建站点（含断链检查）
        run: pnpm --filter website build

      - name: 产物检查（离线、前缀、搜索索引、代码高亮、Kun 版本）
        run: pnpm --filter website check

      # Kun 镜像页与 API 参考的源不在本仓库，生成后单独过文档门禁（禁用词、表格、断链）
      - name: 生成页过文档门禁（frontmatter、禁用词、链接；源不在本仓库的 Kun 页也在内）
        run: python3 scripts/check_docs.py website/docs/components website/docs/cli website/docs/design website/docs/sdk/kun website/docs/sdk/api website/docs/start/versions.md

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/doc_build
          retention-days: 7

  publish:
    name: 发布
    needs: build
    # fork 来的 PR 拿不到写权限，只构建不发布；手动触发只允许在 main 上发布正式站点
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - name: 推送到 docs-site 分支
        id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
          DOCS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then
            deploy/docs-site/publish.sh preview "$PR" "$RUNNER_TEMP/docs-site"
            echo "path=/pr-preview/pr-$PR/" >> "$GITHUB_OUTPUT"
          else
            deploy/docs-site/publish.sh main "$RUNNER_TEMP/docs-site"
            echo "path=/" >> "$GITHUB_OUTPUT"
          fi

      - name: 记录访问地址
        env:
          SITE_PATH: ${{ steps.publish.outputs.path }}
        run: |
          {
            echo "### 文档站已发布"
            echo ""
            echo "- WireGuard：$DOCS_ORIGIN_WG$SITE_PATH"
            echo "- 公司内网：$DOCS_ORIGIN_LAN$SITE_PATH"
            echo ""
            echo "git-sync 每 60 秒拉取一次 docs-site 分支，推送后约一分钟可见。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 在 PR 里留预览链接
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SITE_PATH: ${{ steps.publish.outputs.path }}
        run: |
          body="$(printf '%s\n' \
            "📖 **文档站预览**（提交 \`${HEAD_SHA:0:7}\`，约一分钟后可访问）" \
            "" \
            "- WireGuard：$DOCS_ORIGIN_WG$SITE_PATH" \
            "- 公司内网：$DOCS_ORIGIN_LAN$SITE_PATH" \
            "" \
            "每次推送更新这条评论；PR 关闭后预览自动删除。")"
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"

  remove-preview:
    name: 删除预览
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 从 docs-site 分支删除 pr-preview/pr-<n>/
        env:
          PR: ${{ github.event.pull_request.number }}
        run: deploy/docs-site/publish.sh remove "$PR"
