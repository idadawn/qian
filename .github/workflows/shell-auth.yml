name: shell-auth
# 外壳认证真实流程验收（S1-YUE-002 验收 1 / 3 / 4）：在托管 runner 上原样执行 pnpm yue:auth ——
# scripts/dev-shell.sh 拉起真实 qian.identity（Docker PostgreSQL 16、内置账号模型、真实 qian.tenancy 开通编排）、上游 CNCF Dex（通用 OIDC 连接器 dex）
# 与 Identity.Client / Qian.Gateway BFF，Playwright 走完整浏览器流程（OIDC code + PKCE 登录、多租户选择、prompt=select_account 切换、刷新合并与过期对话框、
# 刷新成功但平台表面持续 401、零令牌检查、运行时配置；平台身份 operator 不拉租户目录；SSO 跳转回调经 Dex 首次确认绑定、再次直接进入）。
# 失败时宿主、PostgreSQL 与 Dex 的日志复制进 TestResults/shell-auth/logs，随 Playwright 产物一起上传。
# 宿主装配跟随后端包与参考宿主，所以它们改动时也要重跑；只改文档与任务文件不运行。与 yue 门禁矩阵并行，不进 yue:gates。
on:
  push:
    branches: [main]
    paths: ['apps/qian-shell-auth/**', 'packages/qian-identity-ui/**', 'packages/yue/**', 'packages/Qian.*/**', 'packages/Common/**', 'samples/Qian.Sample.Crm/**', 'plugins/**', 'schemas/**', 'contracts/**', 'tools/Qian.Dev.Shell/**', 'tools/Qian.Dev.TenantOps/**', 'tools/Qian.Build.Analyzers/**', 'scripts/dev-shell.sh', 'Directory.*.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'BannedSymbols.txt', '.editorconfig', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/shell-auth.yml']
  pull_request:
    paths: ['apps/qian-shell-auth/**', 'packages/qian-identity-ui/**', 'packages/yue/**', 'packages/Qian.*/**', 'packages/Common/**', 'samples/Qian.Sample.Crm/**', 'plugins/**', 'schemas/**', 'contracts/**', 'tools/Qian.Dev.Shell/**', 'tools/Qian.Dev.TenantOps/**', 'tools/Qian.Build.Analyzers/**', 'scripts/dev-shell.sh', 'Directory.*.props', 'Directory.Build.targets', 'global.json', 'NuGet.config', 'BannedSymbols.txt', '.editorconfig', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/shell-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-auth-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
jobs:
  acceptance:
    name: 外壳认证真实流程验收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter qian-shell-auth exec playwright install --with-deps chromium
      - run: pnpm --filter @qian/identity-ui typecheck && pnpm --filter qian-shell-auth typecheck
      - name: 真实流程验收（与本机 scripts/dev-shell.sh e2e 同一入口）
        run: pnpm yue:auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-auth-acceptance
          path: TestResults/shell-auth/
          if-no-files-found: ignore
