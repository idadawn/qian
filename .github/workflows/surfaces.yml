name: surfaces
on:
  push:
    branches: [main]
    paths: ['packages/Qian.Surfaces*/**', 'packages/Qian.Runtime/**', 'packages/qian-surfaces/**', 'schemas/v2/**', 'tck/surfaces/**', 'contracts/v0/**', 'tests/Qian.Surfaces.Tests/**', 'scripts/generate_surface_fixtures.py', 'pnpm*', '*.props', '*.targets', 'Qian.slnx', '.github/workflows/surfaces.yml']
  pull_request:
    paths: ['packages/Qian.Surfaces*/**', 'packages/Qian.Runtime/**', 'packages/qian-surfaces/**', 'schemas/v2/**', 'tck/surfaces/**', 'contracts/v0/**', 'tests/Qian.Surfaces.Tests/**', 'scripts/generate_surface_fixtures.py', 'pnpm*', '*.props', '*.targets', 'Qian.slnx', '.github/workflows/surfaces.yml']
permissions:
  contents: read
concurrency:
  group: surfaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    name: 声明式表面双侧一致性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - name: 共用样例新鲜度
        run: |
          python3 scripts/generate_surface_fixtures.py
          git diff --exit-code -- tck/surfaces
      - run: pnpm --filter @qian/surfaces build
      - run: pnpm --filter @qian/surfaces check:api
      - name: TypeScript 样例与 JCS
        run: QIAN_SURFACE_REPORT="$GITHUB_WORKSPACE/TestResults/surfaces-ts.json" pnpm --filter @qian/surfaces test
      - name: .NET 样例、JCS 与 scope/effect
        run: QIAN_SURFACE_REPORT="$GITHUB_WORKSPACE/TestResults/surfaces-dotnet.json" dotnet run --project tests/Qian.Surfaces.Tests -c Release
      - name: 精确比较诊断
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/surfaces-dotnet.json TestResults/surfaces-ts.json
