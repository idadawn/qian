name: surfaces
on:
  push:
    branches: [main]
    paths: ['packages/Qian.Surfaces*/**', 'packages/Qian.Runtime/**', 'packages/qian-surfaces/**', 'packages/Qian.Profiles*/**', 'packages/qian-cli/**', 'profiles/**', 'plugins/**', 'tck/profiles/**', 'tck/registry-artifacts/**', 'tests/Qian.Profiles.Tests/**', 'package.json', 'schemas/v2/**', 'tck/surfaces/**', 'tck/runtime/hotreload.json', 'tck/runtime/skill-only.json', 'packages/qian-runtime/**', 'tck/marketplaces/**', 'contracts/v0/**', 'tests/Qian.Surfaces.Tests/**', 'scripts/generate_surface_fixtures.py', 'packages/Common/**', 'pnpm*', '*.props', '*.targets', 'Qian.slnx', '.github/workflows/surfaces.yml']
  pull_request:
    paths: ['packages/Qian.Surfaces*/**', 'packages/Qian.Runtime/**', 'packages/qian-surfaces/**', 'packages/Qian.Profiles*/**', 'packages/qian-cli/**', 'profiles/**', 'plugins/**', 'tck/profiles/**', 'tck/registry-artifacts/**', 'tests/Qian.Profiles.Tests/**', 'package.json', 'schemas/v2/**', 'tck/surfaces/**', 'tck/runtime/hotreload.json', 'tck/runtime/skill-only.json', 'packages/qian-runtime/**', 'tck/marketplaces/**', 'contracts/v0/**', 'tests/Qian.Surfaces.Tests/**', 'scripts/generate_surface_fixtures.py', 'packages/Common/**', 'pnpm*', '*.props', '*.targets', 'Qian.slnx', '.github/workflows/surfaces.yml']
permissions:
  contents: read
concurrency:
  group: surfaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    name: 声明式表面双侧一致性
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - name: 共用样例新鲜度
        run: |
          python3 scripts/generate_surface_fixtures.py
          git diff --exit-code -- tck/surfaces
      - run: pnpm --filter ./packages/qian-runtime build
      - run: pnpm --filter @qian/surfaces build
      - run: pnpm --filter @qian/surfaces check:api
      - name: TypeScript 样例与 JCS
        run: QIAN_HOT_RELOAD_REPORT="$GITHUB_WORKSPACE/TestResults/hotreload-ts.json" QIAN_SURFACE_REPORT="$GITHUB_WORKSPACE/TestResults/surfaces-ts.json" QIAN_MARKET_REPORT="$GITHUB_WORKSPACE/TestResults/markets-ts.json" pnpm --filter @qian/surfaces test
      - name: .NET 样例、JCS 与 scope/effect
        run: QIAN_HOT_RELOAD_REPORT="$GITHUB_WORKSPACE/TestResults/hotreload-dotnet.json" QIAN_SURFACE_REPORT="$GITHUB_WORKSPACE/TestResults/surfaces-dotnet.json" QIAN_MARKET_REPORT="$GITHUB_WORKSPACE/TestResults/markets-dotnet.json" dotnet run --project tests/Qian.Surfaces.Tests -c Release
      - name: 精确比较自动热重载场景
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/hotreload-dotnet.json TestResults/hotreload-ts.json
      - name: 精确比较诊断
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/surfaces-dotnet.json TestResults/surfaces-ts.json
      - name: 精确比较市场文件规则
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/markets-dotnet.json TestResults/markets-ts.json
      - name: profile CLI 构建与验收
        run: |
          pnpm --filter qian... build
          QIAN_SKILL_ONLY_REPORT="$GITHUB_WORKSPACE/TestResults/skill-only-ts.json" QIAN_PROFILE_REPORT="$GITHUB_WORKSPACE/TestResults/profiles-ts.json" pnpm --filter qian test
      - name: profile .NET 装配与真实 Runtime 装载
        run: QIAN_SKILL_ONLY_REPORT="$GITHUB_WORKSPACE/TestResults/skill-only-dotnet.json" QIAN_PROFILE_REPORT="$GITHUB_WORKSPACE/TestResults/profiles-dotnet.json" dotnet run --project tests/Qian.Profiles.Tests -c Release
      - name: 精确比较 minimal 无代码技能与隔离
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/skill-only-dotnet.json TestResults/skill-only-ts.json
      - name: 精确比较 profile 来源、配置和诊断
        run: node packages/qian-surfaces/scripts/compare-fixtures.mjs TestResults/profiles-dotnet.json TestResults/profiles-ts.json

  private-feed:
    name: 私有源已发布组件的 qian add E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只读私有 NuGet 源（GitHub Packages）；令牌经环境变量传给 NuGet.Config 的 %QIAN_FEED_TOKEN% 引用，不写进文件。
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - name: 构建 CLI
        run: pnpm --filter qian... build
      - name: 空白宿主经签名市场安装 data / events / config，运行 Provider 后逆序卸载
        env:
          QIAN_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter qian test:feed
