name: runtime-ts-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 已合并 main 的固定包版本
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: runtime-ts-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@idadawn'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qian/surfaces build && pnpm --filter qian build
      - run: pnpm --filter ./packages/qian-runtime build
      - run: pnpm --filter ./packages/qian-runtime check:api && pnpm --filter ./packages/qian-runtime test:types && pnpm --filter ./packages/qian-runtime test
      - name: 打包并在干净项目验证制品
        run: |
          mkdir -p "$RUNNER_TEMP/qian-runtime"
          pnpm --filter ./packages/qian-runtime pack --pack-destination "$RUNNER_TEMP/qian-runtime"
          node packages/qian-runtime/scripts/verify-consumer.mjs "file:$RUNNER_TEMP/qian-runtime/idadawn-qian-runtime-$(node -p 'require("./packages/qian-runtime/package.json").version').tgz"
      - name: 私有发布并核对摘要与可见性
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/qian-runtime/scripts/publish.mjs
      - name: 从私有源安装并验证逻辑别名和类型
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/qian-runtime/scripts/verify-consumer.mjs "npm:@idadawn/qian-runtime@$RELEASE_VERSION"
