name: dotnet

# .NET 构建、门禁与测试（S1-QA-001）：PublicAPI 门禁、依赖图门禁、门禁自测、单元与 Testcontainers 集成测试；
# 另有并行的身份依赖方组件 NativeAOT 冒烟（S1-IDP-014）。
# PRD §14.2.1 要求 PR 级门禁 ≤ 20 分钟。仓库暂无自托管 runner，先用 GitHub 托管的 ubuntu-latest（自带 Docker）。

on:
  push:
    branches: [main]
  pull_request:
    # 只改任务文件、设计文档或根目录 Markdown 的 PR 不跑本工作流，合并时按「未触发」处理。
    # docs/generated 由 Qian.Docs.Tests 比对；测试读取的其他文档也要在这里重新纳入（「触发过滤自检」一步核对）。
    # push 到 main 不过滤：dotnet-release.yml 要求发布提交本身有通过的 push 运行。
    paths:
      - '**'
      - '!pm/**'
      - '!docs/**'
      - '!*.md'
      - 'docs/generated/**'
      - 'docs/ops/configuration-runbook.md'

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: 构建、门禁与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 后台顺序预拉测试镜像（与还原、构建、门禁并行，记录在 RUNNER_TEMP/prefetch）
        run: |
          mkdir -p "$RUNNER_TEMP/prefetch"
          setsid nohup python3 scripts/dotnet_ci.py prefetch --state "$RUNNER_TEMP/prefetch" \
            > "$RUNNER_TEMP/prefetch/output.log" 2>&1 < /dev/null &

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: 构建真实 doctor 客户端供宿主验收
        run: pnpm install --frozen-lockfile && pnpm --filter qian... build

      - name: 还原
        run: dotnet restore Qian.slnx

      - name: 构建（PublicAPI 门禁：Qian 包未登记的公共 API 即编译失败）
        run: dotnet build Qian.slnx -c Release --no-restore

      - name: 动态发现全部代码入口并校验唯一清单与实现构件分类
        run: python3 scripts/check_plugin_manifests.py

      - name: 仓库 profile 生效配置的明文密钥扫描（S1-CFG-002）
        run: dotnet tools/Qian.Secrets.Tool/bin/Release/net10.0/Qian.Secrets.Tool.dll --profiles .

      - name: 由组件 config.schema 推导各 profile 的 Apollo namespace 骨架（S1-CFG-003，随测试结果上传）
        run: dotnet tools/Qian.Config.Tool/bin/Release/net10.0/Qian.Config.Tool.dll . --out TestResults/evidence/apollo-namespaces

      - name: 依赖图门禁
        run: python3 scripts/check_deps.py --solution Qian.slnx --no-restore

      - name: 门禁自测（tests/gates 样例项目）
        run: python3 -m unittest discover -s tests/gates -v

      - name: 触发过滤自检（.NET 源码读取的 docs/、pm/ 文件改动仍触发本工作流）
        run: python3 scripts/dotnet_ci.py paths-check

      - name: 安装固定摘要的真实 OpenAPI 兼容检查器
        run: python3 scripts/prepare_contract_tools.py --destination "$RUNNER_TEMP/qian-contract-tools"

      - name: 等待镜像预拉结束（至多 120 秒，超时照常测试，没拉完的由 Testcontainers 补拉）
        run: python3 scripts/dotnet_ci.py wait-prefetch --state "$RUNNER_TEMP/prefetch" --timeout 120

      - name: 单元与集成测试（共享容器与真实 Apollo）
        env:
          QIAN_BUF_PATH: ${{ runner.temp }}/qian-contract-tools/buf
          QIAN_OASDIFF_PATH: ${{ runner.temp }}/qian-contract-tools/oasdiff
          QIAN_TEST_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/evidence
          QIAN_PRODUCT_FILTER_REPORT: ${{ github.workspace }}/TestResults/evidence/product-capability-filter.json
          QIAN_PROFILE_EQUIVALENCE_REPORT: ${{ github.workspace }}/TestResults/evidence/profile-equivalence.json
        run: dotnet test --solution Qian.slnx -c Release --no-build --results-directory TestResults --report-xunit-trx

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  # plugins/qian.identity.client 的 x-aot 以此作业为依据（S1-IDP-014）：判断兼容性只看 ILC 结果，不看 Kun 包元数据（S1-KUN-015）。
  # 发布路径同镜像流水线的 NativeAOT 模板（deploy/images/aot.Dockerfile），另加 ILC 警告即失败、逐条列出；与构建测试作业并行。
  identity-aot:
    name: 身份依赖方组件 NativeAOT 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NativeAOT 工具链（ubuntu-latest 自带 clang 与 zlib，缺失时才安装）
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: 发布 linux-x64 NativeAOT（ILC 有任何 IL 警告即失败）
        run: dotnet publish tools/Qian.Identity.Client.AotSmoke -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o "$RUNNER_TEMP/identity-aot"

      - name: 产物是原生可执行文件
        run: |
          test -x "$RUNNER_TEMP/identity-aot/Qian.Identity.Client.AotSmoke"
          if [ -e "$RUNNER_TEMP/identity-aot/Qian.Identity.Client.AotSmoke.dll" ]; then
            echo "没有按 NativeAOT 发布：csproj 需声明 PublishAot" >&2
            exit 1
          fi

      - name: 运行原生二进制：挂载组件并做启动与端点冒烟
        run: '"$RUNNER_TEMP/identity-aot/Qian.Identity.Client.AotSmoke"'

  native-data-aot:
    name: 原生数据严格发布与真实 PostgreSQL 验收
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NativeAOT 工具链
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi
      - name: 严格发布 Linux 原生探针
        run: dotnet publish tools/Qian.Data.Native.Probe -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o "$RUNNER_TEMP/native-data"
      - name: 核验产物形态
        run: test -x "$RUNNER_TEMP/native-data/Qian.Data.Native.Probe" && test ! -e "$RUNNER_TEMP/native-data/Qian.Data.Native.Probe.dll"
      - name: 原生进程执行真实受限 PostgreSQL 事务与隔离
        env:
          QIAN_REQUIRE_DOCKER: '1'
          QIAN_NATIVE_DATA_EXECUTABLE: ${{ runner.temp }}/native-data/Qian.Data.Native.Probe
        run: dotnet test --project tests/Qian.Data.Native.Postgres.AotTests -c Release --report-xunit-trx --results-directory TestResults/native-data-aot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-data-aot-results
          path: TestResults/native-data-aot/

  gateway-host-aot:
    name: 生产网关完整 NativeAOT 与真实依赖验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NativeAOT 工具链
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi
      - name: 严格发布实际生产宿主
        run: dotnet publish hosts/Qian.Gateway.Host -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o "$RUNNER_TEMP/gateway-host"
      - name: 核验实际原生产物
        run: test -x "$RUNNER_TEMP/gateway-host/Qian.Gateway.Host" && test ! -e "$RUNNER_TEMP/gateway-host/Qian.Gateway.Host.dll"
      - name: 原生网关运行真实 Apollo、受限 PG、Redis 与身份登录换签
        env:
          QIAN_REQUIRE_DOCKER: '1'
          QIAN_GATEWAY_HOST_EXECUTABLE: ${{ runner.temp }}/gateway-host/Qian.Gateway.Host
        run: dotnet test --project tests/Qian.Gateway.Host.AotTests -c Release --report-xunit-trx --results-directory TestResults/gateway-host-aot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-host-aot-results
          path: TestResults/gateway-host-aot/

  native-audit-aot:
    name: 原生审计严格发布与真实 PostgreSQL 验收
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NativeAOT 工具链
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi
      - name: 严格发布 Linux 原生探针
        run: dotnet publish tools/Qian.Audit.Native.Probe -c Release -r linux-x64 -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o "$RUNNER_TEMP/native-audit"
      - name: 核验产物形态
        run: test -x "$RUNNER_TEMP/native-audit/Qian.Audit.Native.Probe" && test ! -e "$RUNNER_TEMP/native-audit/Qian.Audit.Native.Probe.dll"
      - name: 原生进程执行真实受限 PostgreSQL 审计链与业务事务
        env:
          QIAN_REQUIRE_DOCKER: '1'
          QIAN_NATIVE_AUDIT_EXECUTABLE: ${{ runner.temp }}/native-audit/Qian.Audit.Native.Probe
        run: dotnet test --project tests/Qian.Audit.Native.AotTests -c Release --report-xunit-trx --results-directory TestResults/native-audit-aot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-aot-results
          path: TestResults/native-audit-aot/
