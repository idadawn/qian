name: documentation
on:
  push:
    branches: [main]
    paths: ['packages/**', 'plugins/**', 'profiles/**', 'src/**', 'tools/Qian.Docs.Tool/**', 'tests/Qian.Docs.Tests/**', 'schemas/**', 'docs/generated/**', '*.props', '*.targets', 'Qian.slnx', 'global.json', 'package.json', 'pnpm*', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['packages/**', 'plugins/**', 'profiles/**', 'src/**', 'tools/Qian.Docs.Tool/**', 'tests/Qian.Docs.Tests/**', 'schemas/**', 'docs/generated/**', '*.props', '*.targets', 'Qian.slnx', 'global.json', 'package.json', 'pnpm*', '.github/workflows/documentation.yml']
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  event-contracts:
    name: 派生文档与事件模式校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter qian... build
      - run: pnpm --filter ./packages/qian-runtime build
      - name: 语义绑定及错误反例
        run: dotnet run --project tests/Qian.Docs.Tests -c Release
      - name: CLI 与文档模板验收
        run: pnpm --filter qian test
      - name: 当前源码声明与调用模式必须一致
        run: |
          mkdir -p TestResults
          pnpm exec qian docs generate --profile platform --json > TestResults/docs-report.json 2> TestResults/docs-diagnostics.json || { cat TestResults/docs-diagnostics.json; exit 1; }
      # G2 文档新鲜度（ADR-020 D20.9、组件模型规格 §10.3、PRD §14 C18）：上一步已按当前源码重写 docs/generated，有修改或新文件即失败。
      - name: 派生文档新鲜度：docs/generated 必须与重新生成的结果一致
        run: |
          drift="$(git status --porcelain -- docs/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff --stat -- docs/generated
            echo "::error::docs/generated 与源码派生结果不一致：先 pnpm --filter qian... build，再 pnpm exec qian docs generate --profile platform，提交 docs/generated；也可下载本次运行的 derived-docs-and-events 产物（ADR-020 D20.9 / 组件模型规格 §10.3 G2）。"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-docs-and-events
          path: |
            docs/generated/
            TestResults/docs-*.json
