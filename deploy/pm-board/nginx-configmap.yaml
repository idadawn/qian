apiVersion: v1
kind: ConfigMap
metadata:
  name: qian-pm-board-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # builder 容器把看板生成到 /site/current（符号链接指向最近一次生成的提交）；
      # 任务源文件仍取 git-sync 的检出 /git/current（符号链接指向最新提交）
      root /site/current;
      index index.html;
      autoindex off;

      # 看板数据内嵌在 index.html，每次提交都会变，禁止缓存
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;

      types {
        text/html                 html;
        application/json          json;
        text/markdown             md;
        text/plain                txt;
        text/css                  css;
        application/javascript    js;
        image/svg+xml             svg;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      # 只暴露看板需要的三个文件与任务源文件，其余目录不列出
      location = / { try_files /index.html =404; }
      location = /index.html { }
      location = /tasks.json { }
      location = /STATUS.md { default_type text/markdown; }
      location /tasks/ { alias /git/current/pm/tasks/; default_type text/markdown; }
      location / { return 404; }
    }
