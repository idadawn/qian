apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qian-tools

resources:
  - namespace.yaml
  - nginx-configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: qian-pm-board-builder
    files:
      - builder.py

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: qian-pm-board
      app.kubernetes.io/part-of: qian
