apiVersion: apps/v1
kind: Deployment
metadata:
  name: qian-pm-board
spec:
  replicas: 1
  # 滚动更新（S1-PM-005）：新 Pod 就绪（首版看板生成完）后才停旧 Pod；新 Pod 拉不到镜像或排不上时，旧版照常提供看板。
  # 前提是 qd 的 CPU 请求余量放得下第二个 Pod：2026-10-16 qd 已请求 7980m / 8000m，所以三个容器各只请求 5m
  #（实测 git-sync 4m、builder 1m、nginx 1m），一个 Pod 共 15m。余量不足时新 Pod 停在 Pending，不影响旧版。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: qian-pm-board
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qian-pm-board
    spec:
      # 与文档站一样固定在 qd：worker 节点从 registry.k8s.io 的镜像代理拉 git-sync 时会遇到 502（2026-10-15），
      # qd 上文档站已在用同版本的 git-sync 与 nginx 镜像，无需再拉
      nodeSelector:
        kubernetes.io/hostname: qd
      automountServiceAccountToken: false
      securityContext:
        # git-sync 默认以 65533 运行；nginx-unprivileged 可用任意 uid，统一成同一用户以便共享 emptyDir
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          env:
            - name: GITSYNC_REPO
              value: git@github.com:idadawn/qian.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: 60s
            - name: GITSYNC_DEPTH
              value: "1"
            - name: GITSYNC_SSH_KEY_FILE
              value: /etc/git-secret/ssh
            - name: GITSYNC_SSH_KNOWN_HOSTS_FILE
              value: /etc/git-secret/known_hosts
            - name: GITSYNC_MAX_FAILURES
              value: "-1"
          volumeMounts:
            - name: repo
              mountPath: /git
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
          resources:
            requests: { cpu: 5m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # 看板生成物不进 git（S1-PM-004）：每次 git-sync 换了提交，就用该提交的 scripts/pm.py 生成到 /site
        - name: builder
          image: python:3.13-alpine
          command: ["python3", "-u", "/opt/builder/builder.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: site
              mountPath: /site
            - name: builder
              mountPath: /opt/builder
              readOnly: true
          resources:
            requests: { cpu: 5m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: site
              mountPath: /site
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # 首版看板生成之前 / 返回 404，Pod 不就绪
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: repo
          emptyDir: {}
        - name: site
          emptyDir:
            sizeLimit: 64Mi
        - name: builder
          configMap:
            name: qian-pm-board-builder   # kustomize 由 builder.py 生成并加哈希后缀，改脚本即滚动更新
        - name: nginx-conf
          configMap:
            name: qian-pm-board-nginx
        - name: git-secret
          secret:
            secretName: qian-pm-board-git   # 由 bootstrap.sh 创建：只读 deploy key + known_hosts
            defaultMode: 0440
