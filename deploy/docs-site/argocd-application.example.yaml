# 复制到部署仓库的 env-ds/argocd/ 目录并加入其 kustomization（命名沿用 <app>-application.yaml）
# 前提：ArgoCD 已有能读取 git@github.com:idadawn/qian.git 的仓库凭据（任务看板已配置 argocd/qian-repo-ssh）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qian-docs-site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:idadawn/qian.git
    path: deploy/docs-site
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: qian-tools
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
